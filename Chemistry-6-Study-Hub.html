<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemistry 6 — Student & Family Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2A38; --ink-soft:#46586B; --paper:#F7F9F8; --card:#FFFFFF;
  --teal:#0E7C86; --teal-dark:#0A5A62; --amber:#E8A33D; --amber-soft:#FDF3E3;
  --line:#DEE6E4; --good:#2E7D4F; --bad:#C0392B;
  --u1:#0E7C86; --u2:#4B7BE5; --u3:#7C5CBF; --u4:#C2537B; --u5:#D96C3B; --u6:#3E8E5A;
  --r:14px;
}
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none!important; animation:none!important} }
body{background:var(--paper); color:var(--ink); font-family:'Atkinson Hyperlegible',system-ui,sans-serif; font-size:17px; line-height:1.6}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif; line-height:1.2}
.mono{font-family:'JetBrains Mono',monospace}
a{color:var(--teal-dark)}
button{font-family:inherit; cursor:pointer}
:focus-visible{outline:3px solid var(--amber); outline-offset:2px; border-radius:4px}
.wrap{max-width:1060px; margin:0 auto; padding:0 20px}

/* ---------- nav ---------- */
nav{position:sticky; top:0; z-index:50; background:rgba(247,249,248,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.nav-in{display:flex; align-items:center; gap:14px; padding:10px 20px; max-width:1060px; margin:0 auto; flex-wrap:wrap}
.basis-badge{margin-right:auto; order:1; display:flex; align-items:center; height:96px}
.basis-badge img{height:100%; width:auto; display:block}

.brand{font-family:'Space Grotesk'; font-weight:700; font-size:1.05rem; color:var(--ink); text-decoration:none; order:3; display:flex; align-items:center; gap:9px}
.brand .flask{width:26px;height:26px;border-radius:7px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:.85rem}
.navtiles{display:flex; gap:6px; flex-wrap:wrap; order:2}
.ntile{display:block; text-decoration:none; border:1.5px solid var(--line); border-radius:8px; padding:3px 8px; font-family:'Space Grotesk'; font-weight:700; font-size:.85rem; color:var(--ink); background:#fff}
.ntile small{display:block; font-size:.55rem; font-weight:500; color:var(--ink-soft); letter-spacing:.02em}
.ntile:hover{border-color:currentColor}
.ntile.active{color:#fff!important; border-color:transparent}

/* ---------- element tiles (signature) ---------- */
.etile{border:2px solid; border-radius:12px; background:#fff; padding:14px 14px 12px; text-decoration:none; color:var(--ink); display:flex; flex-direction:column; min-height:150px; position:relative; transition:transform .15s ease, box-shadow .15s ease}
.etile:hover{transform:translateY(-3px); box-shadow:0 8px 22px rgba(30,42,56,.12)}
.etile .num{font-family:'JetBrains Mono'; font-size:.8rem; color:var(--ink-soft)}
.etile .sym{font-family:'Space Grotesk'; font-weight:700; font-size:2.4rem; margin-top:2px}
.etile .ename{font-weight:700; font-size:.95rem; margin-top:auto}
.etile .emeta{font-size:.75rem; color:var(--ink-soft); font-family:'JetBrains Mono'}
.tilegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; margin:22px 0 8px}

/* ---------- hero ---------- */
.hero{padding:54px 0 30px}
.hero .kicker{font-family:'JetBrains Mono'; font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; color:var(--teal-dark)}
.hero h1{font-size:clamp(2rem,5vw,3.1rem); margin:10px 0 14px; max-width:760px}
.hero h1 em{font-style:normal; color:var(--teal)}
.hero p{max-width:680px; color:var(--ink-soft); font-size:1.05rem}

/* ---------- cards & sections ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:22px 24px; margin:18px 0}
.section-h{display:flex; align-items:baseline; gap:12px; margin:34px 0 6px}
.section-h h2{font-size:1.45rem}
.section-h .tag{font-family:'JetBrains Mono'; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:#fff; padding:3px 9px; border-radius:99px}
.levelup{background:var(--amber-soft); border:1.5px solid var(--amber); border-radius:12px; padding:14px 16px; margin:14px 0 4px; font-size:.97rem}
.levelup b.lu{font-family:'Space Grotesk'; color:#9A6614; display:block; margin-bottom:4px; font-size:.85rem; letter-spacing:.06em; text-transform:uppercase}
.parentbox{border-left:5px solid; border-radius:0 12px 12px 0; background:#fff; padding:16px 20px; margin:16px 0}
.parentbox h3{font-size:1.02rem; margin-bottom:8px}
.parentbox ul{margin:0 0 0 20px}
.parentbox li{margin:5px 0}
.vocab{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0}
.vocab span{background:#fff; border:1.5px solid var(--line); border-radius:99px; padding:3px 12px; font-size:.85rem; font-weight:700}
.theory p{margin:10px 0}
.theory ul,.theory ol{margin:8px 0 8px 22px}
.theory li{margin:4px 0}
.theory table{border-collapse:collapse; margin:12px 0; width:100%; font-size:.93rem}
.theory th,.theory td{border:1px solid var(--line); padding:7px 10px; text-align:left}
.theory th{background:var(--paper); font-family:'Space Grotesk'; font-size:.85rem}
.formula{font-family:'JetBrains Mono'; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:2px 8px; white-space:nowrap}

/* ---------- sims ---------- */
.simcard{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin:16px 0; background:#fff}
.simcard .simhead{padding:14px 18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.simcard .simhead h3{font-size:1.05rem; margin-right:auto}
.simframe{width:100%; aspect-ratio:16/10; border:0; display:block; background:#111}
.simload{width:100%; aspect-ratio:16/10; display:grid; place-items:center; background:linear-gradient(135deg,#10333a,#0E7C86); color:#fff; border:0; font-family:'Space Grotesk'; font-size:1.05rem; font-weight:700}
.simload:hover{filter:brightness(1.1)}
.simhow{padding:12px 18px; border-top:1px dashed var(--line); font-size:.93rem; color:var(--ink-soft)}

/* ---------- practice problems ---------- */
.prob{border:1px solid var(--line); border-radius:12px; background:#fff; padding:16px 18px; margin:12px 0}
.prob .pq{font-weight:400}
.prob .pnum{font-family:'JetBrains Mono'; font-size:.75rem; color:#fff; border-radius:6px; padding:2px 7px; margin-right:8px}
.prow{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap}
.btn{border:none; border-radius:9px; padding:9px 16px; font-weight:700; font-size:.92rem}
.btn-hint{background:var(--amber-soft); color:#8a5a10; border:1.5px solid var(--amber)}
.btn-sol{background:var(--paper); color:var(--ink); border:1.5px solid var(--line)}
.btn-main{background:var(--teal); color:#fff}
.btn-main:hover{background:var(--teal-dark)}
.btn-ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink)}
.hintbox{margin-top:12px; background:var(--amber-soft); border-radius:10px; padding:12px 14px; font-size:.95rem}
.solbox{margin-top:12px; background:var(--paper); border-radius:10px; padding:12px 16px; font-size:.95rem}
.solbox ol{margin:4px 0 8px 20px}
.solbox li{margin:5px 0}
.solbox .final{font-weight:700; border-top:1px dashed var(--line); padding-top:8px; margin-top:8px}

/* ---------- test engine ---------- */
.testbar{position:sticky; top:52px; z-index:40; display:flex; align-items:center; gap:16px; background:var(--ink); color:#fff; border-radius:12px; padding:12px 18px; margin:14px 0; flex-wrap:wrap}
.timer{font-family:'JetBrains Mono'; font-size:1.7rem; font-weight:700; letter-spacing:.04em}
.timer.warn{color:var(--amber)} .timer.danger{color:#FF6B5B; animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.testbar .tinfo{font-size:.85rem; opacity:.85}
.testbar .spacer{margin-left:auto}
.qcard{background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:22px 24px; margin:14px 0}
.qcard .qtext{font-size:1.1rem; margin-bottom:16px}
.opt{display:block; width:100%; text-align:left; background:var(--paper); border:2px solid var(--line); border-radius:10px; padding:12px 14px; margin:8px 0; font-size:1rem}
.opt:hover{border-color:var(--teal)}
.opt.sel{border-color:var(--teal); background:#E5F2F3; font-weight:700}
.qnav{display:flex; flex-wrap:wrap; gap:6px; margin:14px 0}
.qdot{width:34px; height:34px; border-radius:8px; border:1.5px solid var(--line); background:#fff; font-family:'JetBrains Mono'; font-size:.8rem}
.qdot.answered{background:var(--teal); color:#fff; border-color:var(--teal)}
.qdot.cur{outline:3px solid var(--amber)}
.result-hero{text-align:center; padding:34px 20px}
.result-hero .score{font-family:'Space Grotesk'; font-weight:700; font-size:3.4rem}
.review-q{border:1px solid var(--line); border-left-width:6px; border-radius:10px; background:#fff; padding:14px 18px; margin:10px 0}
.review-q.ok{border-left-color:var(--good)} .review-q.no{border-left-color:var(--bad)}
.review-q .ra{font-size:.95rem; margin-top:6px}
.review-q .expl{font-size:.9rem; color:var(--ink-soft); margin-top:6px; background:var(--paper); border-radius:8px; padding:8px 12px}
.pill-ok{color:var(--good); font-weight:700} .pill-no{color:var(--bad); font-weight:700}

.breadcrumb{font-size:.85rem; margin:20px 0 0; color:var(--ink-soft)}
.unit-hero{display:flex; gap:22px; align-items:center; padding:26px 0 8px; flex-wrap:wrap}
.unit-hero .etile{min-height:130px; width:150px; flex-shrink:0; cursor:default}
.unit-hero .etile:hover{transform:none; box-shadow:none}
.unit-hero h1{font-size:clamp(1.6rem,4vw,2.4rem)}
.unit-hero p{color:var(--ink-soft); max-width:640px}
footer{margin:60px 0 30px; border-top:1px solid var(--line); padding-top:20px; font-size:.85rem; color:var(--ink-soft)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.notice{font-size:.85rem; color:var(--ink-soft); margin-top:8px}
sub,sup{line-height:0}

/* ---------- cartoon chemist & diagrams ---------- */
.hero{display:flex; align-items:center; gap:28px; flex-wrap:wrap}
.herotext{flex:1 1 460px}
.heroart{flex:0 0 200px; text-align:center}
.heroart svg{width:190px; height:auto; filter:drop-shadow(0 6px 14px rgba(20,40,50,.18))}
.herocap{font-family:'JetBrains Mono'; font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--teal-dark); margin-top:4px}
.unitmascot svg{width:120px; height:auto}
.mmini{display:inline-block; margin-left:auto}
.mmini svg{width:52px; height:auto; vertical-align:middle}
.section-h{align-items:center}
.section-h .mmini{margin-left:8px}
.artcard .artfig{display:flex; flex-wrap:wrap; gap:22px 30px; align-items:flex-start}
.artcard figure{margin:0; flex:1 1 300px; max-width:480px}
.artwrap svg{width:100%; height:auto; display:block}
.artcard figcaption{font-size:.85rem; color:var(--ink-soft); margin-top:6px; text-align:center}
@media (max-width:640px){ .heroart{flex-basis:100%} .unitmascot{display:none} }
</style>
</head>

ward your nose with your hand", "Inhale deeply directly over the container"], "a": 2, "e": "Wafting moves a small, dilute amount of vapor toward you instead of a concentrated breath."}, {"q": "How should chemical waste be disposed of after an experiment?", "o": ["Pour everything down the sink", "Follow the teacher's instructions and use the labeled waste containers", "Take it home", "Put it in the classroom trash can"], "a": 1, "e": "Some chemicals react dangerously or pollute water, so they go into designated waste containers."}, {"q": "A test tube breaks on the floor. What should a student do?", "o": ["Ignore it", "Tell the teacher and use a broom and dustpan — never bare hands", "Kick the glass under the lab bench", "Pick up the pieces quickly by hand"], "a": 1}, {"q": "Before starting a lab, a student with long hair should…", "o": ["tie it back", "cover it with a paper towel", "put it inside their goggles", "wear it down"], "a": 0, "e": "Loose hair can catch fire or drag through chemicals."}, {"q": "A chemical entering the body through the skin is called…", "o": ["absorption", "ingestion", "condensation", "inhalation"], "a": 0}, {"q": "A chemical entering the body when you breathe it in is called…", "o": ["filtration", "absorption", "inhalation", "ingestion"], "a": 2}, {"q": "A chemical entering the body when it is swallowed is called…", "o": ["inhalation", "ingestion", "absorption", "diffusion"], "a": 1}, {"q": "Which practice best reduces exposure by INHALATION?", "o": ["Wearing gloves", "Working with fuming chemicals in a fume hood", "Using weigh paper", "Wearing closed-toe shoes"], "a": 1, "e": "A fume hood pulls vapors away from your face and out of the room."}, {"q": "Which practice best reduces exposure by ABSORPTION through the skin?", "o": ["Wafting", "Reading the label twice", "Working in a fume hood", "Wearing gloves and a lab apron"], "a": 3}, {"q": "Why must students wear closed-toe shoes in the lab?", "o": ["Because sandals are too comfortable", "To look professional", "To protect feet from spilled chemicals and broken glass", "To keep the floor clean"], "a": 2}, {"q": "Which piece of equipment measures the volume of a liquid most precisely?", "o": ["Test tube", "Beaker", "Graduated cylinder", "Erlenmeyer flask"], "a": 2, "e": "Beakers and flasks give only rough volumes; the narrow, marked graduated cylinder is far more precise."}, {"q": "An Erlenmeyer flask (cone-shaped with a narrow neck) is especially useful for…", "o": ["swirling and mixing liquids without splashing", "measuring exact volumes", "heating solids to very high temperatures", "weighing solids"], "a": 0}, {"q": "A beaker is best used for…", "o": ["holding, mixing, and heating liquids when only an approximate volume is needed", "measuring volume precisely", "storing chemicals for years", "transferring one drop at a time"], "a": 0}, {"q": "Which piece of equipment helps pour a liquid into a narrow-mouthed container without spilling?", "o": ["Pipet", "Stir rod", "Funnel", "Watch glass"], "a": 2}, {"q": "In this course, what is the safest common way to heat a substance?", "o": ["In your hands", "With a hair dryer", "Over an open campfire", "On a hot plate"], "a": 3}, {"q": "A stir rod is used to…", "o": ["mix solutions", "measure volume", "hold hot beakers", "measure temperature"], "a": 0}, {"q": "A test tube is best used for…", "o": ["holding or mixing small amounts of a substance", "measuring large volumes", "weighing powders", "filtering mixtures"], "a": 0}, {"q": "A pipet is used to…", "o": ["heat liquids", "support a funnel", "transfer small, measured amounts of liquid", "grind solids"], "a": 2}, {"q": "Why is weigh paper (or a weigh boat) placed on a balance before massing a solid chemical?", "o": ["To change the units to liters", "To make the sample heavier", "To keep the chemical off the balance pan and allow easy transfer", "To speed up the balance"], "a": 2}, {"q": "To read the volume of water in a graduated cylinder correctly, you should 00 g.", "Check: grams are smaller units, so the number should get bigger. ✓"], "ans": "2,500 g"}, {"q": "Convert <b>340 milliliters</b> to liters.", "hint": "milli- means 1/1000. Moving from a small unit to a big unit makes the number smaller.", "steps": ["1,000 mL = 1 L.", "340 mL ÷ 1,000 = 0.340 L.", "Check: liters are bigger units, so the number should shrink. ✓"], "ans": "0.340 L"}, {"q": "Calculate <b>4.31 × 2.1</b> and report the answer with correct significant figures.", "hint": "For multiplication, your answer keeps as many sig figs as the factor with the FEWEST sig figs.", "steps": ["4.31 has 3 sig figs; 2.1 has 2 sig figs.", "Multiply: 4.31 × 2.1 = 9.051.", "Round to 2 sig figs (the fewest): <b>9.1</b>."], "ans": "9.1"}, {"q": "Write <b>0.000482</b> in scientific notation.", "hint": "Move the decimal until exactly one non-zero digit sits in front. Count the hops — moving right means a NEGATIVE exponent.", "steps": ["Move the decimal 4 places right: 0.000482 → 4.82.", "Moving right for a small number gives a negative exponent.", "Answer: <b>4.82 × 10<sup>−4</sup></b>."], "ans": "4.82 × 10⁻⁴"}, {"q": "A student measures the boiling point of water three times: 96.1 °C, 96.0 °C, and 96.2 °C. The true value is 100 °C. Describe the accuracy and precision.", "hint": "Accuracy = close to the TRUE value. Precision = the measurements are close to EACH OTHER.", "steps": ["The three values are within 0.2 °C of each other → very <b>precise</b>.", "But they are about 4 °C below the true value of 100 °C → <b>not accurate</b>.", "Conclusion: precise but not accurate (possibly a miscalibrated thermometer)."], "ans": "Precise but not accurate"}, {"q": "In an experiment testing how the amount of fertilizer affects plant height, name the independent variable, the dependent variable, and one variable that should be controlled.", "hint": "Independent = what YOU change on purpose. Dependent = what you MEASURE. Controlled = kept the same for a fair test.", "steps": ["The scientist chooses the amount of fertilizer → <b>independent variable</b>.", "Plant height responds and is measured → <b>dependent variable</b>.", "Everything else must stay equal: same sunlight, same water, same soil, same type of plant → <b>controlled variables</b>."], "ans": "IV: fertilizer amount • DV: plant height • Controlled: light, water, soil, plant type"}, {"q": "You need to measure exactly 25.0 mL of vinegar and then find its mass. Which two pieces of equipment do you use, and how do you read the volume correctly?", "hint": "One tool measures liquid volume precisely; another measures mass. Remember the curve at the top of the liquid.", "steps": ["Use a <b>graduated cylinder</b> for 25.0 mL — it is far more precise than a beaker.", "Read at eye level, at the <b>bottom of the meniscus</b> (the curved surface).", "Then use a <b>balance</b>: mass an empty container, add the vinegar, and subtract."], "ans": "Graduated cylinder (read bottom of meniscus at eye level) + balance"}], "2": [{"q": "A metal cube has a mass of <b>21.6 g</b> and each side measures <b>2.0 cm</b>. What is its density, and will it float in water?", "hint": "First find volume: V = length × width × height. Then d = m ÷ V. Compare to 1 g/mL (1 cm³ = 1 mL).", "steps": ["Volume = 2.0 × 2.0 × 2.0 = 8.0 cm³.", "Density = 21.6 g ÷ 8.0 cm³ = 2.7 g/cm³.", "2.7 g/cm³ > 1 g/mL, so it <b>sinks</b>. (2.7 g/cm³ is the density of aluminum!)"], "ans": "2.7 g/cm³ — it sinks"}, {"q": "A graduated cylinder contains 40.0 mL of water. After a small toy is dropped in, the water reads 47.5 mL. The toy's mass is 15.0 g. Find the toy's density.", "hint": "The rise in water level IS the toy's volume (displacement). Then divide mass by that volume.", "steps": ["Volume of toy = 47.5 − 40.0 = 7.5 mL.", "Density = 15.0 g ÷ 7.5 mL = <b>2.0 g/mL</b>.", "Since 2.0 > 1, the toy sinks — which is why it's at the bottom of the cylinder!"], "ans": "2.0 g/mL"}, {"q": "Classify each: (a) helium gas, (b) chocolate-chip cookie, (c) apple juice with no pulp, (d) baking soda (NaHCO₃).", "hint": "Ask two questions: Is it ONE substance or a blend? If one substance — one kind of atom (element) or more (compound)? If a blend — uniform (homogeneous) or chunky (heterogeneous)?", "steps": ["(a) Helium = one kind of atom → <b>element</b>.", "(b) Cookie = visible different parts → <b>heterogeneous mixture</b>.", "(c) Filtered juice = uniform blend → <b>homogeneous mixture</b>.", "(d) NaHCO₃ = multiple elements chemically bonded in a fixed formula → <b>compound</b>."], "ans": "(a) element (b) heterogeneous mixture (c) homogeneous mixture (d) compound"}, {"q": "You need <b>50.0 g</b> of ethanol (density 0.79 g/mL) but only have a graduated cylinder. What volume should you measure out?", "hint": "Rearrange d = m/V to solve for V: V = m ÷ d.", "steps": ["V = m ÷ d = 50.0 g ÷ 0.79 g/mL.", "V ≈ 63.3 mL.", "Measure about <b>63.3 mL</b> of ethanol in the graduated cylinder."], "ans": "≈ 63.3 mL"}, {"q": "Identify each as a physical or chemical change: (a) shattering glass, (b) fireworks exploding, (c) dew forming on grass, (d) copper turning green over years.", "hint": "Chemical change = a NEW substance forms (look for color change, gas, light/heat, new odor). Physical change = same substance, different form.", "steps": ["(a) Broken glass is still glass → <b>physical</b>.", "(b) Explosive reactions create new gases, heat, light → <b>chemical</b>.", "(c) Water vapor condensing is a state change → <b>physical</b>.", "(d) The green layer is a NEW substance (copper compounds) → <b>chemical</b>."], "ans": "(a) physical (b) chemical (c) physical (d) chemical"}, {"q": "Which phase change is happening: a scented wax melt slowly 'disappears' over weeks without ever becoming liquid?", "hint": "Solid → gas with no liquid stage has a special name.", "steps": ["The solid becomes gas directly (that's why you smell it!).", "Solid → gas skipping liquid = <b>sublimation</b>."], "ans": "Sublimation"}, {"q": "A liquid has a density of 1.2 g/mL. What is the mass of 250 mL of it?", "hint": "Rearrange d = m/V to solve for mass: m = d × V.", "steps": ["m = d × V = 1.2 g/mL × 250 mL.", "m = <b>300 g</b>."], "ans": "300 g"}, {"q": "Explain, using particles, why a gas fills its whole container but a solid keeps its shape.", "hint": "Think about how fast particles move and how strongly they hold onto each other in each state.", "steps": ["In a <b>solid</b>, particles are locked in fixed positions and only vibrate — so the shape stays.", "In a <b>gas</b>, particles move very fast, are far apart, and barely attract each other.", "With nothing holding them together, gas particles spread out to fill all available space."], "ans": "Solid particles vibrate in place; gas particles fly freely and spread out"}], "3": [{"q": "An ion has 20 protons, 20 neutrons, and 18 electrons. Identify the element, its mass number, and its charge.", "hint": "Protons identify the element (atomic number). Mass number = protons + neutrons. Charge = protons − electrons.", "steps": ["20 protons → atomic number 20 → <b>calcium (Ca)</b>.", "Mass number = 20 + 20 = <b>40</b>.", "Charge = 20 − 18 = <b>2+</b>.", "This ion is written Ca²⁺ (calcium-40)."], "ans": "Calcium-40, Ca²⁺"}, {"q": "Write the longhand electron configuration of sulfur (S, atomic number 16).", "hint": "Fill in order: 1s (2 max), 2s (2), 2p (6), 3s (2), 3p (6)… until you've placed 16 electrons.", "steps": ["1s² uses 2 (total 2).", "2s² uses 2 (total 4).", "2p⁶ uses 6 (total 10).", "3s² uses 2 (total 12).", "3p⁴ uses the last 4 (total 16).", "Answer: <b>1s²2s²2p⁶3s²3p⁴</b>."], "ans": "1s²2s²2p⁶3s²3p⁴"}, {"q": "Write the shorthand (noble-gas) configuration of potassium (K, atomic number 19).", "hint": "Find the noble gas that comes BEFORE potassium, put it in brackets, then keep filling.", "steps": ["The noble gas before K is argon (Ar, 18 electrons).", "Potassium has 1 electron beyond argon.", "That electron goes into 4s.", "Answer: <b>[Ar]4s¹</b>."], "ans": "[Ar]4s¹"}, {"q": "How many protons, neutrons, and electrons are in a neutral atom of <b>chlorine-37</b>?", "hint": "Find chlorine's atomic number on the periodic table. The 37 is the mass number.", "steps": ["Chlorine's atomic number is 17 → <b>17 protons</b>.", "Neutrons = 37 − 17 = <b>20 neutrons</b>.", "Neutral atom → electrons = protons = <b>17 electrons</b>."], "ans": "17 p⁺, 20 n⁰, 17 e⁻"}, {"q": "Predict the ion charge for (a) magnesium (Group 2), (b) oxygen (Group 16), (c) potassium (Group 1), (d) bromine (Group 17).", "hint": "Metals lose their few valence electrons (+ charge = group number for Groups 1–2). Nonmetals gain enough to reach 8 (charge = group number − 18).", "steps": ["(a) Mg loses 2 → <b>Mg²⁺</b>.", "(b) O gains 2 → <b>O²⁻</b>.", "(c) K loses 1 → <b>K⁺</b>.", "(d) Br gains 1 → <b>Br⁻</b>."], "ans": "Mg²⁺, O²⁻, K⁺, Br⁻"}, {"q": "A mystery element is shiny, reacts violently with water, and is in the same column as sodium. What family is it in, and what charge will its ion have?", "hint": "Same column = same family = similar properties. What is sodium's family?", "steps": ["Sodium is in Group 1 → the <b>alkali metals</b>.", "Alkali metals have 1 valence electron and lose it easily.", "Its ion will have a <b>1+ charge</b>."], "ans": "Alkali metals; 1+ charge"}, {"q": "Match each model to its key idea: Solid Sphere, Plum Pudding, Peach Pit, Planetary, Electron Cloud.", "hint": "Think of the timeline: featureless ball → electrons in positive goo → tiny dense nucleus → fixed orbits → fuzzy probability cloud.", "steps": ["<b>Solid Sphere:</b> atoms are tiny indivisible balls, identical within an element.", "<b>Plum Pudding:</b> a positive sphere with electrons dotted through it.", "<b>Peach Pit:</b> small, dense, positive nucleus; mostly empty space.", "<b>Planetary:</b> electrons circle the nucleus in fixed paths.", "<b>Electron Cloud:</b> electrons dart randomly within energy levels — the modern view."], "ans": "See steps"}, {"q": "How many electrons does the ion N³⁻ have? (Nitrogen's atomic number is 7.)", "hint": "A negative charge means the atom GAINED electrons.", "steps": ["Neutral N has 7 electrons.", "The 3− charge means 3 electrons were gained.", "7 + 3 = <b>10 electrons</b> (same as neon!)."], "ans": "10 electrons"}], "4": [{"q": "Write the formula for <b>aluminum oxide</b>.", "hint": "Aluminum forms Al³⁺; oxide is O²⁻. Crisscross the charges so the total adds to zero.", "steps": ["Al³⁺ and O²⁻.", "Crisscross: the 3 becomes oxygen's subscript, the 2 becomes aluminum's.", "Check: 2(+3) + 3(−2) = +6 − 6 = 0 ✓", "Answer: <b>Al₂O₃</b>."], "ans": "Al₂O₃"}, {"q": "Name the compound <b>Cu₂S</b>.", "hint": "Copper is a transition metal → needs a Roman numeral. Sulfide is S²⁻. Use the zero-charge rule backwards to find copper's charge.", "steps": ["S is 2−, and there are 2 Cu atoms.", "2 × (Cu charge) + (−2) = 0 → each Cu is 1+.", "Copper with a 1+ charge = copper(I).", "Answer: <b>copper(I) sulfide</b>."], "ans": "Copper(I) sulfide"}, {"q": "Write the formula for <b>calcium phosphate</b>.", "hint": "Calcium is Ca²⁺; phosphate is the polyatomic ion PO₄³⁻. When you need more than one polyatomic ion, wrap it in parentheses.", "steps": ["Ca²⁺ and PO₄³⁻.", "Crisscross: 3 calciums, 2 phosphates.", "Check: 3(+2) + 2(−3) = 0 ✓", "Answer: <b>Ca₃(PO₄)₂</b>."], "ans": "Ca₃(PO₄)₂"}, {"q": "Name the compound <b>P₂O₅</b> (two nonmetals).", "hint": "Two nonmetals = covalent = Greek prefixes. di- = 2, penta- = 5. The second element ends in -ide.", "steps": ["Two P → 'di' + phosphorus.", "Five O → 'pent(a)' + oxide.", "Answer: <b>diphosphorus pentoxide</b>."], "ans": "Diphosphorus pentoxide"}, {"q": "Write the formula for <b>dinitrogen tetroxide</b>.", "hint": "Just translate the prefixes into subscripts — no crisscrossing for covalent compounds!", "steps": ["di- = 2 nitrogens → N₂.", "tetr(a)- = 4 oxygens → O₄.", "Answer: <b>N₂O₄</b>."], "ans": "N₂O₄"}, {"q": "Draw (describe) the Lewis structure of <b>F₂</b>. How many bonds and how many lone pairs on each atom?", "hint": "Each F has 7 valence electrons and needs 8. How many must each atom share to get there?", "steps": ["Each fluorine has 7 valence electrons — one short of 8.", "They share ONE pair → a single bond: F–F.", "Each F keeps its other 6 electrons as 3 lone pairs.", "Result: 1 single bond, 3 lone pairs per fluorine."], "ans": "F–F single bond; 3 lone pairs on each F"}, {"q": "Substance X melts at 850 °C and conducts electricity when dissolved in water. Substance Y melts at 55 °C and never conducts. Identify each bond type and explain.", "hint": "High melting + conducts when dissolved = charged particles. Low melting + no conducting = neutral molecules.", "steps": ["X: high melting point and free ions in solution → <b>ionic</b>.", "Y: low melting point, no charged particles → <b>covalent</b>.", "Ionic lattices need lots of energy to break apart, and their dissolved ions carry current; covalent molecules stay neutral."], "ans": "X is ionic; Y is covalent"}, {"q": "Why can copper wire be bent and stretched without shattering, and why does it conduct electricity so well?", "hint": "Think of the 'sea of electrons' picture of metallic bonding.", "steps": ["In metallic bonding, copper cations sit in a sea of <b>mobile electrons</b>.", "When the wire bends, cations slide past each other, but the electron sea still glues everything together → no shattering (malleable/ductile).", "Those same free-moving electrons carry electric current → excellent conductor."], "ans": "The mobile 'electron sea' holds sliding cations together and carries current"}], "5": [{"q": "Balance: <b>__ Al + __ O₂ → __ Al₂O₃</b>", "hint": "Oxygen appears in pairs on the left but in threes on the right. Find a common multiple of 2 and 3.", "steps": ["O common multiple of 2 and 3 is 6: use 3O₂ (6 O) and 2Al₂O₃ (6 O).", "Now the right side has 4 Al → put 4Al on the left.", "Balanced: <b>4Al + 3O₂ → 2Al₂O₃</b>.", "Check: Al 4=4, O 6=6 ✓"], "ans": "4Al + 3O₂ → 2Al₂O₃"}, {"q": "Balance: <b>__ C₂H₆ + __ O₂ → __ CO₂ + __ H₂O</b>", "hint": "Balance C first, then H, then O last. If O comes out odd, double everything.", "steps": ["C: 2 on left → 2CO₂.", "H: 6 on left → 3H₂O.", "O on right: 2(2) + 3(1) = 7 → needs 7/2 O₂. Fractions not allowed…", "Double every coefficient: <b>2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O</b>.", "Check: C 4=4, H 12=12, O 14=14 ✓"], "ans": "2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O"}, {"q": "Classify each reaction: (a) 2K + I₂ → 2KI  (b) C₅H₁₂ + 8O₂ → 5CO₂ + 6H₂O  (c) 2NaHCO₃ → Na₂CO₃ + H₂O + CO₂", "hint": "Synthesis: many → one. Decomposition: one → many. Combustion: fuel + O₂ → CO₂ + H₂O.", "steps": ["(a) Two substances form one product → <b>synthesis</b>.", "(b) A hydrocarbon burns in O₂ making CO₂ and H₂O → <b>combustion</b>.", "(c) One compound splits into three → <b>decomposition</b>. (This is baking soda in the oven!)"], "ans": "(a) synthesis (b) combustion (c) decomposition"}, {"q": "In a sealed flask, 6.0 g of carbon reacts with 16.0 g of oxygen and nothing is left over. What mass of carbon dioxide forms?", "hint": "Conservation of matter: total mass in = total mass out.", "steps": ["Mass of reactants = 6.0 + 16.0 = 22.0 g.", "No mass escapes the sealed flask.", "Mass of CO₂ = <b>22.0 g</b>."], "ans": "22.0 g"}, {"q": "Write the balanced equation for: 'Solid magnesium reacts with oxygen gas to produce solid magnesium oxide.'", "hint": "Translate the names to formulas first (remember O₂ is diatomic and MgO comes from Mg²⁺ + O²⁻), then balance.", "steps": ["Formulas: Mg + O₂ → MgO.", "O: 2 on left, 1 on right → 2MgO.", "Mg: now 2 on right → 2Mg.", "Balanced: <b>2Mg + O₂ → 2MgO</b> — a synthesis reaction."], "ans": "2Mg + O₂ → 2MgO"}, {"q": "A student mixes two solutions: the beaker gets warm, bubbles form, and a white solid settles. Which THREE signs of chemical change appeared?", "hint": "The signs: color change, new odor, gas produced, precipitate (solid) forms, energy released (heat/light/sound).", "steps": ["Warmth → <b>energy (heat) released</b>.", "Bubbles → <b>a gas was produced</b>.", "White solid settling → <b>a precipitate formed</b>."], "ans": "Heat released, gas produced, precipitate formed"}, {"q": "How many oxygen atoms are on each side of <b>2KClO₃ → 2KCl + 3O₂</b>? Is it balanced?", "hint": "Multiply each coefficient by the subscript of O in that formula.", "steps": ["Left: 2 × 3 = 6 oxygen atoms.", "Right: 3 × 2 = 6 oxygen atoms.", "K: 2 = 2 ✓ and Cl: 2 = 2 ✓.", "All atoms match → <b>balanced</b>."], "ans": "6 O on each side — balanced"}, {"q": "Why is dissolving salt in water NOT a chemical reaction, even though the salt seems to 'disappear'?", "hint": "Ask: is a new substance formed? Could you get the salt back?", "steps": ["The salt is still salt — its particles just spread among the water molecules.", "No new substance forms; no color change, gas, or precipitate.", "Evaporate the water and the same salt returns → a <b>physical change</b>."], "ans": "No new substance forms; it's a physical change"}], "6": [{"q": "Calculate the molar mass of <b>Ca(OH)₂</b>. (Ca = 40.08, O = 16.00, H = 1.01)", "hint": "The subscript 2 outside the parentheses multiplies EVERYTHING inside: 2 oxygens and 2 hydrogens.", "steps": ["Ca: 1 × 40.08 = 40.08", "O: 2 × 16.00 = 32.00", "H: 2 × 1.01 = 2.02", "Total: 40.08 + 32.00 + 2.02 = <b>74.10 g/mol</b>"], "ans": "74.10 g/mol"}, {"q": "How many molecules are in <b>2.50 mol</b> of CO₂?", "hint": "Moles → particles: multiply by Avogadro's number, 6.022 × 10²³.", "steps": ["2.50 mol × 6.022 × 10²³ molecules/mol", "= 15.055 × 10²³", "= <b>1.51 × 10²⁴ molecules</b> (rewrite so one digit is in front)."], "ans": "1.51 × 10²⁴ molecules"}, {"q": "A sample contains <b>3.011 × 10²³</b> atoms of gold. How many moles is that?", "hint": "Particles → moles: divide by Avogadro's number. (Notice: 3.011 is exactly half of 6.022!)", "steps": ["3.011 × 10²³ ÷ 6.022 × 10²³ = 0.5000", "= <b>0.500 mol of gold</b>."], "ans": "0.500 mol"}, {"q": "How many grams are in <b>0.75 mol</b> of NaCl? (Na = 22.99, Cl = 35.45)", "hint": "First find the molar mass of NaCl, then multiply: grams = moles × molar mass.", "steps": ["Molar mass = 22.99 + 35.45 = 58.44 g/mol.", "Mass = 0.75 mol × 58.44 g/mol", "= <b>43.83 g</b> (≈ 43.8 g)."], "ans": "≈ 43.8 g"}, {"q": "How many moles are in <b>90.0 g</b> of water, H₂O? (H = 1.01, O = 16.00)", "hint": "Molar mass first: 2 hydrogens + 1 oxygen. Then moles = grams ÷ molar mass.", "steps": ["Molar mass = 2(1.01) + 16.00 = 18.02 g/mol.", "Moles = 90.0 ÷ 18.02", "= <b>4.99 mol ≈ 5.00 mol of water</b>."], "ans": "≈ 5.00 mol"}, {"q": "Which contains more atoms: <b>1 mol of helium</b> or <b>1 mol of lead</b>? Which has more mass?", "hint": "A mole is a COUNT (like a dozen). Mass depends on how heavy each particle is.", "steps": ["Both contain 6.022 × 10²³ atoms — <b>equal numbers</b>.", "Each lead atom is about 50× heavier than a helium atom.", "So 1 mol of lead (≈207 g) has far <b>more mass</b> than 1 mol of helium (≈4 g)."], "ans": "Same number of atoms; lead has more mass"}, {"q": "Calculate the molar mass of <b>glucose, C₆H₁₂O₆</b>. (C = 12.01, H = 1.01, O = 16.00)", "hint": "Multiply each atomic mass by its subscript, then add all three totals.", "steps": ["C: 6 × 12.01 = 72.06", "H: 12 × 1.01 = 12.12", "O: 6 × 16.00 = 96.00", "Total = 72.06 + 12.12 + 96.00 = <b>180.18 g/mol</b>"], "ans": "180.18 g/mol"}, {"q": "Two-step challenge: how many molecules are in <b>27.03 g</b> of water? (Molar mass of H₂O = 18.02 g/mol)", "hint": "Grams → moles first (divide by molar mass), THEN moles → molecules (multiply by Avogadro's number).", "steps": ["Step 1: 27.03 g ÷ 18.02 g/mol = 1.50 mol.", "Step 2: 1.50 mol × 6.022 × 10²³ = 9.033 × 10²³.", "Answer: <b>≈ 9.03 × 10²³ molecules</b>."], "ans": "≈ 9.03 × 10²³ molecules"}]}};
</script>

  sections:[
   {h:"Staying safe in the lab", body:`
     <p>A chemistry lab is a safe place <b>when everyone follows the rules</b>. The two layers of protection are:</p>
     <ul>
      <li><b>Personal protective equipment (PPE)</b> — things you wear: safety goggles (always, when anyone is working with chemicals), gloves, an apron, closed-toe shoes, and tied-back hair.</li>
      <li><b>Safety equipment</b> — things in the room: the <b>eyewash station</b> (rinse eyes ~15 minutes if chemicals splash in), the <b>safety shower</b> (large spill on your body), the <b>fire extinguisher</b> and <b>fire blanket</b> (small fires / clothing fires), and the <b>fume hood</b> (pulls dangerous vapors away from you).</li>
     </ul>
     <p>Chemicals can enter the body three ways — and each has a defense:</p>
     <table><tr><th>Route</th><th>How it happens</th><th>How to prevent it</th></tr>
     <tr><td><b>Ingestion</b></td><td>swallowing</td><td>never eat, drink, or taste anything in lab; wash hands after</td></tr>
     <tr><td><b>Inhalation</b></td><td>breathing vapors</td><td>use the fume hood; <b>waft</b> odors gently toward your nose instead of sniffing directly</td></tr>
     <tr><td><b>Absorption</b></td><td>through skin or eyes</td><td>goggles, gloves, apron, closed-toe shoes</td></tr></table>
     <p>Afterward, chemical waste goes in the <b>labeled waste containers</b> your teacher points out — never down the drain or in the trash unless you are told to. Broken glass means: tell the teacher, then broom and dustpan, never hands.</p>`,
    levelup:"In Chemistry 7 and 8 you'll read Safety Data Sheets (SDS) — official documents that list every hazard of a chemical. Try finding the SDS for plain table salt online: even 'safe' chemicals have one!"},
   {h:"The right tool for the job", body:`
     <p>Each piece of glassware has a specialty:</p>
     <ul>
      <li><b>Beaker</b> — holds, mixes, and heats liquids; its volume markings are only rough estimates.</li>
      <li><b>Graduated cylinder</b> — <i>the</i> tool for measuring liquid volume. Read the <b>bottom of the meniscus</b> (the liquid's curved surface) at eye level.</li>
      <li><b>Erlenmeyer flask</b> — the cone shape lets you swirl liquids without splashing.</li>
      <li><b>Test tube</b> — small samples and small reactions.</li>
      <li><b>Pipet</b> — transfers small, precise amounts, drop by drop.</li>
      <li><b>Funnel</b> — pours liquids into narrow openings; holds filter paper.</li>
      <li><b>Balance + weigh paper</b> — measures <b>mass</b>; the paper keeps chemicals off the pan.</li>
      <li><b>Hot plate</b> — safe heating; <b>stir rod</b> — mixing; <b>thermometer</b> — temperature in °C.</li>
     </ul>`,
    levelup:"Precision has levels. A beaker might be trusted to ±5 mL, a graduated cylinder to ±0.5 mL, and the burets you'll meet in Honors Chemistry to ±0.05 mL — a hundred times better than the beaker!"},
   {h:"Measurement, SI units & the metric ladder", body:`
     <p>Science uses the <b>SI system</b> so every scientist on Earth speaks the same measurement language:</p>
     <table><tr><th>Quantity</th><th>SI base unit</th><th>Everyday lab unit</th></tr>
     <tr><td>Length</td><td>meter (m)</td><td>cm, mm</td></tr>
     <tr><td>Mass</td><td>kilogram (kg)</td><td><b>gram (g)</b></td></tr>
     <tr><td>Time</td><td>second (s)</td><td>s, min</td></tr>
     <tr><td>Temperature</td><td>Kelvin (K)</td><td>°C in our lab</td></tr>
     <tr><td>Amount of substance</td><td>mole (mol)</td><td>mol (Unit 6!)</td></tr></table>
     <p>Prefixes rescale any unit. From smallest to largest: <span class="formula">milli (0.001) → centi (0.01) → deci (0.1) → base (1) → deka (10) → hecto (100) → kilo (1000)</span>.</p>
     <p><b>Ladder trick:</b> each step is ×10. Going to a <i>smaller</i> unit, the number gets <i>bigger</i> (2.5 kg = 2,500 g) — and vice versa (340 mL = 0.340 L).</p>`,
    levelup:"Beyond the ladder: mega- (10⁶), giga- (10⁹), micro- (10⁻⁶), nano- (10⁻⁹). A human hair is about 80,000 nanometers wide; the atoms you'll study are about 0.1–0.5 nm!"},
   {h:"Significant figures: honest numbers", body:`
     <p>When you measure, you read every marked digit <i>plus one estimated digit</i>. <b>Significant figures</b> (sig figs) are the digits you actually earned — they show how precise your tool was.</p>
     <p><b>Counting rules:</b></p>
     <ol>
      <li>Non-zero digits always count. <span class="formula">523 → 3 sig figs</span></li>
      <li>Zeros <i>between</i> non-zero digits count. <span class="formula">6.070 g… the middle 0 counts</span></li>
      <li><i>Leading</i> zeros never count. <span class="formula">0.0045 → 2 sig figs</span></li>
      <li><i>Trailing</i> zeros count only if there's a decimal point. <span class="formula">120.0 → 4, but 1200 → 2</span></li>
      <li>Exact counts and defined conversions (24 students, 100 cm = 1 m) are <b>infinite</b> — they never limit an answer.</li>
     </ol>
     <p><b>Multiplying or dividing?</b> Your answer keeps as many sig figs as the measurement with the <i>fewest</i>. <span class="formula">4.31 × 2.1 = 9.051 → 9.1</span></p>
     <p><b>Scientific notation</b> writes awkward numbers neatly and makes sig figs crystal clear: <span class="formula">0.000482 = 4.82 × 10⁻⁴</span>. One non-zero digit in front; the exponent counts the decimal hops (negative for tiny numbers).</p>`,
    levelup:"Why does 1200 have only 2 sig figs? Because we can't tell if those zeros were measured or are just placeholders. Scientific notation fixes the ambiguity: 1.2 × 10³ (2 sig figs) vs 1.200 × 10³ (4 sig figs) say different things about your tool."},
   {h:"Accuracy, precision & fair experiments", body:`
     <p>These two words are not twins:</p>
     <ul>
      <li><b>Accuracy</b> — close to the <i>true</i> value. (Darts near the bullseye.)</li>
      <li><b>Precision</b> — repeated measurements close to <i>each other</i>. (Darts tightly grouped — even if they're grouped in the wrong spot!)</li>
     </ul>
     <p>Measuring 24.9, 25.0, 25.1 g when the truth is 30.0 g is precise but not accurate — often the sign of a mis-calibrated instrument.</p>
     <p>In a fair experiment: the <b>independent variable</b> is the one thing you change on purpose (x-axis), the <b>dependent variable</b> is what you measure in response (y-axis), <b>controlled variables</b> are kept identical for every trial, and the <b>control group</b> gets no treatment so you have something to compare against. Data tables and graphs then reveal the relationship — direct (both rise together) or inverse (one rises as the other falls).</p>`,
    levelup:"In Chemistry 8 you'll grade your own accuracy with <b>percent error</b>: |your value − true value| ÷ true value × 100%. The thermometer example above has a percent error of about 17% — time to recalibrate!"}

  blurb:"Everything around you is matter. This unit builds the sorting system chemists use for all of it, and explains melting, boiling, and even why ice floats.",
  parent:[
    "Sort any sample of matter: element, compound, homogeneous mixture, or heterogeneous mixture — with real examples.",
    "Explain the difference using particles: what a molecule is, and why compounds can be broken down chemically but elements can't.",
    "Recognize solids, liquids, and gases by shape, volume, and how their particles move.",
    "Name all six phase changes (melting, freezing, evaporation, condensation, sublimation, deposition) and spot them in daily life.",
    "Tell physical properties/changes apart from chemical ones.",
    "Measure and calculate mass, volume, and density (d = m/V) — and predict whether things float or sink."
  ],
  vocab:["element","compound","molecule","homogeneous","heterogeneous","phase change","sublimation","deposition","physical property","chemical property","mass","volume","density","displacement","buoyant"],
  sections:[
   {h:"The chemist's sorting system", body:`
     <p>Ask two questions about any sample:</p>
     <p><b>Question 1 — Is it one pure substance, or a blend?</b></p>
     <ul>
      <li><b>Pure substance:</b> one thing with a fixed recipe. If it's made of only one kind of atom, it's an <b>element</b> (gold, oxygen gas O<sub>2</sub>). If different elements are chemically bonded in a fixed formula, it's a <b>compound</b> (water H<sub>2</sub>O, table salt NaCl).</li>
      <li><b>Mixture:</b> two or more substances physically together, no fixed recipe, separable without chemistry.</li>
     </ul>
     <p><b>Question 2 (for mixtures) — Is it the same throughout?</b></p>
     <ul>
      <li><b>Homogeneous</b> — uniform everywhere: salt water, clean air, brass.</li>
      <li><b>Heterogeneous</b> — visibly different parts: salad, granite, oil &amp; water.</li>
     </ul>
     <p>Key differences: <b>elements can't be broken down by chemical means; compounds can.</b> And note the word <b>molecule</b> means atoms bonded together — O<sub>2</sub> is a molecule but not a compound (one element), while H<sub>2</sub>O is both.</p>`,
    levelup:"A dissolved homogeneous mixture is called a <b>solution</b>. In Chemistry 7 you'll calculate exactly how concentrated a solution is (molarity), and in Chemistry 8 you'll learn lab techniques — filtration, distillation, chromatography — that pull mixtures apart."},
   {h:"Solid, liquid, gas — a particle story", body:`
     <p>The state of matter is all about how its particles move:</p>
     <table><tr><th>State</th><th>Shape</th><th>Volume</th><th>Particles</th></tr>
     <tr><td><b>Solid</b></td><td>definite</td><td>definite</td><td>locked in place, vibrating</td></tr>
     <tr><td><b>Liquid</b></td><td>takes container's shape</td><td>definite</td><td>close together but sliding past each other</td></tr>
     <tr><td><b>Gas</b></td><td>fills container</td><td>fills container</td><td>far apart, flying fast in all directions</td></tr></table>
     <p>Heating gives particles more energy; cooling takes it away. The six <b>phase changes</b>:</p>
     <ul>
      <li>solid → liquid: <b>melting</b> • liquid → solid: <b>freezing</b></li>
      <li>liquid → gas: <b>boiling / evaporation</b> • gas → liquid: <b>condensation</b> (dew on grass, drops on a cold glass)</li>
      <li>solid → gas directly: <b>sublimation</b> (dry ice "smoking") • gas → solid directly: <b>deposition</b> (frost on a window)</li>
     </ul>
     <p>A phase change never changes <i>what</i> the substance is — ice, liquid water, and steam are all H<sub>2</sub>O.</p>`,
    levelup:"During melting or boiling, temperature stops rising even though you keep heating — all the energy goes into breaking particle attractions, not speeding particles up. Graph temperature vs. time and you'll see flat plateaus. That graph (a heating curve) stars in Chemistry 7."},
   {h:"Physical vs. chemical", body:`
     <p><b>Physical properties</b> can be observed without changing the substance's identity: melting/boiling point, mass, volume, length, color, odor, luster, density, hardness, conductivity, malleability, ductility. <b>Chemical properties</b> describe how a substance <i>can transform</i>: reactivity and flammability.</p>
     <p>Same logic for changes: crush it, melt it, dissolve it — still the same substance (<b>physical change</b>). Burn it, rust it, bake it — a <i>new</i> substance appears (<b>chemical change</b>). Melting ice: physical. Burning wood: chemical (the smoke and ash are new substances).</p>`,
    levelup:"Dissolving salt in water is physical — evaporate the water and identical salt returns. But dissolving zinc in acid is chemical: bubbles of hydrogen gas form and you cannot get the zinc back by evaporating. The test is always: <i>did a new substance form?</i>"},
   {h:"Mass, volume & density", body:`
     <p>Three measurements you'll use all year:</p>
     <ul>
      <li><b>Mass</b> — how much matter (measured on a balance, in grams).</li>
      <li><b>Volume</b> — how much space it takes up. Liquids: graduated cylinder. Boxes: <span class="formula">V = l × w × h</span>. Weird shapes (a rock): <b>water displacement</b> — drop it in, and the rise in water level is its volume.</li>
      <li><b>Density</b> — how tightly packed the matter is: <span class="formula">d = m ÷ V</span> (g/mL or g/cm³).</li>
     </ul>
     <p>Density is the identity clue of the unit: every pure substance has its own. Water's is <b>1 g/mL</b> — denser things sink, less dense things float (they're <i>buoyant</i>). The formula triangle rearranges to <span class="formula">m = d × V</span> and <span class="formula">V = m ÷ d</span>.</p>
     <p><b>Worked example:</b> a 54.0 g metal piece raises the water in a cylinder from 20.0 mL to 40.0 mL. Volume = 20.0 mL, so d = 54.0 ÷ 20.0 = <b>2.70 g/mL</b> — that's aluminum's density!</p>`,
    levelup:"Density explains lava lamps (blobs rise when heated because warming expands them, lowering density), hot-air balloons, and why ice floats — water is one of the only substances whose solid is LESS dense than its liquid. Life in lakes depends on that oddity: ice floats and insulates the water below."}
  ],

"3": {
  sym:"At", name:"Atomic Structure & Periodic Trends", color:"var(--u3)", hex:"#7C5CBF",
  tagline:"Inside the atom & the map of the elements",
  blurb:"Atoms are too small to see — so how do we know what's inside? Follow 200 years of detective work, then learn to read chemistry's greatest map: the periodic table.",
  parent:[
    "Tell the story of the atom through five historical models — Solid Sphere, Plum Pudding, Peach Pit, Planetary, and Electron Cloud — and what discovery drove each change.",
    "Know the three subatomic particles (protons, neutrons, electrons): their charges, masses, and locations.",
    "Count protons, neutrons, and electrons for any atom, ion, or isotope, and calculate mass number and charge.",
    "Navigate the periodic table: periods, groups, and the famous families (alkali metals, halogens, noble gases…).",
    "Predict the charge an element's ion will form from its group.",
    "Write longhand and shorthand electron configurations for elements 1–20."
  ],
  vocab:["atom","proton","neutron","electron","nucleus","atomic number","mass number","isotope","ion","cation","anion","period","group/family","valence electron","electron configuration"],
  sections:[
   {h:"Five models: the atom's biography", body:`
     <p>Nobody has ever seen an atom with the naked eye. Each model below was the best explanation of the evidence at its time — and each new experiment forced an upgrade:</p>
     <ol>
      <li><b>Solid Sphere:</b> atoms are tiny, indestructible balls — identical within an element, different between elements.</li>
      <li><b>Plum Pudding:</b> after the electron was discovered, the atom became a ball of positive "pudding" with negative electrons dotted through it like plums (or chocolate chips).</li>
      <li><b>Peach Pit (nuclear):</b> the famous gold-foil experiment fired particles at thin gold. Most sailed straight through, but a few bounced back — so atoms must be <b>mostly empty space</b> with a tiny, dense, positive <b>nucleus</b> (the "pit").</li>
      <li><b>Planetary:</b> electrons orbit the nucleus in fixed paths at set energy levels, like planets around the sun.</li>
      <li><b>Electron Cloud (modern):</b> electrons don't follow neat orbits — they dart around unpredictably within energy levels, forming a fuzzy "cloud" of places they're likely to be.</li>
     </ol>`,
    levelup:"The gold-foil scientists said it was 'as if you fired a cannonball at tissue paper and it came back and hit you.' Do the scale math: if an atom were a football stadium, the nucleus would be a marble at midfield — yet it holds 99.9% of the mass."},
   {h:"The particle roster", body:`
     <table><tr><th>Particle</th><th>Charge</th><th>Mass</th><th>Location</th></tr>
     <tr><td><b>Proton</b></td><td>+1</td><td>≈ 1 amu</td><td>nucleus</td></tr>
     <tr><td><b>Neutron</b></td><td>0</td><td>≈ 1 amu</td><td>nucleus</td></tr>
     <tr><td><b>Electron</b></td><td>−1</td><td>≈ 1/2000 amu (tiny!)</td><td>outside the nucleus</td></tr></table>
     <p>The bookkeeping rules:</p>
     <ul>
      <li><b>Atomic number = protons.</b> It's the element's ID — change it and you change the element.</li>
      <li><b>Mass number = protons + neutrons</b> (electrons are too light to matter). So <b>neutrons = mass number − atomic number</b>.</li>
      <li><b>Isotopes</b> — same protons, different neutrons (carbon-12 vs carbon-14).</li>
      <li><b>Ions</b> — atoms that lost electrons (<b>cation</b>, positive) or gained them (<b>anion</b>, negative). Charge = protons − electrons. Protons never change!</li>
     </ul>
     <p><b>Example:</b> Ca<sup>2+</sup> with mass number 40 → 20 protons, 40 − 20 = 20 neutrons, and 20 − 2 = 18 electrons.</p>`,
    levelup:"Isotopes are why atomic masses on the table aren't whole numbers: chlorine's 35.45 is the weighted average of chlorine-35 (76%) and chlorine-37 (24%). In Honors Chemistry, mass spectroscopy lets you 'weigh' those isotopes one by one."},
   {h:"Reading the periodic table", body:`
     <p>The table is arranged by <b>increasing atomic number</b>, and the layout is packed with meaning:</p>
     <ul>
      <li><b>Periods</b> — the horizontal rows.</li>
      <li><b>Groups (families)</b> — the vertical columns. Same family = similar chemical behavior.</li>
     </ul>
     <p>The famous families:</p>
     <ul>
      <li><b>Group 1 — Alkali metals:</b> soft, extremely reactive (some explode in water!).</li>
      <li><b>Group 2 — Alkaline earth metals:</b> reactive, in bones (Ca) and fireworks (Mg).</li>
      <li><b>Groups 3–12 — Transition metals:</b> the classic strong, shiny metals (Fe, Cu, Au).</li>
      <li><b>Group 17 — Halogens:</b> very reactive nonmetals; happily bond with metals to make salts.</li>
      <li><b>Group 18 — Noble gases:</b> the loners — full outer energy levels, almost no reactions.</li>
      <li><b>Metalloids</b> line the "staircase" (Si, B…) — part metal, part nonmetal.</li>
      <li><b>Lanthanides &amp; actinides</b> — the two rows parked below the main table.</li>
     </ul>
     <p>Metals dominate the left and middle; nonmetals sit in the upper right.</p>`,
    levelup:"Why do families act alike? Same number of <b>valence electrons</b>. Group 1 has one to lose (→ 1+ ions), Group 17 needs one more (→ 1− ions), Group 18 is already full (→ no ions). This single idea predicts most of the chemistry you'll ever do — and Chemistry 7's trends (atomic radius, electronegativity) grow straight out of it."},
   {h:"Electron configurations (elements 1–20)", body:`
     <p>Electrons fill the atom's energy levels in a strict order, like water filling the lowest cups first:</p>
     <p><span class="formula">1s → 2s → 2p → 3s → 3p → 4s</span> &nbsp; (s-holds 2, p-holds 6)</p>
     <p><b>Longhand:</b> keep filling until you've placed all the electrons (= atomic number). Sulfur (16): <span class="formula">1s²2s²2p⁶3s²3p⁴</span> — check: 2+2+6+2+4 = 16 ✓</p>
     <p><b>Shorthand:</b> replace the inner core with the previous noble gas in brackets. Sulfur: <span class="formula">[Ne]3s²3p⁴</span>. Potassium (19): <span class="formula">[Ar]4s¹</span>.</p>
     <p>The table itself is your cheat sheet: the row and block an element sits in tell you exactly where its configuration ends.</p>`,
    levelup:"Those superscripts are why the periodic table has its odd shape: the s-block is 2 columns wide, the p-block 6 — matching the capacity of each orbital type. In Chemistry 7 you'll extend configurations to element 36 and use them to explain the table's trends."}
  ],

"4": {
  sym:"Cm", name:"Compound Structures & Properties", color:"var(--u4)", hex:"#C2537B",
  tagline:"Bonding, naming & why materials behave the way they do",
  blurb:"Why is salt crunchy and wax soft? Why does copper bend but glass shatter? The answer is bonding — and once you can name compounds, you can speak chemistry's language.",
  parent:[
    "Explain the three bond types: ionic (electrons transferred), covalent (electrons shared), and metallic (a 'sea' of electrons).",
    "Use the zero-charge rule to build correct ionic formulas — including with Roman numerals for transition metals.",
    "Name and write formulas for compounds with the nine polyatomic ions on our list (ammonium, hydroxide, carbonate, sulfate, phosphate, nitrate, nitrite, sulfite, chlorate).",
    "Name covalent compounds with Greek prefixes (mono- through deca-).",
    "Draw Lewis dot diagrams for atoms and simple molecules, including the diatomic elements.",
    "Predict properties (melting point, conductivity) from the bond type."
  ],
  vocab:["ionic bond","covalent bond","metallic bond","cation","anion","polyatomic ion","zero-charge rule","Roman numeral","Greek prefix","Lewis dot diagram","diatomic","valence electrons","conductivity","malleable"],
  sections:[
   {h:"Three ways atoms stick together", body:`
     <p>Atoms bond to reach stable, full outer energy levels — but there are three different strategies:</p>
     <table><tr><th>Bond</th><th>Who</th><th>Electrons…</th><th>Example</th></tr>
     <tr><td><b>Ionic</b></td><td>metal + nonmetal</td><td>are <b>transferred</b>: metal → cation (+), nonmetal → anion (−); opposite charges attract</td><td>NaCl</td></tr>
     <tr><td><b>Covalent</b></td><td>nonmetal + nonmetal</td><td>are <b>shared</b> in pairs</td><td>H<sub>2</sub>O, CO<sub>2</sub></td></tr>
     <tr><td><b>Metallic</b></td><td>metal atoms</td><td>form a <b>"sea" of mobile electrons</b> around fixed cations</td><td>Cu wire</td></tr></table>
     <p>The metallic "electron sea" explains metals beautifully: mobile electrons carry electricity and heat, and when you bend the metal, the cations slide but the sea keeps gluing everything together — that's malleability.</p>`,
    levelup:"Bond type predicts behavior. Ionic compounds form rigid crystal lattices: strong (high melting points) but brittle — shift the layers and like charges suddenly face each other and repel: crack! That's why salt shatters and copper doesn't."},
   {h:"Naming ionic compounds", body:`
     <p><b>The zero-charge rule:</b> in every ionic formula, positive and negative charges must cancel to exactly zero.</p>
     <p><b>Binary ionic (metal + nonmetal):</b> name the metal, then the nonmetal with an <i>-ide</i> ending. To get the formula, "crisscross" the charges into subscripts: Al<sup>3+</sup> + O<sup>2−</sup> → Al<sub>2</sub>O<sub>3</sub> (check: 2×3 − 3×2 = 0 ✓).</p>
     <p><b>Transition metals</b> can carry different charges, so the name announces the charge with a Roman numeral: FeCl<sub>3</sub> is iron(III) chloride; FeCl<sub>2</sub> is iron(II) chloride. Exceptions that never need a numeral: <b>zinc (always 2+), cadmium (2+), and silver (1+)</b>.</p>
     <p><b>Polyatomic ions</b> are charged teams of atoms that travel together. Our nine:</p>
     <table><tr><th>Ion</th><th>Formula</th><th>Ion</th><th>Formula</th></tr>
     <tr><td>ammonium</td><td class="mono">NH<sub>4</sub><sup>+</sup></td><td>nitrate</td><td class="mono">NO<sub>3</sub><sup>−</sup></td></tr>
     <tr><td>hydroxide</td><td class="mono">OH<sup>−</sup></td><td>nitrite</td><td class="mono">NO<sub>2</sub><sup>−</sup></td></tr>
     <tr><td>carbonate</td><td class="mono">CO<sub>3</sub><sup>2−</sup></td><td>sulfite</td><td class="mono">SO<sub>3</sub><sup>2−</sup></td></tr>
     <tr><td>sulfate</td><td class="mono">SO<sub>4</sub><sup>2−</sup></td><td>chlorate</td><td class="mono">ClO<sub>3</sub><sup>−</sup></td></tr>
     <tr><td>phosphate</td><td class="mono">PO<sub>4</sub><sup>3−</sup></td><td colspan="2"></td></tr></table>
     <p>Need more than one polyatomic ion? Wrap it in parentheses: calcium nitrate = Ca(NO<sub>3</sub>)<sub>2</sub>. The polyatomic ion's name never changes its ending.</p>`,
    levelup:"Spot the pattern in the pairs: nitrate NO₃⁻ / nitrite NO₂⁻ and sulfate SO₄²⁻ / sulfite SO₃²⁻. <i>-ate</i> has one more oxygen than <i>-ite</i> — same charge. Chemistry 7 adds many more polyatomic ions, but this pattern lets you predict most of them for free."},
   {h:"Naming covalent compounds", body:`
     <p>Covalent (molecular) compounds use <b>Greek prefixes</b> to state exactly how many of each atom:</p>
     <p><span class="formula">mono-1 · di-2 · tri-3 · tetra-4 · penta-5 · hexa-6 · hepta-7 · octa-8 · nona-9 · deca-10</span></p>
     <ul>
      <li>CO<sub>2</sub> → carbon <b>di</b>oxide &nbsp;•&nbsp; N<sub>2</sub>O<sub>4</sub> → <b>di</b>nitrogen <b>tetr</b>oxide &nbsp;•&nbsp; SF<sub>6</sub> → sulfur <b>hexa</b>fluoride</li>
      <li>Drop <i>mono-</i> for the first element: CO is carbon monoxide, not <i>mono</i>carbon monoxide.</li>
      <li>Second element ends in <i>-ide</i>, and no crisscrossing — the prefixes ARE the subscripts.</li>
     </ul>`,
    levelup:"Why two naming systems? Ionic charges are predictable, so the formula can be reconstructed from charges alone — no prefixes needed. But nonmetals combine in many ratios (NO, NO₂, N₂O, N₂O₃, N₂O₄, N₂O₅ all exist!), so covalent names must literally spell out the count."},
   {h:"Lewis dot diagrams", body:`
     <p>A <b>Lewis dot symbol</b> is the element's symbol surrounded by one dot per <b>valence electron</b> (its outermost electrons — for main-group elements, the ones group position predicts: C has 4, N has 5, O has 6, halogens 7).</p>
     <p>For molecules, atoms share dots in pairs until everyone reaches a full outer level (8 for most atoms — 2 for hydrogen):</p>
     <ul>
      <li><b>H<sub>2</sub>, F<sub>2</sub>, Cl<sub>2</sub>, Br<sub>2</sub>, I<sub>2</sub></b> — one shared pair: a <b>single bond</b>.</li>
      <li><b>O<sub>2</sub></b> — two shared pairs: a <b>double bond</b>.</li>
      <li><b>N<sub>2</sub></b> — three shared pairs: a <b>triple bond</b> (one of nature's strongest!).</li>
     </ul>
     <p>Remember the seven <b>diatomic elements</b> — they never travel alone: H<sub>2</sub>, N<sub>2</sub>, O<sub>2</sub>, F<sub>2</sub>, Cl<sub>2</sub>, Br<sub>2</sub>, I<sub>2</sub> (memory trick: "HOFBrINCl", or the "magic 7" forming a 7-shape on the periodic table).</p>`,
    levelup:"N₂'s triple bond is why nitrogen — 78% of every breath — mostly ignores your body. Breaking it takes enormous energy. Plants can't do it either; only lightning, special bacteria, and fertilizer factories can 'fix' nitrogen. In Chemistry 7 you'll draw full Lewis structures for larger molecules and polyatomic ions."},
   {h:"Predicting properties from bonds", body:`
     <p>The bond type is a crystal ball for behavior:</p>
     <table><tr><th></th><th>Ionic</th><th>Covalent</th></tr>
     <tr><td>Melting/boiling points</td><td><b>high</b> (strong lattice)</td><td><b>lower</b></td></tr>
     <tr><td>Conducts electricity?</td><td><b>yes, when dissolved in water or melted</b> (free ions carry charge)</td><td><b>no</b> (neutral molecules)</td></tr>
     <tr><td>Typical look</td><td>brittle crystals (salts)</td><td>soft solids, liquids, gases</td></tr></table>
     <p><b>Mystery-substance logic:</b> melts at 801 °C and its solution lights a bulb → ionic. Melts at 55 °C, never conducts → covalent. Shiny, bends, conducts as a solid → metallic.</p>`,
    levelup:"Pure water barely conducts electricity — it's covalent! Tap water conducts because of dissolved ionic minerals. That's also why sports drinks advertise 'electrolytes': they're ionic compounds whose ions your nerves literally run on."}
  ],
  sims:[
   {title:"PhET: Build a Molecule", src:"https://phet.colorado.edu/sims/html/build-a-molecule/latest/build-a-molecule_en.html",
    how:"Snap atoms together to build real molecules from their formulas — H₂O, CO₂, NH₃ and more. Great for feeling the difference between coefficients and subscripts before Unit 5."}

"5": {
  sym:"Rx", name:"Chemical Reaction Types", color:"var(--u5)", hex:"#D96C3B",
  tagline:"Conservation of matter & balancing equations",
  blurb:"Fire, fizz, and color changes — chemical reactions rearrange atoms into new substances. But here's the magic rule: not a single atom is ever created or destroyed.",
  parent:[
    "State the Law of Conservation of Matter and use it: mass of reactants = mass of products, in both chemical reactions and physical changes.",
    "Spot the telltale signs of a chemical change: new color, new odor, gas/foaming, a precipitate (solid), or heat/light/sound.",
    "Read and write chemical equations: reactants, products, the arrow, coefficients vs. subscripts, and state symbols (s, l, g, aq).",
    "Balance chemical equations by adjusting coefficients only — never subscripts.",
    "Classify reactions as synthesis (A + B → AB), decomposition (AB → A + B), or combustion (fuel + O₂ → CO₂ + H₂O)."
  ],
  vocab:["reactant","product","chemical equation","coefficient","subscript","conservation of matter","precipitate","synthesis","decomposition","combustion","balanced equation","yields"],
  sections:[
   {h:"Nothing appears, nothing vanishes", body:`
     <p>The <b>Law of Conservation of Matter</b>: in any physical or chemical change, matter is neither created nor destroyed — atoms are only <b>rearranged</b>. So the total mass never changes.</p>
     <ul>
      <li>Melt a 25 g ice cube in a sealed bag → exactly 25 g of water.</li>
      <li>React 4.0 g of hydrogen with 32.0 g of oxygen → exactly 36.0 g of water.</li>
      <li>A burned log's ash weighs less than the log only because escaping gases (CO<sub>2</sub>, water vapor) carried mass into the air. Trap everything, and the books balance perfectly.</li>
     </ul>`,
    levelup:"The scientist who proved this did it with sealed flasks and an obsessively precise balance — showing that rusting metal <i>gains</i> mass (it grabs oxygen from the air). Careful measurement, your Unit 1 skill, is what turned chemistry into a real science."},
   {h:"How to spot a chemical change", body:`
     <p>A chemical change makes a <b>new substance</b>. You usually can't see atoms rearranging, but you can see the evidence:</p>
     <ul>
      <li>🎨 an unexpected <b>color change</b></li>
      <li>👃 a <b>new odor</b></li>
      <li>🫧 <b>gas produced</b> (bubbles or foaming — without boiling)</li>
      <li>🧊 a <b>precipitate</b> — a solid that suddenly appears when two liquids mix</li>
      <li>🔥 <b>energy released or absorbed</b>: heat, light, or sound</li>
     </ul>
     <p>Careful: boiling water bubbles too, but that's a phase change — the bubbles are just water vapor, not a new substance.</p>`,
    levelup:"One sign alone isn't proof — dissolving fizzy tablets is chemical, but dissolving sugar isn't, and melting looks dramatic but is physical. Scientists look for <i>multiple</i> signs plus the key question: can I get the original substance back easily?"},
   {h:"The grammar of equations", body:`
     <p>A chemical equation is a sentence:</p>
     <p><span class="formula">CH<sub>4</sub> + 2O<sub>2</sub> → CO<sub>2</sub> + 2H<sub>2</sub>O</span></p>
     <ul>

    levelup:"Why can't you change subscripts to balance? Changing H₂O to H₂O₂ doesn't fix your math — it swaps water for hydrogen peroxide, a completely different (hair-bleaching!) substance. Coefficients change <i>how much</i>; subscripts change <i>what</i>."},
   {h:"Balancing equations", body:`
     <p>Balancing makes the atom counts match on both sides — conservation of matter in written form. A reliable recipe:</p>

      <li>Write correct formulas first (never touch them again).</li>
      <li>Count each element on both sides.</li>
      <li>Balance one element at a time with coefficients — save any element that appears in several formulas (often O) for last.</li>
      <li>Recount everything. Reduce to lowest whole numbers.</li>
     </ol>
     <p><b>Example:</b> __Al + __O<sub>2</sub> → __Al<sub>2</sub>O<sub>3</sub>. Oxygen comes in 2s on the left, 3s on the right → use 6: 3O<sub>2</sub> and 2Al<sub>2</sub>O<sub>3</sub>. That makes 4 Al on the right → 4Al on the left. Final: <span class="formula">4Al + 3O<sub>2</sub> → 2Al<sub>2</sub>O<sub>3</sub></span> ✓</p>`,
    levelup:"Hydrocarbon-burning trick: balance C first, then H, then O last — and if O₂ comes out as a fraction, double every coefficient. Try it on C₂H₆ + O₂ → CO₂ + H₂O (answer hides in this unit's practice problems)."},
   {h:"Three reaction types", body:`
     <table><tr><th>Type</th><th>Pattern</th><th>Example</th><th>Real life</th></tr>

     <p>Quick reads: many → one is synthesis; one → many is decomposition; if O<sub>2</sub> is a reactant and CO<sub>2</sub> + H<sub>2</sub>O are the products (plus heat and light), it's combustion.</p>`,
    levelup:"Baking is decomposition in disguise: baking soda breaks down in oven heat — 2NaHCO₃ → Na₂CO₃ + H₂O + CO₂ — and that CO₂ gas is what makes muffins rise. Chemistry 7 adds two more types: precipitation and acid–base reactions."}

    levelup:"Where does 6.022 × 10²³ come from? It's defined so the numbers on the periodic table do double duty: one atom of carbon weighs 12.01 <i>amu</i>, and one mole of carbon weighs 12.01 <i>grams</i>. The mole is the bridge between the atomic world and your balance."},

function sample(arr, n){
  const idx = arr.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  return idx.slice(0,n).map(i=>arr[i]);
}

function startTest(u){
  test = {u, qs:sample(DATA.bank[u], TEST_N), ans:Array(TEST_N).fill(null),
          i:0, end:Date.now()+TEST_SECONDS*1000, running:true, tick:null};
  renderQuestion();
  test.tick = setInterval(()=>{
    const left = Math.max(0, Math.round((test.end-Date.now())/1000));
    updateTimer(left);
    if(left<=0){ submitTest(true); }
  }, 250);
}

function fmtTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function updateTimer(left){
  const t = document.getElementById('timer');
  if(!t) return;
  t.textContent = fmtTime(left);
  t.classList.toggle('warn', left<=300 && left>60);
  t.classList.toggle('danger', left<=60);
}

  const U = UNITS[test.u], q = test.qs[test.i];
  const answered = test.ans.filter(a=>a!==null).length;

    <span class="timer mono" id="timer">${fmtTime(Math.max(0,Math.round((test.end-Date.now())/1000)))}</span>

    if(test.i < TEST_N-1){ test.i++; }
    renderQuestion();
  }));
  document.getElementById('prev').addEventListener('click',()=>{test.i--; renderQuestion();});
  document.getElementById('next').addEventListener('click',()=>{test.i++; renderQuestion();});
  app.querySelectorAll('.qdot').forEach(b=>b.addEventListener('click',()=>{test.i=+b.dataset.k; renderQuestion();}));
  document.getElementById('submit').addEventListener('click',()=>{
    const blank = test.ans.filter(a=>a===null).length;
    if(blank>0 && !confirm(`You still have ${blank} unanswered question(s). Submit anyway?`)) return;
    submitTest(false);
  });
}

function submitTest(auto){
  clearInterval(test.tick); test.running=false;
  const U = UNITS[test.u];
  let right = 0;
  test.qs.forEach((q,i)=>{ if(test.ans[i]===q.a) right++; });
  const pct = Math.round(right/TEST_N*100);
  const msg = pct>=90?"Outstanding — you own this unit! 🏆":pct>=80?"Strong work — you're test-ready. ✅":pct>=65?"Good progress — review the missed topics below, then try a fresh test.":"A solid start — reread the theory sections above your missed questions, then come back for a new mix of 40.";
  app.innerHTML = `
  <div class="card result-hero" style="border:2px solid ${U.hex}">
    ${auto?'<p style="color:var(--bad); font-weight:700">⏰ Time expired — the test submitted automatically.</p>':''}
    <div class="score" style="color:${U.hex}">${right} / ${TEST_N}</div>
    <p style="font-size:1.3rem; font-weight:700">${pct}%</p>
    <p style="max-width:520px; margin:10px auto; color:var(--ink-soft)">${msg}</p>
    <div class="prow" style="justify-content:center; margin-top:16px">
      <button class="btn btn-main" id="again">Try a new 40-question mix</button>
      <a class="btn btn-ghost" style="text-decoration:none" href="#/unit/${test.u}">Back to Unit ${test.u}</a>
    </div>
  </div>
  <h2 style="margin:26px 0 8px">Question review</h2>
  ${test.qs.map((q,i)=>{
    const ok = test.ans[i]===q.a, ua = test.ans[i];
    return `<div class="review-q ${ok?'ok':'no'}">
      <p><b>Q${i+1}.</b> ${q.q}</p>
      <p class="ra">${ok?`<span class="pill-ok">✔ Correct:</span> ${q.o[q.a]}`
        :`<span class="pill-no">✘ ${ua===null?'Not answered':'Your answer: '+q.o[ua]}</span><br><span class="pill-ok">Correct answer:</span> ${q.o[q.a]}`}</p>
      ${q.e?`<p class="expl">💡 ${q.e}</p>`:''}
    </div>`;}).join('')}`;
  const doneUnit = test.u; test = null;
  const again = document.getElementById('again');
  if(again) again.addEventListener('click', ()=>startTest(doneUnit));
  window.scrollTo(0,0);
}

route();

</script>
</body>
</html>
