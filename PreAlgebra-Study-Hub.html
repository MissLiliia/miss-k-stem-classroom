 practice:[
  {q:"Two angles are complementary. One is <b>4 times</b> the other. Find both.", hint:"Let the smaller be x, write the larger in terms of x, and use the fact that they add to 90°.",
   steps:["Let x = the smaller angle, so 4x = the larger.","x + 4x = 90.","5x = 90, so x = 18.","The angles are <b>18° and 72°</b>."], ans:"18° and 72°"},
  {q:"Parallel lines are cut by a transversal. One angle is <b>127°</b>. Find its alternate interior angle and its co-interior angle.", hint:"Alternate interior angles match; co-interior angles are supplementary.",
   steps:["Alternate interior angles are congruent → <b>127°</b>.","Co-interior angles are supplementary → 180 − 127 = <b>53°</b>.","Check: only two sizes appear in the diagram, 127° and 53°, and they add to 180°. ✓"], ans:"127° and 53°"},
  {q:"A triangle has angles <b>x</b>, <b>2x</b> and <b>3x</b>. Find all three and classify the triangle.", hint:"Use the angle sum, then look at the largest angle.",
   steps:["x + 2x + 3x = 180.","6x = 180, so x = 30.","The angles are <b>30°, 60° and 90°</b>.","One angle is exactly 90°, so it is a <b>right scalene triangle</b>."], ans:"30°, 60°, 90° — a right triangle"},
  {q:"A ladder leans against a wall, reaching <b>12 ft</b> up, with its foot <b>5 ft</b> from the wall. How long is the ladder?", hint:"The wall and ground form the right angle; the ladder is the hypotenuse.",
   steps:["a&sup2; + b&sup2; = c&sup2; with legs 5 and 12.","25 + 144 = 169.","c = &radic;169 = <b>13 ft</b>.","This is the 5-12-13 triple worth memorising."], ans:"13 ft"},
  {q:"A right triangle has hypotenuse <b>26 cm</b> and one leg <b>10 cm</b>. Find the other leg.", hint:"Rearrange the theorem to isolate the missing leg.",
   steps:["a&sup2; + b&sup2; = c&sup2; → b&sup2; = c&sup2; − a&sup2;.","b&sup2; = 26&sup2; − 10&sup2; = 676 − 100 = 576.","b = &radic;576 = <b>24 cm</b>. (It is the 5-12-13 triple doubled.)"], ans:"24 cm"},
  {q:"Two similar triangles have sides <b>6, 8, 10</b> and the largest side of the second is <b>25</b>. Find its other two sides.", hint:"Match the largest to the largest to get the scale factor.",
   steps:["Scale factor = 25 &divide; 10 = 2.5.","6 × 2.5 = <b>15</b>.","8 × 2.5 = <b>20</b>.","Check: 15-20-25 is the 3-4-5 triple times 5. ✓"], ans:"15 and 20"},
  {q:"Find each interior angle of a <b>regular octagon</b>.", hint:"Total the interior angles first, then share them equally.",
   steps:["Sum = (n − 2) × 180 = (8 − 2) × 180 = 1080°.","Regular means all angles are equal.","1080 &divide; 8 = <b>135°</b> each."], ans:"135°"},
  {q:"In parallelogram ABCD, angle A is <b>65°</b>. Find angles B, C and D.", hint:"Opposite angles are equal; consecutive angles are supplementary.",
   steps:["Angle C is opposite A, so C = <b>65°</b>.","Angle B is consecutive to A: 180 − 65 = <b>115°</b>.","Angle D is opposite B, so D = <b>115°</b>.","Check the total: 65 + 115 + 65 + 115 = 360°. ✓"], ans:"B = 115°, C = 65°, D = 115°"}
 ]
},

"9": {
 sym:"&#9645;", name:"Perimeter, Area &amp; Measurement", hex:"#0E6BA8", dates:"March 24 – April 4",
 tagline:"Distance around, space inside, and choosing the right unit",
 blurb:"Area formulas are not a list to memorise blindly — nearly all of them come from the rectangle. This unit also covers converting units, which is a skill you will use in science every week.",
 parent:[
  "Find the perimeter and area of rectangles, triangles, parallelograms, trapezoids and circles.",
  "Find the area and perimeter of composite (irregular) figures.",
  "Calculate circumference, arc length and the area of sectors.",
  "Convert within the metric system and within the US customary system.",
  "Choose sensible units and read a ruler accurately."
 ],
 vocab:["perimeter","area","circumference","radius","diameter","pi","base","height","composite figure","arc length","sector","central angle","unit multiplier","metric system","US customary"],
 sections:[
  {h:"Perimeter, area and where the formulas come from", body:`
   <p><b>Perimeter</b> is the distance around a shape — just add every side. It is measured in ordinary units (cm, m). <b>Area</b> is the space inside, measured in <b>square</b> units (cm&sup2;, m&sup2;).</p>
   <table>
    <tr><th>Shape</th><th>Area</th><th>Why</th></tr>
    <tr><td>Rectangle</td><td>A = lw</td><td>rows of unit squares</td></tr>
    <tr><td>Square</td><td>A = s&sup2;</td><td>a rectangle with equal sides</td></tr>
    <tr><td>Parallelogram</td><td>A = bh</td><td>slice off a triangle, slide it across — it becomes a rectangle</td></tr>
    <tr><td>Triangle</td><td>A = &frac12;bh</td><td>exactly half of a parallelogram</td></tr>
    <tr><td>Trapezoid</td><td>A = &frac12;(b<sub>1</sub> + b<sub>2</sub>)h</td><td>two copies make a parallelogram</td></tr>
   </table>
   <p>The <b>height</b> must always be <i>perpendicular</i> to the base. On a slanted triangle the height is not the slanted side — it is the straight-down distance, and diagrams often mark it with a dashed line.</p>`,
   levelup:"Perimeter and area are independent. Two rectangles with the same perimeter of 24 can have areas of 11 (1×11) or 36 (6×6). The square always gives the largest area for a fixed perimeter."},
  {h:"Circles", body:`
   <p>Every circle has the same ratio of circumference to diameter, and that ratio is <b>&pi;</b> ≈ 3.14 (or 22/7).</p>
   <table>
    <tr><th>Quantity</th><th>Formula</th></tr>
    <tr><td>Circumference</td><td>C = &pi;d = 2&pi;r</td></tr>
    <tr><td>Area</td><td>A = &pi;r&sup2;</td></tr>
   </table>
   <p>Halve the diameter before using the area formula — that is the single most common circle mistake. And notice which formula squares: circumference is a distance (one dimension), area is a surface (two dimensions), so only the area has r&sup2;.</p>
   <div class="worked">Circle with r = 5 cm<br>C = 2 × 3.14 × 5 = <b>31.4 cm</b><br>A = 3.14 × 5&sup2; = 3.14 × 25 = <b>78.5 cm&sup2;</b></div>
   <p>A <b>sector</b> is a slice, cut by a <b>central angle</b>. Take that fraction of the whole circle:</p>
   <p style="text-align:center"><span class="formula">fraction = central angle &divide; 360°</span></p>
   <div class="worked">90° sector of a circle with r = 4:<br>fraction = 90/360 = &frac14;<br>Arc length = &frac14; × 25.12 = <b>6.28</b><br>Sector area = &frac14; × 50.24 = <b>12.56</b></div>`,
   levelup:"&pi; is irrational, so its decimal never repeats. Computers have now calculated it to more than 100 trillion digits, though 39 digits are enough to measure the observable universe to atomic precision."},
  {h:"Composite figures", body:`
   <p>An irregular shape is almost always a combination of simple ones. Two strategies:</p>
   <ol>
    <li><b>Add:</b> split the shape into rectangles, triangles and half-circles; find each area; add them.</li>
    <li><b>Subtract:</b> find the area of a big rectangle that encloses the shape, then subtract the missing pieces.</li>
   </ol>
   <div class="worked">L-shape = 6×4 rectangle + 3×2 rectangle<br>= 24 + 6 = <b>30 square units</b></div>
   <p>For perimeter, do <b>not</b> add the internal cut lines — only count edges you would actually walk along. Missing side lengths can usually be worked out by subtracting the sides you do know.</p>`,
   levelup:"Splitting a shape into pieces you already understand is the core move of calculus, which finds areas under curves by slicing them into infinitely many thin rectangles."},
  {h:"Units and conversion", body:`
   <p>The <b>metric system</b> runs on powers of ten, which is why it is used in science everywhere:</p>
   <p style="text-align:center" class="mono">km &nbsp; hm &nbsp; dam &nbsp; <b>m</b> &nbsp; dm &nbsp; cm &nbsp; mm</p>
   <p>Each step is ×10. Moving to a <i>smaller</i> unit makes the number <i>bigger</i>: 2.5 kg = 2,500 g. Moving to a larger unit makes it smaller: 340 mL = 0.340 L.</p>
   <p>The reliable method is a <b>unit multiplier</b> — a fraction equal to 1, arranged so the unwanted unit cancels:</p>
   <div class="worked">Convert 45 in to feet<br>45 in × (1 ft / 12 in)<br>The "in" cancels, leaving<br>45/12 = <b>3.75 ft</b></div>
   <p>US customary facts worth knowing: 12 in = 1 ft, 3 ft = 1 yd, 5,280 ft = 1 mi, 16 oz = 1 lb, 2 pt = 1 qt, 4 qt = 1 gal.</p>
   <p>Finally, choose sensible units. A pencil is measured in centimetres, a road in kilometres, an apple in grams, a person in kilograms. If an answer comes out as 0.000004 km, you picked the wrong unit.</p>`,
   levelup:"NASA lost the $125 million Mars Climate Orbiter in 1999 because one team worked in pounds of force and another in newtons. Unit conversion is not a small detail."}
 ],
 tools:["shapes"],
 sims:[
  {title:"PhET: Area Builder", src:"https://phet.colorado.edu/sims/html/area-builder/latest/area-builder_en.html",
   how:"Build shapes from unit squares and watch area and perimeter update. Try: make three different shapes that all have area 12 but different perimeters."},
  {title:"PhET: Area Model Multiplication", src:"https://phet.colorado.edu/sims/html/area-model-multiplication/latest/area-model-multiplication_en.html",
   how:"See why length × width really is the area, and why partial products add up the way they do."}
 ],
 practice:[
  {q:"A rectangle is <b>14 cm by 9 cm</b>. Find its perimeter and area, with correct units.", hint:"Perimeter is a distance; area is a surface. The units differ.",
   steps:["P = 2(l + w) = 2(14 + 9) = 2(23) = <b>46 cm</b>.","A = lw = 14 × 9 = <b>126 cm&sup2;</b>.","Note the units: cm for perimeter, cm&sup2; for area."], ans:"P = 46 cm, A = 126 cm²"},
  {q:"A triangle has base <b>18 m</b> and height <b>7 m</b>. Find its area.", hint:"A triangle is half of the parallelogram with the same base and height.",
   steps:["A = &frac12;bh.","= &frac12; × 18 × 7.","= 9 × 7 = <b>63 m&sup2;</b>."], ans:"63 m²"},
  {q:"A trapezoid has parallel sides of <b>8 cm</b> and <b>14 cm</b>, with a height of <b>6 cm</b>. Find its area.", hint:"Average the two bases first, then multiply by the height.",
   steps:["A = &frac12;(b₁ + b₂)h.","= &frac12;(8 + 14)(6).","= &frac12;(22)(6) = 11 × 6 = <b>66 cm&sup2;</b>."], ans:"66 cm²"},
  {q:"A circular pond has a <b>diameter of 16 m</b>. Find its circumference and area (&pi; ≈ 3.14).", hint:"Halve the diameter before you use the area formula.",
   steps:["Radius = 16 &divide; 2 = 8 m.","C = &pi;d = 3.14 × 16 = <b>50.24 m</b>.","A = &pi;r&sup2; = 3.14 × 64 = <b>200.96 m&sup2;</b>."], ans:"C = 50.24 m, A = 200.96 m²"},
  {q:"Find the area of a <b>120° sector</b> of a circle with radius <b>9 cm</b> (&pi; ≈ 3.14).", hint:"Work out what fraction of the full circle the sector is.",
   steps:["Fraction = 120/360 = 1/3.","Whole circle: A = 3.14 × 81 = 254.34 cm&sup2;.","Sector: 254.34 &divide; 3 = <b>84.78 cm&sup2;</b>."], ans:"84.78 cm²"},
  {q:"A garden is a <b>10 m by 6 m</b> rectangle with a <b>2 m by 3 m</b> shed removed from one corner. Find the remaining area.", hint:"Use the subtraction strategy.",
   steps:["Whole rectangle: 10 × 6 = 60 m&sup2;.","Shed: 2 × 3 = 6 m&sup2;.","Remaining: 60 − 6 = <b>54 m&sup2;</b>."], ans:"54 m²"},
  {q:"Convert: <b>3.5 km</b> to centimetres.", hint:"Go one step at a time, or use two unit multipliers in a row.",
   steps:["3.5 km × 1,000 = 3,500 m.","3,500 m × 100 = <b>350,000 cm</b>.","Check the direction: centimetres are much smaller, so the number should get much bigger. ✓"], ans:"350,000 cm"},
  {q:"A rectangular room is <b>4.5 m by 3.2 m</b>. Carpet costs <b>$28 per square metre</b> and skirting board costs <b>$6 per metre</b>. Find the total cost of both.", hint:"Carpet goes with area; skirting board goes around the edge, so it uses perimeter.",
   steps:["Area = 4.5 × 3.2 = 14.4 m&sup2; → 14.4 × 28 = $403.20.","Perimeter = 2(4.5 + 3.2) = 15.4 m → 15.4 × 6 = $92.40.","Total = <b>$495.60</b>."], ans:"$495.60"}
 ]
},

"10": {
 sym:"&#11041;", name:"Geometric Solids", hex:"#8A6D1F", dates:"April 7 – April 25",
 tagline:"Nets, volume and surface area in three dimensions",
 blurb:"Solids add a third dimension. Volume asks how much fits inside; surface area asks how much wrapping paper you need. Both come from the two-dimensional shapes you already know.",
 parent:[
  "Name solids and identify faces, edges and vertices.",
  "Draw and recognise nets, and see which solid a net folds into.",
  "Calculate the volume of prisms, cylinders, pyramids, cones and spheres.",
  "Calculate the surface area of prisms, cylinders and pyramids.",
  "Decide which measurement a real situation calls for — volume or surface area."
 ],
 vocab:["face","edge","vertex","net","prism","pyramid","cylinder","cone","sphere","base","lateral face","volume","surface area","cubic units"],
 sections:[
  {h:"Naming solids and reading nets", body:`
   <p>Every solid is described by three counts: <b>faces</b> (flat surfaces), <b>edges</b> (where two faces meet) and <b>vertices</b> (corner points).</p>
   <table>
    <tr><th>Solid</th><th>Faces</th><th>Edges</th><th>Vertices</th></tr>
    <tr><td>Cube</td><td>6</td><td>12</td><td>8</td></tr>
    <tr><td>Rectangular prism</td><td>6</td><td>12</td><td>8</td></tr>
    <tr><td>Triangular prism</td><td>5</td><td>9</td><td>6</td></tr>
    <tr><td>Square pyramid</td><td>5</td><td>8</td><td>5</td></tr>
    <tr><td>Cylinder</td><td>2 flat + 1 curved</td><td>2 curved</td><td>0</td></tr>
    <tr><td>Cone</td><td>1 flat + 1 curved</td><td>1 curved</td><td>1 (apex)</td></tr>
    <tr><td>Sphere</td><td>1 curved</td><td>0</td><td>0</td></tr>
   </table>
   <p>A <b>net</b> is the solid unfolded flat. Nets are the fastest way to understand surface area, because the total area of the net <i>is</i> the surface area.</p>
   <table>
    <tr><th>Net</th><th>Folds into</th></tr>
    <tr><td>6 squares</td><td>cube</td></tr>
    <tr><td>2 rectangles + 4 rectangles</td><td>rectangular prism</td></tr>
    <tr><td>2 triangles + 3 rectangles</td><td>triangular prism</td></tr>
    <tr><td>1 square + 4 triangles</td><td>square pyramid</td></tr>
    <tr><td>2 circles + 1 rectangle</td><td>cylinder</td></tr>
   </table>
   <p>A <b>prism</b> has two identical parallel bases joined by rectangles and is named after its base. A <b>pyramid</b> has one base and triangular faces meeting at an apex.</p>`,
   levelup:"Euler's formula holds for every convex polyhedron: F + V − E = 2. Check the cube: 6 + 8 − 12 = 2. ✓ Try it on the triangular prism and the square pyramid."},
  {h:"Volume", body:`
   <p><b>Volume</b> measures how much space a solid fills, in <b>cubic</b> units (cm&sup3;, m&sup3;).</p>
   <table>
    <tr><th>Solid</th><th>Volume</th></tr>
    <tr><td>Any prism</td><td>V = (area of base) × h</td></tr>
    <tr><td>Rectangular prism</td><td>V = lwh</td></tr>
    <tr><td>Cube</td><td>V = s&sup3;</td></tr>
    <tr><td>Cylinder</td><td>V = &pi;r&sup2;h</td></tr>
    <tr><td>Pyramid</td><td>V = ⅓ × (base area) × h</td></tr>
    <tr><td>Cone</td><td>V = ⅓&pi;r&sup2;h</td></tr>
    <tr><td>Sphere</td><td>V = 4/3 &pi;r&sup3;</td></tr>
   </table>
   <p>There is one big idea hiding in that table: <b>every prism is base area × height</b>, and <b>every pointed solid is one third of the prism with the same base and height</b>. That is two formulas instead of six.</p>
   <div class="worked">Cylinder, r = 3 cm, h = 10 cm<br>Base area = &pi;r&sup2; = 3.14 × 9 = 28.26<br>V = 28.26 × 10 = <b>282.6 cm&sup3;</b><br><br>A cone with the same base and height:<br>282.6 &divide; 3 = <b>94.2 cm&sup3;</b></div>
   <p>Useful conversion: <b>1 cm&sup3; = 1 mL</b>, so 1,000 cm&sup3; = 1 litre.</p>`,
   levelup:"Archimedes was so pleased with proving that a sphere's volume is exactly two thirds of its surrounding cylinder that he asked for the diagram on his tombstone."},
  {h:"Surface area", body:`
   <p><b>Surface area</b> is the total area of all the outside faces, in <b>square</b> units. Unfold the net and add up the pieces.</p>
   <table>
    <tr><th>Solid</th><th>Surface area</th><th>Reading the net</th></tr>
    <tr><td>Cube</td><td>SA = 6s&sup2;</td><td>six identical squares</td></tr>
    <tr><td>Rectangular prism</td><td>SA = 2(lw + lh + wh)</td><td>three matching pairs</td></tr>
    <tr><td>Cylinder</td><td>SA = 2&pi;r&sup2; + 2&pi;rh</td><td>two circles + one rectangle</td></tr>
    <tr><td>Square pyramid</td><td>SA = s&sup2; + 4(&frac12; × s × slant height)</td><td>a square + four triangles</td></tr>
   </table>
   <p>The cylinder formula makes sense once you unroll it: the curved surface is a rectangle whose width is the circumference (2&pi;r) and whose height is h.</p>
   <div class="worked">Rectangular prism 5 × 4 × 3<br>SA = 2(5×4 + 5×3 + 4×3)<br>= 2(20 + 15 + 12)<br>= 2(47) = <b>94 square units</b></div>
   <p>Choosing between the two: <b>filling</b> something (water, sand, air) is volume; <b>covering</b> something (paint, paper, labels) is surface area.</p>`,
   levelup:"Volume grows faster than surface area. Double a cube's edge and the surface area is 4× larger while the volume is 8×. That ratio is why elephants have big ears — they need extra surface to shed the heat their large volume produces."}
 ],
 tools:["solids"],
 sims:[
  {title:"PhET: Density (volume by displacement)", src:"https://phet.colorado.edu/sims/html/density/latest/density_en.html",
   how:"Drop blocks into water and watch the level rise by exactly the block's volume. Try: predict the rise for a 2×2×2 cube before you drop it in."},
  {title:"PhET: Area Builder (bases of prisms)", src:"https://phet.colorado.edu/sims/html/area-builder/latest/area-builder_en.html",
   how:"Build a base shape, note its area, then imagine stacking that layer h times — that stack is exactly what V = base × height means."}
 ],
 practice:[
  {q:"A rectangular prism measures <b>8 cm × 5 cm × 4 cm</b>. Find its volume and surface area.", hint:"Volume multiplies all three; surface area pairs them up.",
   steps:["V = lwh = 8 × 5 × 4 = <b>160 cm&sup3;</b>.","SA = 2(lw + lh + wh) = 2(40 + 32 + 20).","= 2(92) = <b>184 cm&sup2;</b>."], ans:"V = 160 cm³, SA = 184 cm²"},
  {q:"A cube has a surface area of <b>150 cm&sup2;</b>. Find its edge and its volume.", hint:"Work backwards from SA = 6s².",
   steps:["6s&sup2; = 150, so s&sup2; = 25.","s = &radic;25 = <b>5 cm</b>.","V = s&sup3; = 125 <b>cm&sup3;</b>."], ans:"Edge 5 cm, volume 125 cm³"},
  {q:"A cylinder has radius <b>4 cm</b> and height <b>10 cm</b>. Find its volume (&pi; ≈ 3.14).", hint:"Find the circular base area first, then stack it h high.",
   steps:["Base area = &pi;r&sup2; = 3.14 × 16 = 50.24 cm&sup2;.","V = 50.24 × 10.","= <b>502.4 cm&sup3;</b>."], ans:"502.4 cm³"},
  {q:"A cone has the same radius and height as that cylinder. What is its volume?", hint:"You do not need to start over.",
   steps:["A cone is one third of the cylinder with the same base and height.","502.4 &divide; 3.","= <b>167.47 cm&sup3;</b> (to 2 dp)."], ans:"≈ 167.47 cm³"},
  {q:"A square pyramid has base edge <b>6 m</b> and height <b>10 m</b>. Find its volume.", hint:"Base area first, then take a third.",
   steps:["Base area = 6 × 6 = 36 m&sup2;.","V = ⅓ × 36 × 10.","= ⅓ × 360 = <b>120 m&sup3;</b>."], ans:"120 m³"},
  {q:"A sphere has radius <b>6 cm</b>. Find its volume and surface area (&pi; ≈ 3.14).", hint:"Volume cubes the radius; surface area squares it.",
   steps:["V = 4/3 &pi;r&sup3; = 4/3 × 3.14 × 216.","= 4/3 × 678.24 = <b>904.32 cm&sup3;</b>.","SA = 4&pi;r&sup2; = 4 × 3.14 × 36 = <b>452.16 cm&sup2;</b>."], ans:"V = 904.32 cm³, SA = 452.16 cm²"},
  {q:"A fish tank is <b>60 cm × 30 cm × 40 cm</b>. How many <b>litres</b> of water does it hold when full?", hint:"Find the volume in cm³ first, then use 1,000 cm³ = 1 L.",
   steps:["V = 60 × 30 × 40 = 72,000 cm&sup3;.","1,000 cm&sup3; = 1 L.","72,000 &divide; 1,000 = <b>72 litres</b>."], ans:"72 litres"},
  {q:"You are wrapping a gift box <b>25 cm × 20 cm × 10 cm</b>. Do you need volume or surface area, and how much paper is required?", hint:"Wrapping covers the outside.",
   steps:["Covering means <b>surface area</b>.","SA = 2(lw + lh + wh) = 2(500 + 250 + 200).","= 2(950) = <b>1,900 cm&sup2;</b> of paper, plus a little for overlap."], ans:"Surface area: 1,900 cm²"}
 ]
},

"11": {
 sym:"&#9642;&#9642;", name:"Probability, Data &amp; Statistics", hex:"#6B3FA0", dates:"April 28 – May 9",
 tagline:"Summarising data, counting possibilities and measuring chance",
 blurb:"Data is everywhere, and so are misleading graphs. This unit teaches you to summarise a data set honestly, read graphs critically, count arrangements, and calculate probability.",
 parent:[
  "Read and create bar graphs, histograms, stem-and-leaf plots, scatter plots and box plots.",
  "Calculate and interpret mean, median, mode and range.",
  "Spot misleading graphs and describe correlation.",
  "Count outcomes, and tell permutations from combinations.",
  "Find the probability of a single event and of its complement."
 ],
 vocab:["mean","median","mode","range","outlier","bar graph","histogram","stem-and-leaf plot","scatter plot","correlation","box-and-whisker plot","quartile","permutation","combination","probability","complement"],
 sections:[
  {h:"Measures of centre and spread", body:`
   <table>
    <tr><th>Measure</th><th>How to find it</th><th>Best when</th></tr>
    <tr><td><b>Mean</b></td><td>add all values, divide by how many</td><td>data is fairly even, no extreme values</td></tr>
    <tr><td><b>Median</b></td><td>order the data, take the middle</td><td>there are outliers (house prices, salaries)</td></tr>
    <tr><td><b>Mode</b></td><td>the most frequent value</td><td>data is categorical (favourite colour, shoe size)</td></tr>
    <tr><td><b>Range</b></td><td>largest − smallest</td><td>you want to describe spread</td></tr>
   </table>
   <p>Always <b>order the data before finding the median</b>. With an even number of values, average the two in the middle.</p>
   <div class="worked">Data: 3, 9, 5, 1, 7<br>Ordered: 1, 3, 5, 7, 9<br>Mean = 25 &divide; 5 = <b>5</b><br>Median = <b>5</b> &nbsp; Range = 9 − 1 = <b>8</b></div>
   <p>An <b>outlier</b> is a value far from the rest. It drags the mean but barely moves the median — which is exactly why news reports about income use the median.</p>`,
   levelup:"Working backwards is a favourite test question: if five scores average 82, the total must be 5 × 82 = 410, so a missing score can be found by subtraction."},
  {h:"Displaying data", body:`
   <table>
    <tr><th>Display</th><th>Use it for</th></tr>
    <tr><td>Bar graph</td><td>comparing separate categories</td></tr>
    <tr><td>Histogram</td><td>showing how numeric data spreads across intervals (bars touch)</td></tr>
    <tr><td>Line graph</td><td>change over time</td></tr>
    <tr><td>Circle graph</td><td>parts of a whole</td></tr>
    <tr><td>Stem-and-leaf plot</td><td>seeing the shape while keeping every original value</td></tr>
    <tr><td>Scatter plot</td><td>the relationship between two variables</td></tr>
    <tr><td>Box-and-whisker plot</td><td>the five-number summary and the middle 50%</td></tr>
   </table>
   <p>In a stem-and-leaf plot, <span class="mono">3 | 7</span> means 37. The stems are the tens and the leaves the ones.</p>
   <p>A <b>box plot</b> shows five numbers: minimum, Q1, median, Q3 and maximum. The box holds the middle half of the data, so a wide box means high variability.</p>
   <p><b>Correlation</b> on a scatter plot: <b>positive</b> (both rise together), <b>negative</b> (one rises as the other falls), or <b>none</b> (a random cloud).</p>
   <p><b>Misleading graphs</b> are worth spotting: a vertical axis that does not start at zero exaggerates differences, uneven intervals distort trends, and 3D effects make some bars look bigger than they are.</p>`,
   levelup:"Correlation is not causation. Ice-cream sales and drowning both rise together — but the cause of both is summer, not ice cream."},
  {h:"Counting outcomes", body:`
   <p>The <b>Fundamental Counting Principle</b>: if one choice has m options and the next has n, together they have m × n outcomes. A menu with 4 mains and 3 drinks offers 12 meals.</p>
   <p>Two counting tools follow from it:</p>
   <table>
    <tr><th></th><th>Order matters?</th><th>Example</th></tr>
    <tr><td><b>Permutation</b></td><td>yes</td><td>choosing a president and a vice-president</td></tr>
    <tr><td><b>Combination</b></td><td>no</td><td>choosing 3 people for a committee</td></tr>
   </table>
   <div class="worked">5 runners, medals for the top 3 — order matters<br>5 × 4 × 3 = <b>60 arrangements</b><br><br>5 runners, choose any 3 for a relay — order does not matter<br>60 &divide; (3 × 2 × 1) = <b>10 teams</b></div>
   <p>The test question to ask yourself: <i>would swapping two of the chosen items give a different result?</i> If yes, it is a permutation.</p>`,
   levelup:"Combinations explain the lottery. Choosing 6 numbers from 49 gives 13,983,816 possibilities — which is why one ticket almost certainly loses."},
  {h:"Probability", body:`
   <p style="text-align:center"><span class="formula">P(event) = favourable outcomes &divide; total outcomes</span></p>
   <p>Probability always lands between 0 (impossible) and 1 (certain), and can be written as a fraction, decimal or percent. All the probabilities of a situation add to 1.</p>
   <table>
    <tr><th>Event</th><th>Probability</th></tr>
    <tr><td>Rolling a 4 on a die</td><td>1/6</td></tr>
    <tr><td>Rolling an even number</td><td>3/6 = 1/2</td></tr>
    <tr><td>Rolling a number greater than 4</td><td>2/6 = 1/3</td></tr>
    <tr><td>Rolling a 7</td><td>0 (impossible)</td></tr>
    <tr><td>Rolling less than 7</td><td>1 (certain)</td></tr>
   </table>
   <p>The <b>complement</b> is everything else: P(not A) = 1 − P(A). If the chance of rain is 0.3, the chance of no rain is 0.7. That shortcut is often far quicker than counting the outcomes you want.</p>
   <p><b>Theoretical</b> probability is what should happen in principle; <b>experimental</b> probability is what actually happened in your trials. The more trials you run, the closer the two get — which is exactly what you can watch happen in the dice tool below.</p>`,
   levelup:"With two dice, 7 is the most likely total because it can be made six different ways (1+6, 2+5, 3+4, 4+3, 5+2, 6+1) while 12 has only one."}
 ],
 tools:["dice"],
 sims:[
  {title:"PhET: Plinko Probability", src:"https://phet.colorado.edu/sims/html/plinko-probability/latest/plinko-probability_en.html",
   how:"Drop hundreds of balls and watch experimental results settle toward the theoretical curve. Try 10 balls, then 1,000 — which matches the prediction better?"},
  {title:"PhET: Center and Variability", src:"https://phet.colorado.edu/sims/html/center-and-variability/latest/center-and-variability_en.html",
   how:"Move data points and watch mean and median react. Try dragging one point far to the right — which measure moves, and which barely budges?"}
 ],
 practice:[
  {q:"Find the mean, median, mode and range of: <b>12, 15, 11, 15, 9, 18</b>", hint:"Order the data first — it makes three of the four easy.",
   steps:["Ordered: 9, 11, 12, 15, 15, 18.","Mean: 80 &divide; 6 ≈ <b>13.33</b>.","Median: middle two are 12 and 15 → (12 + 15)/2 = <b>13.5</b>.","Mode: <b>15</b> (appears twice). Range: 18 − 9 = <b>9</b>."], ans:"Mean ≈ 13.33, median 13.5, mode 15, range 9"},
  {q:"Four test scores are <b>78, 85, 91 and 82</b>. What score on the fifth test gives a mean of <b>85</b>?", hint:"Work backwards from the total you need.",
   steps:["For a mean of 85 across 5 tests, the total must be 5 × 85 = 425.","Current total: 78 + 85 + 91 + 82 = 336.","Needed: 425 − 336 = <b>89</b>."], ans:"89"},
  {q:"A data set is <b>4, 5, 6, 7, 8</b>. Then the value <b>50</b> is added. What happens to the mean and the median?", hint:"Calculate both before and after.",
   steps:["Before: mean = 30/5 = 6, median = 6.","After: mean = 80/6 ≈ 13.3, median = (6 + 7)/2 = 6.5.","The mean <b>jumped by more than 7</b>; the median moved only 0.5.","This is why the median is preferred when outliers are present."], ans:"The mean jumps to ≈13.3; the median barely moves to 6.5"},
  {q:"A shop sells <b>5 shirt styles</b> in <b>4 colours</b> and <b>3 sizes</b>. How many different shirts are stocked?", hint:"Use the Fundamental Counting Principle across all three choices.",
   steps:["Multiply the options at each step.","5 × 4 × 3.","= <b>60 different shirts</b>."], ans:"60"},
  {q:"From <b>7 students</b>, how many ways can you pick a president, a secretary and a treasurer?", hint:"Each role is different, so order matters.",
   steps:["This is a permutation — swapping two people changes the outcome.","7 choices, then 6, then 5.","7 × 6 × 5 = <b>210 ways</b>."], ans:"210"},
  {q:"From those same <b>7 students</b>, how many ways can you choose a committee of <b>3</b>?", hint:"Start from the permutation answer, then remove the duplicate orderings.",
   steps:["Permutations of 3 from 7: 210.","Each group of 3 was counted 3 × 2 × 1 = 6 times.","210 &divide; 6 = <b>35 committees</b>."], ans:"35"},
  {q:"A bag holds <b>5 red, 3 blue and 4 green</b> marbles. Find P(blue) and P(not blue).", hint:"Total the marbles first; the complement saves you work on the second part.",

  {q:"A spinner has 8 equal sections numbered 1–8. Find P(prime number).", hint:"List the primes in that range carefully — 1 is not prime.",

  {h:"A two-week plan", body:`
   <p>The comprehensive exam is worth <b>25% of the overall grade</b>, so it deserves a plan rather than a panic. No new content is taught during review, which means the whole two weeks belongs to you.</p>
   <table>
    <tr><th>Days</th><th>Focus</th></tr>

   </table>
   <p>Notice that the last third is <b>mixed</b> practice. Studying one unit at a time makes you good at spotting which method to use only when someone has already told you the topic — which is not how the exam works.</p>`,

    <tr><th>Unit</th><th>The one thing to remember</th></tr>
    <tr><td>1 · Number sense</td><td>PEMDAS, and the sign rules for the four operations</td></tr>
    <tr><td>2 · Fractions</td><td>GCF simplifies, LCM combines; keep–change–flip to divide</td></tr>
    <tr><td>3 · Equations</td><td>Undo operations in reverse PEMDAS order, on both sides</td></tr>
    <tr><td>4 · Exponents</td><td>Multiply → add exponents; power of a power → multiply them</td></tr>
    <tr><td>5 · Percents</td><td>part/whole = percent/100 answers all three question types</td></tr>
    <tr><td>7 · Graphing</td><td>y = mx + b: m is rise over run, b is where it crosses</td></tr>
    <tr><td>8 · Geometry</td><td>Triangles total 180°, polygons total (n − 2) × 180°, a² + b² = c²</td></tr>
    <tr><td>9 · Area</td><td>Every area formula descends from the rectangle; watch the units</td></tr>
    <tr><td>10 · Solids</td><td>Prism = base × height; pointed solids are one third of that</td></tr>

   <p>Open the <b>Reference</b> page from the navigation for the complete formula sheet — then try to reproduce it from memory and see what is missing.</p>`,

  {h:"On exam day", body:`
   <ul>
    <li>Bring everything on the supplies list: calculator, pencils, eraser, ruler, protractor and compass. Borrowing mid-exam costs minutes.</li>

    <li>Write your working in a column. Most marks lost to "silly mistakes" are actually lost to cramped, unreadable work.</li>
    <li>Label every geometry answer with its unit — cm, cm² or cm³.</li>
    <li>On multiple choice, eliminate first. Two impossible options turn a guess from 25% to 50%.</li>
    <li>If you finish early, do not simply reread. Re-solve the two or three hardest questions on scrap paper and compare answers.</li>

/* ============================================================
   BUILT-IN INTERACTIVE TOOLS
   Each tool: {title, how, html, init(rootElement)}
   ============================================================ */
const SVGNS = "http://www.w3.org/2000/svg";
const gv = (r, name) => r.querySelector('[data-f="' + name + '"]');
const val = (r, name, dflt) => {
  const el = gv(r, name);
  if (!el) return dflt;
  if (el.tagName === "SELECT") return el.value;
  const n = parseFloat(el.value);
  return isNaN(n) ? dflt : n;
};
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; };
const simp = (n, d) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; };
const fstr = (n, d) => d === 1 ? String(n) : n + "/" + d;
const rnd = (x, p) => { const f = Math.pow(10, p === undefined ? 2 : p); return Math.round(x * f) / f; };

const TOOLS = {};

/* ---------- 1. Number line explorer ---------- */
TOOLS.numberline = {
 title:"Number line explorer",
 how:"Set two integers and an operation, then watch the hop. Try −8 + 5, then 5 + (−8): the hops start in different places but land on the same answer.",
 html:`
  <div class="ctrl">
    <div><label>Start at</label><input type="number" data-f="a" value="-8"></div>
    <div><label>Operation</label><select data-f="op"><option value="+">add</option><option value="-">subtract</option></select></div>
    <div><label>This number</label><input type="number" data-f="b" value="5"></div>
  </div>
  <svg class="toolsvg" viewBox="0 0 660 128" data-f="svg" role="img" aria-label="Number line showing the calculation"></svg>
  <div class="out" data-f="out"></div>`,
 init(r){
  const draw = () => {
    const a = Math.round(val(r,"a",0)), b = Math.round(val(r,"b",0)), op = val(r,"op","+");
    const move = op === "+" ? b : -b;
    const res = a + move;
    let lo = Math.min(a, res, 0) - 3, hi = Math.max(a, res, 0) + 3;
    if (hi - lo < 12) { const pad = (12 - (hi - lo)) / 2; lo -= Math.ceil(pad); hi += Math.ceil(pad); }
    const X = v => 34 + (v - lo) * (592 / (hi - lo));
    const step = (hi - lo) > 40 ? 5 : (hi - lo) > 20 ? 2 : 1;
    let s = '<line x1="24" y1="86" x2="636" y2="86" stroke="#141A2E" stroke-width="2"/>';
    s += '<path d="M636 86 L628 81 M636 86 L628 91 M24 86 L32 81 M24 86 L32 91" stroke="#141A2E" stroke-width="2" fill="none"/>';
    for (let v = Math.ceil(lo/step)*step; v <= hi; v += step) {
      const zero = v === 0;
      s += `<line x1="${X(v)}" y1="${zero?76:80}" x2="${X(v)}" y2="${zero?96:92}" stroke="${zero?'#141A2E':'#8892B0'}" stroke-width="${zero?2:1}"/>`;
      s += `<text x="${X(v)}" y="112" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5A648A">${v}</text>`;
    }
    const x1 = X(a), x2 = X(res), mid = (x1 + x2) / 2;
    if (move !== 0) {
      const lift = 40;
      s += `<path d="M ${x1} 80 Q ${mid} ${80-lift} ${x2} 80" fill="none" stroke="#E8811F" stroke-width="2.5"/>`;
      const dir = x2 > x1 ? 1 : -1;
      s += `<path d="M ${x2} 80 L ${x2-7*dir} ${73} M ${x2} 80 L ${x2-7*dir} ${87}" stroke="#E8811F" stroke-width="2.5" fill="none"/>`;
      s += `<text x="${mid}" y="${80-lift-6}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600" fill="#E8811F">${move>0?'+':'−'}${Math.abs(move)}</text>`;
    }
    s += `<circle cx="${x1}" cy="86" r="6" fill="#2E3FA6"/><text x="${x1}" y="66" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#2E3FA6">start ${a}</text>`;
    s += `<circle cx="${x2}" cy="86" r="6" fill="#1F7A4D"/><text x="${x2}" y="${move===0?66:126}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#1F7A4D">land ${res}</text>`;
    gv(r,"svg").innerHTML = s;
    const bs = b < 0 ? `(${b})` : b;
    let why;
    if (op === "-") why = `Subtracting is adding the opposite, so ${a} − ${bs} becomes ${a} + ${-b}.`;
    else if ((a<0) === (b<0)) why = "Same signs: add the distances and keep the sign.";
    else why = "Different signs: subtract the distances and keep the sign of the number further from zero.";
    gv(r,"out").innerHTML = `<b>${a} ${op} ${bs} = ${res}</b><br>${why}<br>|${a}| = ${Math.abs(a)} &nbsp;·&nbsp; |${res}| = ${Math.abs(res)} &nbsp;·&nbsp; the opposite of ${res} is ${-res}`;
  };
  r.querySelectorAll("input,select").forEach(i => i.addEventListener("input", draw));
  draw();
 }
};

/* ---------- 2. Fraction bars ---------- */
TOOLS.fractionbar = {
 title:"Fraction workshop",
 how:"Build two fractions and pick an operation. The bars show why addition needs a common denominator — and why multiplying does not.",
 html:`
  <div class="ctrl">
    <div><label>first numerator</label><input type="number" data-f="n1" value="1" min="-20" max="20"></div>
    <div><label>first denominator</label><input type="number" data-f="d1" value="2" min="1" max="20"></div>
    <div><label>operation</label><select data-f="op"><option>+</option><option>−</option><option>×</option><option>÷</option></select></div>
    <div><label>second numerator</label><input type="number" data-f="n2" value="1" min="-20" max="20"></div>
    <div><label>second denominator</label><input type="number" data-f="d2" value="3" min="1" max="20"></div>
  </div>
  <svg class="toolsvg" viewBox="0 0 660 190" data-f="svg" role="img" aria-label="Fraction bars"></svg>
  <div class="out" data-f="out"></div>`,
 init(r){
  const bar = (y, n, d, label, colour) => {
    const W = 460, X0 = 150;
    let s = `<text x="${X0-12}" y="${y+21}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="13" fill="#141A2E">${label}</text>`;
    const w = W / d;
    for (let i = 0; i < d; i++) {
      const filled = i < Math.min(Math.abs(n), d);
      s += `<rect x="${X0 + i*w}" y="${y}" width="${w}" height="30" fill="${filled ? colour : '#fff'}" fill-opacity="${filled?0.85:1}" stroke="#141A2E" stroke-width="1"/>`;
    }
    if (Math.abs(n) > d) s += `<text x="${X0+W+8}" y="${y+21}" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5A648A">+ more</text>`;
    return s;
  };
  const draw = () => {
    let n1 = Math.round(val(r,"n1",1)), d1 = Math.round(val(r,"d1",2)) || 1;
    let n2 = Math.round(val(r,"n2",1)), d2 = Math.round(val(r,"d2",3)) || 1;
    d1 = Math.max(1, Math.min(20, Math.abs(d1))); d2 = Math.max(1, Math.min(20, Math.abs(d2)));
    const op = val(r,"op","+");
    const lcd = d1 * d2 / gcd(d1, d2);
    let rn, rd, work;
    if (op === "+") { rn = n1*(lcd/d1) + n2*(lcd/d2); rd = lcd;
      work = `LCD of ${d1} and ${d2} is ${lcd}. → ${fstr(n1*(lcd/d1),lcd)} + ${fstr(n2*(lcd/d2),lcd)}`; }
    else if (op === "−") { rn = n1*(lcd/d1) - n2*(lcd/d2); rd = lcd;
      work = `LCD of ${d1} and ${d2} is ${lcd}. → ${fstr(n1*(lcd/d1),lcd)} − ${fstr(n2*(lcd/d2),lcd)}`; }
    else if (op === "×") { rn = n1*n2; rd = d1*d2; work = `Multiply straight across: (${n1}×${n2})/(${d1}×${d2})`; }
    else { rn = n1*d2; rd = d1*n2; work = `Keep–change–flip: ${fstr(n1,d1)} × ${fstr(d2,n2)}`; }
    let out;
    if (rd === 0) { out = "Cannot divide by zero — check the second fraction."; gv(r,"svg").innerHTML=""; gv(r,"out").innerHTML = out; return; }
    const [sn, sd] = simp(rn, rd);
    let s = bar(14, n1, d1, fstr(n1,d1), "#2E3FA6");
    s += bar(64, n2, d2, fstr(n2,d2), "#C2417B");
    s += `<line x1="150" y1="106" x2="610" y2="106" stroke="#DDE3F2"/>`;
    s += bar(120, sn, sd, fstr(sn,sd), "#1F7A4D");
    s += `<text x="330" y="182" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5A648A">result, shown in ${sd}ths</text>`;
    gv(r,"svg").innerHTML = s;
    const whole = sd !== 1 && Math.abs(sn) > sd ? ` = ${(sn<0?'−':'')}${Math.floor(Math.abs(sn)/sd)} ${Math.abs(sn)%sd}/${sd}` : "";
    gv(r,"out").innerHTML = `<b>${fstr(n1,d1)} ${op} ${fstr(n2,d2)} = ${fstr(sn,sd)}${whole}</b><br>${work}<br>` +
      (rn !== sn ? `Simplify by the GCF ${gcd(rn,rd)}: ${fstr(rn,rd)} → ${fstr(sn,sd)}` : "Already in simplest form.") +
      `<br>As a decimal: ${rnd(sn/sd, 4)}`;
  };
  r.querySelectorAll("input,select").forEach(i => i.addEventListener("input", draw));
  draw();
 }
};

/* ---------- 3. Equation balance ---------- */
TOOLS.balance = {
 title:"Equation balance",
 how:"Build any equation of the form ax + b = cx + d and watch it solved one legal move at a time. Every line does the same thing to both sides.",
 html:`
  <div class="ctrl">
    <div><label>a (x term)</label><input type="number" data-f="a" value="2"></div>
    <div><label>b (constant)</label><input type="number" data-f="b" value="5"></div>
    <div><label>c (x term)</label><input type="number" data-f="c" value="0"></div>
    <div><label>d (constant)</label><input type="number" data-f="d" value="17"></div>
  </div>
  <div class="out" data-f="out"></div>`,
 init(r){
  const term = (k) => k === 1 ? "x" : k === -1 ? "−x" : k + "x";
  const side = (k, n) => {
    if (k === 0) return String(n);
    if (n === 0) return term(k);
    return term(k) + (n > 0 ? " + " + n : " − " + Math.abs(n));
  };
  const draw = () => {
    const a = Math.round(val(r,"a",2)), b = Math.round(val(r,"b",5));
    const c = Math.round(val(r,"c",0)), d = Math.round(val(r,"d",17));
    let lines = [`<b>${side(a,b)} = ${side(c,d)}</b>`];
    if (a === c) {
      lines.push(b === d ? "Both sides are identical — every value of x works (infinitely many solutions)."
                         : "The x terms cancel and the constants disagree — there is no solution.");
      gv(r,"out").innerHTML = lines.join("<br>"); return;
    }
    let A = a, B = b, C = c, D = d;
    if (C !== 0) { lines.push(`${C>0?'Subtract':'Add'} ${term(Math.abs(C))} on both sides → &nbsp; ${side(A-C,B)} = ${side(0,D)}`); A -= C; C = 0; }
    if (B !== 0) { lines.push(`${B>0?'Subtract':'Add'} ${Math.abs(B)} on both sides → &nbsp; ${side(A,0)} = ${D-B}`); D -= B; B = 0; }
    lines.push(`Divide both sides by ${A} → &nbsp; x = ${fstr(...simp(D,A))}`);
    const x = D / A;
    lines.push(`<b>x = ${Number.isInteger(x) ? x : rnd(x,4)}</b>`);
    lines.push(`Check: ${a}(${rnd(x,4)}) ${b>=0?'+ '+b:'− '+Math.abs(b)} = ${rnd(a*x+b,4)} &nbsp;and&nbsp; ${c}(${rnd(x,4)}) ${d>=0?'+ '+d:'− '+Math.abs(d)} = ${rnd(c*x+d,4)} ✓`);
    gv(r,"out").innerHTML = lines.join("<br>");
  };
  r.querySelectorAll("input").forEach(i => i.addEventListener("input", draw));
  draw();
 }
};

/* ---------- 4. Exponent rules ---------- */
TOOLS.exponents = {
 title:"Exponent rule explorer",
 how:"Pick a rule and watch the expansion. The rules are not arbitrary — count the factors and you can see where every one comes from.",
 html:`
  <div class="ctrl">
    <div><label>rule</label><select data-f="rule">
      <option value="prod">product: xᵃ · xᵇ</option>
      <option value="quot">quotient: xᵃ ÷ xᵇ</option>
      <option value="pow">power of a power: (xᵃ)ᵇ</option>
    </select></div>
    <div><label>base value</label><input type="number" data-f="base" value="2" min="2" max="9"></div>
    <div><label>a</label><input type="number" data-f="a" value="3" min="0" max="7"></div>
    <div><label>b</label><input type="number" data-f="b" value="2" min="0" max="7"></div>
  </div>
  <div class="out" data-f="out"></div>`,
 init(r){
  const rep = (base, n) => n === 0 ? "1" : Array(n).fill(base).join(" · ");
  const draw = () => {
    const rule = val(r,"rule","prod");
    const base = Math.max(2, Math.min(9, Math.round(val(r,"base",2))));
    const a = Math.max(0, Math.min(7, Math.round(val(r,"a",3))));
    const b = Math.max(0, Math.min(7, Math.round(val(r,"b",2))));
    let L = [];
    if (rule === "prod") {
      L.push(`<b>x<sup>${a}</sup> · x<sup>${b}</sup> = x<sup>${a+b}</sup></b>`);
      L.push(`Expanded: (${rep("x",a)}) · (${rep("x",b)}) — that is ${a} + ${b} = ${a+b} factors.`);
      L.push(`With x = ${base}: ${Math.pow(base,a)} · ${Math.pow(base,b)} = ${Math.pow(base,a+b)} = ${base}<sup>${a+b}</sup> ✓`);
      L.push("<b>Rule:</b> multiplying like bases → <i>add</i> the exponents.");
    } else if (rule === "quot") {
      L.push(`<b>x<sup>${a}</sup> ÷ x<sup>${b}</sup> = x<sup>${a-b}</sup></b>`);
      L.push(`Expanded: (${rep("x",a)}) ÷ (${rep("x",b)}) — ${Math.min(a,b)} factor(s) cancel.`);
      const v = Math.pow(base,a)/Math.pow(base,b);
      L.push(`With x = ${base}: ${Math.pow(base,a)} ÷ ${Math.pow(base,b)} = ${v < 1 ? "1/"+Math.round(1/v) : v}`);
      if (a - b === 0) L.push("Note: anything divided by itself is 1, which is why x⁰ = 1.");
      if (a - b < 0) L.push(`Note: a negative exponent means a reciprocal — x<sup>${a-b}</sup> = 1/x<sup>${b-a}</sup>.`);
      L.push("<b>Rule:</b> dividing like bases → <i>subtract</i> the exponents.");
    } else {
      L.push(`<b>(x<sup>${a}</sup>)<sup>${b}</sup> = x<sup>${a*b}</sup></b>`);
      L.push(`Expanded: ${b === 0 ? "1 (anything to the zero power)" : Array(b).fill("(" + rep("x",a) + ")").join(" · ")}`);
      L.push(`That is ${b} group(s) of ${a} factors = ${a*b} factors.`);
      L.push(`With x = ${base}: (${Math.pow(base,a)})<sup>${b}</sup> = ${Math.pow(base,a*b)} ✓`);
      L.push("<b>Rule:</b> a power raised to a power → <i>multiply</i> the exponents.");
    }
    gv(r,"out").innerHTML = L.join("<br>");
  };
  r.querySelectorAll("input,select").forEach(i => i.addEventListener("input", draw));
  draw();
 }
};

TOOLS.plane = {
 title:"Transformation plotter",
 how:"Plot a point, choose a transformation, and compare the original (blue) with the image (orange). Try reflecting over the x-axis twice — where do you end up?",
 html:`
  <div class="ctrl">
    <div><label>x</label><input type="number" data-f="x" value="3" min="-9" max="9"></div>
    <div><label>y</label><input type="number" data-f="y" value="4" min="-9" max="9"></div>
    <div><label>transformation</label><select data-f="t">
      <option value="tx">translate</option>
      <option value="rx">reflect over x-axis</option>
      <option value="ry">reflect over y-axis</option>
      <option value="r90">rotate 90° anticlockwise</option>
      <option value="r180">rotate 180°</option>
      <option value="dil">dilate about the origin</option>
    </select></div>
    <div><label>a / scale</label><input type="number" data-f="a" value="-5" step="0.5"></div>
    <div><label>b (translate only)</label><input type="number" data-f="b" value="2"></div>
  </div>
  <svg class="toolsvg" viewBox="0 0 420 420" data-f="svg" role="img" aria-label="Coordinate plane"></svg>
  <div class="out" data-f="out"></div>`,
 init(r){
  const S = 20, O = 210;
  const PX = v => O + v * S, PY = v => O - v * S;
  const draw = () => {
    const x = val(r,"x",3), y = val(r,"y",4), t = val(r,"t","tx");
    const a = val(r,"a",-5), b = val(r,"b",2);
    let ix, iy, rule, name;
    if (t === "tx") { ix = x + a; iy = y + b; rule = `(x, y) → (x + ${a}, y + ${b})`; name = "Translation"; }
    else if (t === "rx") { ix = x; iy = -y; rule = "(x, y) → (x, −y)"; name = "Reflection over the x-axis"; }
    else if (t === "ry") { ix = -x; iy = y; rule = "(x, y) → (−x, y)"; name = "Reflection over the y-axis"; }
    else if (t === "r90") { ix = -y; iy = x; rule = "(x, y) → (−y, x)"; name = "Rotation 90° anticlockwise"; }
    else if (t === "r180") { ix = -x; iy = -y; rule = "(x, y) → (−x, −y)"; name = "Rotation 180°"; }
    else { ix = x * a; iy = y * a; rule = `(x, y) → (${a}x, ${a}y)`; name = "Dilation"; }
    let s = "";
    for (let v = -10; v <= 10; v++) {
      s += `<line x1="${PX(v)}" y1="10" x2="${PX(v)}" y2="410" stroke="#E6EBF8" stroke-width="1"/>`;
      s += `<line x1="10" y1="${PY(v)}" x2="410" y2="${PY(v)}" stroke="#E6EBF8" stroke-width="1"/>`;
    }
    s += `<line x1="10" y1="${O}" x2="410" y2="${O}" stroke="#141A2E" stroke-width="1.6"/>`;
    s += `<line x1="${O}" y1="10" x2="${O}" y2="410" stroke="#141A2E" stroke-width="1.6"/>`;
    for (let v = -9; v <= 9; v += 3) if (v) {
      s += `<text x="${PX(v)}" y="${O+14}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#5A648A">${v}</text>`;
      s += `<text x="${O-6}" y="${PY(v)+3}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="9" fill="#5A648A">${v}</text>`;
    }
    ["I","II","III","IV"].forEach((q,i) => {
      const qx = [O+150, O-150, O-150, O+150][i], qy = [O-150, O-150, O+156, O+156][i];
      s += `<text x="${qx}" y="${qy}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#C3CBE4">${q}</text>`;
    });
    const inside = v => v >= -10 && v <= 10;
    s += `<line x1="${PX(x)}" y1="${PY(y)}" x2="${PX(ix)}" y2="${PY(iy)}" stroke="#E8811F" stroke-width="1.4" stroke-dasharray="4,3"/>`;
    s += `<circle cx="${PX(x)}" cy="${PY(y)}" r="6" fill="#2E3FA6"/>`;
    s += `<text x="${PX(x)+9}" y="${PY(y)-8}" font-family="IBM Plex Mono, monospace" font-size="11" fill="#2E3FA6">(${x}, ${y})</text>`;
    if (inside(ix) && inside(iy)) {
      s += `<circle cx="${PX(ix)}" cy="${PY(iy)}" r="6" fill="#E8811F"/>`;
      s += `<text x="${PX(ix)+9}" y="${PY(iy)+16}" font-family="IBM Plex Mono, monospace" font-size="11" fill="#C4650B">(${rnd(ix,2)}, ${rnd(iy,2)})</text>`;
    }
    gv(r,"svg").innerHTML = s;
    const quad = (px,py) => px === 0 || py === 0 ? (px === 0 && py === 0 ? "the origin" : (px === 0 ? "the y-axis" : "the x-axis"))
      : (px>0 ? (py>0?"Quadrant I":"Quadrant IV") : (py>0?"Quadrant II":"Quadrant III"));
    const rigid = t !== "dil";
    gv(r,"out").innerHTML =
      `<b>${name}</b> &nbsp; ${rule}<br>` +
      `(${x}, ${y}) is in ${quad(x,y)} &nbsp;→&nbsp; (${rnd(ix,2)}, ${rnd(iy,2)}) is in ${quad(ix,iy)}<br>` +
      (rigid ? "This is a <b>rigid</b> transformation: the image is congruent to the original — same size, same shape."
             : `Dilation is <b>not</b> rigid: every length is multiplied by ${a}, so the image is <i>similar</i>, not congruent.`) +
      (inside(ix) && inside(iy) ? "" : "<br><i>(The image is off the visible grid — reduce the numbers to see it.)</i>");
  };
  r.querySelectorAll("input,select").forEach(i => i.addEventListener("input", draw));
  draw();
 }
};

            `Diameter = 2r = ${rnd(2*a)}. Square the radius <i>before</i> multiplying by π.`;

TOOLS.dice = {
 title:"Dice roller: theory vs experiment",
 how:"Roll a few times and the bars look random. Roll a thousand and they settle into the theoretical shape. That is the law of large numbers in action.",
 html:`
  <div class="ctrl">
    <div><label>dice per roll</label><select data-f="n"><option value="1">1</option><option value="2" selected>2</option></select></div>
    <div><label>number of rolls</label><select data-f="rolls"><option>10</option><option selected>100</option><option>1000</option></select></div>
    <div><button class="btn btn-main" data-f="go">Roll</button></div>
  </div>
  <svg class="toolsvg" viewBox="0 0 660 220" data-f="svg" role="img" aria-label="Frequency chart of dice totals"></svg>
  <div class="out" data-f="out"></div>`,
 init(r){
  const run = () => {
    const n = parseInt(val(r,"n","2")), rolls = parseInt(val(r,"rolls","100"));
    const lo = n, hi = 6 * n;
    const counts = {}; for (let v = lo; v <= hi; v++) counts[v] = 0;
    const data = [];
    for (let i = 0; i < rolls; i++) {
      let t = 0; for (let d = 0; d < n; d++) t += 1 + Math.floor(Math.random() * 6);
      counts[t]++; data.push(t);
    }
    const max = Math.max(...Object.values(counts), 1);
    const W = 600 / (hi - lo + 1);
    let s = `<line x1="34" y1="180" x2="640" y2="180" stroke="#141A2E" stroke-width="1.5"/>`;
    for (let v = lo; v <= hi; v++) {
      const h = counts[v] / max * 140, x = 36 + (v - lo) * W;
      const ways = n === 1 ? 1 : 6 - Math.abs(v - 7);
      const exp = rolls * ways / Math.pow(6, n);
      s += `<rect x="${x+4}" y="${180-h}" width="${W-8}" height="${h}" fill="#6B3FA0" fill-opacity=".78"/>`;
      s += `<line x1="${x+2}" y1="${180 - exp/max*140}" x2="${x+W-2}" y2="${180 - exp/max*140}" stroke="#E8811F" stroke-width="2"/>`;
      s += `<text x="${x+W/2}" y="196" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5A648A">${v}</text>`;
      if (counts[v]) s += `<text x="${x+W/2}" y="${174-h}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6B3FA0">${counts[v]}</text>`;
    }
    s += `<text x="640" y="16" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" fill="#C4650B">— orange = theoretical prediction</text>`;
    s += `<text x="640" y="30" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" fill="#6B3FA0">bars = your actual rolls</text>`;
    gv(r,"svg").innerHTML = s;
    data.sort((a,b) => a-b);
    const mean = data.reduce((a,b)=>a+b,0)/data.length;
    const mid = data.length/2;
    const median = data.length % 2 ? data[Math.floor(mid)] : (data[mid-1]+data[mid])/2;
    let mode = lo, best = -1;
    for (let v = lo; v <= hi; v++) if (counts[v] > best) { best = counts[v]; mode = v; }
    gv(r,"out").innerHTML =
      `<b>${rolls} rolls of ${n} ${n===1?'die':'dice'}</b><br>` +
      `Mean ${rnd(mean,2)} &nbsp;·&nbsp; median ${median} &nbsp;·&nbsp; mode ${mode} (rolled ${best} times) &nbsp;·&nbsp; range ${data[data.length-1] - data[0]}<br>` +
      `Theoretical mean: ${n === 1 ? "3.5" : "7"}. ` +
      (n === 2 ? "7 is the most likely total because six different pairs make it, while 2 and 12 have only one each." : "Every face is equally likely, so the theoretical bars are all the same height.") +
      `<br>P(exactly ${mode}) experimentally = ${best}/${rolls} = ${rnd(best/rolls,3)}`;
  };
  gv(r,"go").addEventListener("click", run);
  r.querySelectorAll("select").forEach(i => i.addEventListener("change", run));
  run();
 }
};

/* ---------- test ---------- */
function sample(arr, n){
  const idx = arr.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx.slice(0, n).map(i => arr[i]);
}

function renderTestIntro(u){
  setNav(u);
  const U = UNITS[u];
  app.innerHTML = `
  <div class="breadcrumb"><a href="#/">Home</a> &rarr; <a href="#/unit/${u}">Unit ${u}</a> &rarr; Practice test</div>
  <div class="card" style="text-align:center; padding:38px 24px; border:2px solid ${U.hex}">
    <h1 style="font-size:1.6rem">Unit ${u} practice test &mdash; ${U.name}</h1>
    <p style="max-width:580px; margin:14px auto; color:var(--ink-soft)">
      <b class="mono">${TEST_N} questions</b> drawn at random from a bank of ${bankSize(u)} ·
      <b class="mono">30:00</b> countdown, always visible ·
      submits automatically at zero · you can move between questions and change answers until you submit.</p>
    ${U.pool ? `<p class="notice" style="max-width:560px; margin:0 auto 16px">This is a review unit, so the questions come from Units ${U.pool.join(", ")} — mixed, just like the real exam.</p>` : ""}
    <button class="btn btn-main" style="font-size:1.02rem; padding:12px 26px" id="begin">Begin &mdash; the timer starts now</button>
    <p class="notice" style="max-width:560px; margin:16px auto 0">Exam strategy: answer everything easy first, then loop back. Marks left blank are the most expensive mistake there is.</p>
  </div>`;
  document.getElementById("begin").addEventListener("click", () => startTest(u));
}

function startTest(u){
  test = { u, qs: sample(poolFor(u), TEST_N), ans: Array(TEST_N).fill(null),
           i: 0, end: Date.now() + TEST_SECONDS * 1000, running: true, tick: null };
  renderQuestion();
  test.tick = setInterval(() => {
    const left = Math.max(0, Math.round((test.end - Date.now()) / 1000));
    updateTimer(left);
    if (left <= 0) submitTest(true);
  }, 250);
}

const fmtTime = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
function updateTimer(left){
  const t = document.getElementById("timer");
  if (!t) return;
  t.textContent = fmtTime(left);
  t.classList.toggle("warn", left <= 300 && left > 60);
  t.classList.toggle("danger", left <= 60);
}

function renderQuestion(){
  const q = test.qs[test.i];
  const answered = test.ans.filter(a => a !== null).length;
  const total = test.qs.length;
  app.innerHTML = `
  <div class="testbar">
    <span class="timer mono" id="timer">${fmtTime(Math.max(0, Math.round((test.end - Date.now()) / 1000)))}</span>
    <span class="tinfo">Unit ${test.u} · question <b>${test.i + 1}</b> of ${total} · ${answered} answered</span>
    <span class="spacer"></span>
    <button class="btn btn-main" id="submit">Submit test</button>
  </div>
  <div class="qcard">
    <p class="qtext"><b>Q${test.i + 1}.</b> ${q.q}</p>
    ${q.o.map((o, j) => `<button class="opt ${test.ans[test.i] === j ? "sel" : ""}" data-j="${j}">${String.fromCharCode(65 + j)}. &nbsp;${o}</button>`).join("")}
    <div class="prow" style="justify-content:space-between; margin-top:16px">
      <button class="btn" id="prev" ${test.i === 0 ? "disabled" : ""}>&larr; Previous</button>
      <button class="btn" id="next" ${test.i === total - 1 ? "disabled" : ""}>Next &rarr;</button>
    </div>
  </div>
  <div class="qnav">${test.qs.map((_, k) => `<button class="qdot ${test.ans[k] !== null ? "answered" : ""} ${k === test.i ? "cur" : ""}" data-k="${k}">${k + 1}</button>`).join("")}</div>
  <p class="notice">The timer keeps running while you navigate. Unanswered questions count as incorrect.</p>`;

  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    test.ans[test.i] = +b.dataset.j;
    if (test.i < total - 1) test.i++;
    renderQuestion();
  }));
  document.getElementById("prev").addEventListener("click", () => { test.i--; renderQuestion(); });
  document.getElementById("next").addEventListener("click", () => { test.i++; renderQuestion(); });
  app.querySelectorAll(".qdot").forEach(b => b.addEventListener("click", () => { test.i = +b.dataset.k; renderQuestion(); }));
  document.getElementById("submit").addEventListener("click", () => {
    const blank = test.ans.filter(a => a === null).length;
    if (blank > 0 && !confirm(`You still have ${blank} unanswered question(s). Submit anyway?`)) return;
    submitTest(false);
  });
}

function submitTest(auto){
  clearInterval(test.tick); test.running = false;
  const U = UNITS[test.u];
  const total = test.qs.length;
  let right = 0;
  test.qs.forEach((q, i) => { if (test.ans[i] === q.a) right++; });
  const pct = Math.round(right / total * 100);
  const msg = pct >= 90 ? "Outstanding — you own this unit."
    : pct >= 80 ? "Strong work. That is test-ready."
    : pct >= 65 ? "Good progress. Review the topics you missed below, then take a fresh test."
    : "A solid start. Reread the explanations behind your missed questions, then come back for a new mix of 30.";
  app.innerHTML = `
  <div class="card result-hero" style="border:2px solid ${U.hex}">
    ${auto ? '<p style="color:var(--bad); font-weight:700">Time expired — the test submitted automatically.</p>' : ""}
    <div class="score" style="color:${U.hex}">${right} / ${total}</div>
    <p style="font-size:1.3rem; font-weight:700">${pct}%</p>
    <p style="max-width:520px; margin:10px auto; color:var(--ink-soft)">${msg}</p>
    <div class="prow" style="justify-content:center; margin-top:16px">
      <button class="btn btn-main" id="again">Try a new set of ${TEST_N}</button>
      <a class="btn" style="text-decoration:none" href="#/unit/${test.u}">Back to Unit ${test.u}</a>
      <a class="btn" style="text-decoration:none" href="#/reference">Formula sheet</a>
    </div>
  </div>
  <h2 style="margin:26px 0 8px">Question review</h2>
  ${test.qs.map((q, i) => {
    const ok = test.ans[i] === q.a, ua = test.ans[i];
    return `<div class="review-q ${ok ? "ok" : "no"}">
      <p><b>Q${i + 1}.</b> ${q.q}</p>
      <p class="ra">${ok ? `<span class="pill-ok">Correct:</span> ${q.o[q.a]}`
        : `<span class="pill-no">${ua === null ? "Not answered" : "Your answer: " + q.o[ua]}</span><br><span class="pill-ok">Correct answer:</span> ${q.o[q.a]}`}</p>
      ${q.e ? `<p class="expl">${q.e}</p>` : ""}
    </div>`; }).join("")}`;
  const doneUnit = test.u; test = null;
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", () => startTest(doneUnit));
  window.scrollTo(0, 0);
}

route();
</script>
