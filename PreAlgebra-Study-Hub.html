<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Algebra 6 — Student &amp; Family Study Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141A2E; --ink-soft:#5A648A; --paper:#F4F6FC; --card:#FFFFFF;
  --line:#DDE3F2; --grid:#E6EBF8;
  --pen:#2E3FA6; --pen-dark:#1E2C7A; --mark:#E8811F; --mark-soft:#FFF4E5;
  --good:#1F7A4D; --bad:#C0392B;
  --r:14px;
}
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{transition:none!important; animation:none!important} }
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg,var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
  color:var(--ink); font-family:'Atkinson Hyperlegible',system-ui,sans-serif; font-size:17px; line-height:1.6;
}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Bricolage Grotesque Fallback',sans-serif; line-height:1.15; font-weight:800; letter-spacing:-.01em}
.mono{font-family:'IBM Plex Mono',monospace}
a{color:var(--pen-dark)}
button{font-family:inherit; cursor:pointer}
input,select{font-family:inherit; font-size:1rem}
:focus-visible{outline:3px solid var(--mark); outline-offset:2px; border-radius:4px}
.wrap{max-width:1060px; margin:0 auto; padding:0 20px}
.skip{position:absolute; left:-9999px}
.skip:focus{left:12px; top:12px; z-index:99; background:#fff; padding:8px 14px; border-radius:8px; border:2px solid var(--pen)}

/* ---------- nav ---------- */
nav{position:sticky; top:0; z-index:50; background:rgba(244,246,252,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.nav-in{display:flex; align-items:center; gap:12px; padding:9px 20px; max-width:1060px; margin:0 auto; flex-wrap:wrap}
.basis-badge{margin-right:auto; order:1; display:flex; align-items:center; height:96px}
.basis-badge img{height:100%; width:auto; display:block}

.brand{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:1.02rem; color:var(--ink); text-decoration:none; order:3; display:flex; align-items:center; gap:9px}
.brand .glyph{width:32px;height:32px;display:block;flex:none}
.brand .glyph svg{width:100%;height:100%;display:block}
.brandtext{display:flex;flex-direction:column;line-height:1.05}
.brandtext small{font-size:.55rem;letter-spacing:.16em;color:var(--mark);font-family:'IBM Plex Mono',monospace;font-weight:600;margin-top:2px}
.mkmark{display:inline-flex;align-items:center;gap:9px}
.mkmark .mkbadge{width:34px;height:34px;flex:none}
.mkmark .mkbadge svg{width:100%;height:100%;display:block}
.mkmark b{font-family:'Bricolage Grotesque',sans-serif;font-size:.95rem;color:var(--ink);line-height:1}
.mkmark span{font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.16em;color:var(--mark);font-weight:600}
.navtiles{display:flex; gap:5px; flex-wrap:wrap; order:2}
.ntile{display:block; text-decoration:none; border:1.5px solid var(--line); border-radius:8px; padding:2px 7px; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:.9rem; color:var(--ink); background:#fff; text-align:center; min-width:34px}
.ntile small{display:block; font-size:.52rem; font-weight:600; color:var(--ink-soft); letter-spacing:.04em; font-family:'IBM Plex Mono',monospace}
.ntile:hover{border-color:currentColor}
.ntile.active{color:#fff!important; border-color:transparent}
.ntile.active small{color:rgba(255,255,255,.85)}

/* ---------- unit tiles (signature) ---------- */
.utile{border:2px solid; border-radius:12px; background:#fff; padding:13px 14px 12px; text-decoration:none; color:var(--ink); display:flex; flex-direction:column; min-height:152px; position:relative; overflow:hidden; transition:transform .15s ease, box-shadow .15s ease}
.utile::after{content:""; position:absolute; inset:auto 0 0 0; height:34px;
  background-image:linear-gradient(currentColor 1px,transparent 1px),linear-gradient(90deg,currentColor 1px,transparent 1px);
  background-size:11px 11px; opacity:.11; pointer-events:none}
.utile:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(20,26,46,.13)}
.utile .num{font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.08em; color:var(--ink-soft); text-transform:uppercase}
.utile .sym{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:2.5rem; margin-top:0; line-height:1.05}
.utile .uname{font-weight:700; font-size:.95rem; margin-top:auto; position:relative; z-index:1}
.utile .umeta{font-size:.72rem; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; position:relative; z-index:1}
.utile.review{border-style:dashed}
.tilegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:13px; margin:22px 0 8px}

/* ---------- hero ---------- */
.hero{padding:48px 0 26px; display:grid; grid-template-columns:1fr auto; gap:24px; align-items:center}
.hero .kicker{font-family:'IBM Plex Mono',monospace; font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--pen-dark)}
.hero h1{font-size:clamp(2rem,5vw,3.05rem); margin:10px 0 14px; max-width:740px}
.hero h1 em{font-style:normal; color:var(--pen); position:relative; white-space:nowrap}
.hero h1 em::after{content:""; position:absolute; left:-2px; right:-2px; bottom:.06em; height:.34em; background:var(--mark); opacity:.28; z-index:-1; border-radius:3px}
.hero p{max-width:660px; color:var(--ink-soft); font-size:1.04rem}
.heroart{width:190px}
.herocap{font-family:'IBM Plex Mono',monospace; font-size:.66rem; color:var(--ink-soft); text-align:center; margin-top:4px}
@media(max-width:760px){ .hero{grid-template-columns:1fr} .heroart{display:none} }

/* ---------- cards & sections ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px 22px; margin:16px 0}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:16px 0}
@media(max-width:760px){ .grid2{grid-template-columns:1fr} }
.section-h{display:flex; align-items:baseline; gap:11px; margin:32px 0 6px; flex-wrap:wrap}
.section-h h2{font-size:1.4rem}
.section-h .tag{font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; color:#fff; padding:3px 9px; border-radius:99px}
.levelup{background:var(--mark-soft); border:1.5px solid var(--mark); border-radius:12px; padding:13px 15px; margin:14px 0 2px; font-size:.96rem}
.levelup b.lu{font-family:'Bricolage Grotesque',sans-serif; color:#9A5A0E; display:block; margin-bottom:4px; font-size:.8rem; letter-spacing:.06em; text-transform:uppercase}
.parentbox{border-left:5px solid; border-radius:0 12px 12px 0; background:#fff; padding:15px 19px; margin:16px 0; border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line)}
.parentbox h3{font-size:1.02rem; margin-bottom:8px}
.parentbox ul{margin:0 0 0 20px}
.parentbox li{margin:5px 0}
.vocab{display:flex; flex-wrap:wrap; gap:7px; margin:10px 0}
.vocab span{background:#fff; border:1.5px solid var(--line); border-radius:99px; padding:3px 12px; font-size:.84rem; font-weight:700}
.theory p{margin:9px 0}
.theory ul,.theory ol{margin:8px 0 8px 22px}
.theory li{margin:4px 0}
.theory table{border-collapse:collapse; margin:12px 0; width:100%; font-size:.92rem}
.theory th,.theory td{border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top}
.theory th{background:var(--paper); font-family:'Bricolage Grotesque',sans-serif; font-size:.84rem}
.formula{font-family:'IBM Plex Mono',monospace; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:2px 8px; white-space:nowrap; font-size:.94rem}
.worked{border-left:4px solid var(--pen); background:var(--paper); border-radius:0 10px 10px 0; padding:11px 15px; margin:12px 0; font-family:'IBM Plex Mono',monospace; font-size:.9rem; line-height:1.85}
.worked b{font-family:'Atkinson Hyperlegible',sans-serif}
.breadcrumb{font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--ink-soft); padding-top:16px}
.breadcrumb a{color:var(--ink-soft)}
.notice{background:#fff; border:1px dashed var(--line); border-radius:10px; padding:9px 13px; font-size:.88rem; color:var(--ink-soft); margin:12px 0}

/* ---------- unit hero ---------- */
.unit-hero{display:grid; grid-template-columns:150px 1fr; gap:20px; align-items:center; margin:10px 0 6px}
.unit-hero h1{font-size:clamp(1.6rem,4vw,2.3rem)}
@media(max-width:640px){ .unit-hero{grid-template-columns:1fr} }

/* ---------- buttons ---------- */
.btn{border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:8px 14px; font-weight:700; font-size:.92rem; color:var(--ink)}
.btn:hover{border-color:var(--pen)}
.btn-main{background:var(--pen); border-color:var(--pen); color:#fff}
.btn-main:hover{background:var(--pen-dark); border-color:var(--pen-dark)}
.btn-hint{background:var(--mark-soft); border-color:var(--mark)}
.btn-sol{background:#fff}
.prow{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-top:10px}

/* ---------- practice problems ---------- */
.prob{background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; margin:12px 0}
.pq{display:flex; gap:10px; align-items:flex-start}
.pnum{color:#fff; font-family:'IBM Plex Mono',monospace; font-size:.74rem; font-weight:600; border-radius:7px; padding:2px 7px; flex:none; margin-top:3px}
.hintbox{background:var(--mark-soft); border:1px solid var(--mark); border-radius:10px; padding:11px 14px; margin-top:10px; font-size:.94rem}
.solbox{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:11px 16px 14px; margin-top:10px}
.solbox ol{margin-left:20px}
.solbox li{margin:5px 0}
.final{margin-top:9px; font-weight:700; color:var(--good)}

/* ---------- tools ---------- */
.toolcard{border:1px solid var(--line); border-radius:var(--r); background:#fff; margin:14px 0; overflow:hidden}
.toolhead{padding:13px 18px 0}
.toolhead h3{font-size:1.05rem}
.toolhow{font-size:.86rem; color:var(--ink-soft); padding:4px 18px 10px}
.toolbody{padding:0 18px 16px}
.ctrl{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px}
.ctrl label{font-size:.78rem; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); display:block; letter-spacing:.03em}
.ctrl input,.ctrl select{border:1.5px solid var(--line); border-radius:8px; padding:6px 9px; width:88px; background:#fff}
.ctrl select{width:auto}
.ctrl input[type=range]{width:150px; padding:0}
.out{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:11px 14px; font-family:'IBM Plex Mono',monospace; font-size:.92rem; line-height:1.8; overflow-x:auto}
.out b{font-family:'Atkinson Hyperlegible',sans-serif}
.toolsvg{width:100%; height:auto; display:block; background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:10px}
.simcard{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin:14px 0; background:#fff}
.simhead{padding:13px 18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.simhead h3{font-size:1.02rem; margin-right:auto}
.simframe{width:100%; aspect-ratio:16/10; border:0; display:block; background:#111}
.simload{width:100%; aspect-ratio:16/10; display:grid; place-items:center; background:linear-gradient(135deg,#1E2C7A,#2E3FA6); color:#fff; border:0; font-family:'Bricolage Grotesque',sans-serif; font-size:1.02rem; font-weight:800}
.simhow{padding:11px 18px; font-size:.88rem; color:var(--ink-soft); border-top:1px solid var(--line)}

/* ---------- test ---------- */
.testbar{position:sticky; top:52px; z-index:40; display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin:16px 0}
.timer{font-size:1.35rem; font-weight:600; padding:2px 10px; border-radius:8px; background:var(--paper); border:1px solid var(--line)}
.timer.warn{background:var(--mark-soft); border-color:var(--mark); color:#9A5A0E}
.timer.danger{background:#FDECEA; border-color:var(--bad); color:var(--bad)}
.tinfo{font-size:.88rem; color:var(--ink-soft)}
.spacer{flex:1}
.qcard{background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:20px 22px}
.qtext{font-size:1.06rem; margin-bottom:14px}
.opt{display:block; width:100%; text-align:left; border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:10px 14px; margin:7px 0; font-size:.98rem}
.opt:hover{border-color:var(--pen); background:#FAFBFF}
.opt.sel{border-color:var(--pen); background:#EEF1FC; font-weight:700}
.qnav{display:flex; flex-wrap:wrap; gap:5px; margin:14px 0}
.qdot{width:31px; height:31px; border-radius:8px; border:1.5px solid var(--line); background:#fff; font-size:.76rem; font-family:'IBM Plex Mono',monospace}
.qdot.answered{background:#EEF1FC; border-color:var(--pen); color:var(--pen-dark)}
.qdot.cur{outline:2px solid var(--mark); outline-offset:1px}
.result-hero{text-align:center; padding:30px 24px}
.score{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:3.2rem; line-height:1}
.review-q{background:#fff; border:1px solid var(--line); border-left:5px solid; border-radius:0 12px 12px 0; padding:13px 17px; margin:10px 0}
.review-q.ok{border-left-color:var(--good)}
.review-q.no{border-left-color:var(--bad)}
.ra{font-size:.93rem; margin-top:6px}
.pill-ok{color:var(--good); font-weight:700}
.pill-no{color:var(--bad); font-weight:700}
.expl{font-size:.9rem; color:var(--ink-soft); margin-top:6px; border-top:1px dashed var(--line); padding-top:6px}

/* ---------- reference sheet ---------- */
.reftable{width:100%; border-collapse:collapse; font-size:.93rem; margin-top:8px}
.reftable th,.reftable td{border:1px solid var(--line); padding:7px 10px; text-align:left}
.reftable th{background:var(--paper); font-family:'Bricolage Grotesque',sans-serif; font-size:.85rem}
.reftable td.f{font-family:'IBM Plex Mono',monospace; white-space:nowrap}
footer{border-top:1px solid var(--line); margin-top:44px; padding:22px 0 40px; font-size:.83rem; color:var(--ink-soft)}
</style>
</head>

"1": {
 sym:"&plusmn;", name:"Number Sense &amp; Operations", hex:"#2E3FA6", dates:"August 13 – August 29",
 tagline:"Integers, order of operations and the rules that never change",
 blurb:"Everything else this year rests on this unit: what kinds of numbers exist, how they sit on the number line, how to add and multiply them when signs get involved, and which operation to do first.",

 sections:[
  {h:"The families of numbers", body:`
   <p>Numbers are sorted into nested groups — each family fits inside the next one:</p>
   <table>
    <tr><th>Family</th><th>What it contains</th><th>Examples</th></tr>
    <tr><td><b>Natural (counting)</b></td><td>the numbers you count with</td><td>1, 2, 3, …</td></tr>
    <tr><td><b>Whole</b></td><td>counting numbers plus zero</td><td>0, 1, 2, 3, …</td></tr>
    <tr><td><b>Integers</b></td><td>whole numbers and their opposites</td><td>… −2, −1, 0, 1, 2 …</td></tr>
    <tr><td><b>Rational</b></td><td>anything writable as a fraction of integers — including terminating and repeating decimals</td><td>3/4, −5, 0.25, 0.333…</td></tr>
    <tr><td><b>Irrational</b></td><td>decimals that never end and never repeat</td><td>&radic;2, &pi;</td></tr>
    <tr><td><b>Real</b></td><td>every rational and irrational number together</td><td>all of the above</td></tr>
   </table>
   <p>Every point on the number line is one real number, and every real number has exactly one home on the line. Numbers get <b>smaller</b> as you move left, which is why −8 &lt; −3 even though 8 &gt; 3.</p>
   <p><b>Absolute value</b> — written |x| — is the <i>distance</i> from zero, so it is never negative: |−7| = 7 and |7| = 7. Two numbers with the same absolute value but opposite signs are called <b>opposites</b>, and they always add to zero.</p>`,
   levelup:"&radic;2 is irrational, and the Greeks proved it about 2,500 years ago. The proof is short: assume &radic;2 = a/b in lowest terms, square both sides, and you can show a and b must <i>both</i> be even — which contradicts 'lowest terms'."},
  {h:"Signed numbers: the four rules", body:`
   <p>Adding and subtracting are easiest to think about as movement on the number line; multiplying and dividing follow a sign pattern.</p>
   <table>
    <tr><th>Operation</th><th>Rule</th><th>Example</th></tr>
    <tr><td>Add, same signs</td><td>add the values, keep the sign</td><td>−6 + (−5) = −11</td></tr>
    <tr><td>Add, different signs</td><td>subtract the values, keep the sign of the bigger one</td><td>−9 + 4 = −5</td></tr>
    <tr><td>Subtract</td><td>add the opposite</td><td>7 − (−3) = 7 + 3 = 10</td></tr>
    <tr><td>Multiply / divide</td><td>same signs → positive; different signs → negative</td><td>(−4)(−6) = 24, (−4)(6) = −24</td></tr>
   </table>
   <div class="worked"><b>Watch the two minus signs:</b><br>−8 − (−15)<br>= −8 + 15 &nbsp; <i>(subtracting is adding the opposite)</i><br>= 7</div>
   <p>A useful check: your answer's sign should match the "direction" of the problem. Starting at −8 and going <i>up</i> 15 must land above zero.</p>`,
   levelup:"Why is negative × negative positive? Look at the pattern: (−3)(2) = −6, (−3)(1) = −3, (−3)(0) = 0, so (−3)(−1) must continue the +3 pattern and equal 3."},
  {h:"Order of operations", body:`
   <p>Without a shared rule, 8 + 3 × 4 could be 44 or 20. Mathematicians agreed on <b>PEMDAS</b>:</p>
   <ol>
    <li><b>P</b>arentheses (and other grouping symbols such as fraction bars and square-root signs)</li>
    <li><b>E</b>xponents</li>
    <li><b>M</b>ultiplication and <b>D</b>ivision — left to right, whichever comes first</li>
    <li><b>A</b>ddition and <b>S</b>ubtraction — left to right</li>
   </ol>
   <p>The last two lines are where most marks are lost. Multiplication does <b>not</b> outrank division; they share a rank and are done in reading order.</p>
   <div class="worked"><b>Example:</b> 36 &divide; (4 + 5) × 2<br>= 36 &divide; 9 × 2 &nbsp; <i>(parentheses first)</i><br>= 4 × 2 &nbsp; <i>(left to right — divide first)</i><br>= 8</div>
   <p>One more trap: <span class="formula">−2&#8308; = −16</span> but <span class="formula">(−2)&#8308; = 16</span>. Without parentheses, the exponent belongs only to the 2, and the minus sign stays outside.</p>`,
   levelup:"Calculators and spreadsheets follow PEMDAS too — but they read a fraction bar differently than you do. In a spreadsheet you must type (a + b)/2, because a + b/2 means something else entirely."},
  {h:"Properties, rounding and estimation", body:`
   <p>The properties give you permission to rearrange work into an easier form:</p>
   <table>
    <tr><th>Property</th><th>What it lets you do</th><th>Example</th></tr>
    <tr><td>Commutative</td><td>swap the order (+ and × only)</td><td>7 + 3 = 3 + 7</td></tr>
    <tr><td>Associative</td><td>regroup with parentheses (+ and × only)</td><td>(2 × 5) × 4 = 2 × (5 × 4)</td></tr>
    <tr><td>Distributive</td><td>multiply across a sum</td><td>4(x + 6) = 4x + 24</td></tr>
    <tr><td>Identity</td><td>+ 0 or × 1 changes nothing</td><td>9 × 1 = 9</td></tr>
    <tr><td>Inverse</td><td>a number plus its opposite is 0; times its reciprocal is 1</td><td>5 × 1/5 = 1</td></tr>
   </table>
   <p>Notice what is missing: subtraction and division are <b>not</b> commutative or associative. 10 − 4 does not equal 4 − 10.</p>
   <p><b>Rounding:</b> look at the digit one place to the <i>right</i> of where you are rounding. 5 or more rounds up; 4 or less leaves the digit alone.</p>
   <p><b>Estimation</b> is how you catch mistakes. Before calculating 19.7 × 4.9, round to 20 × 5 = 100. If your calculator says 9,653, you know a decimal point went missing.</p>`,
   levelup:"The distributive property is why mental maths works: 7 × 98 is easier as 7(100 − 2) = 700 − 14 = 686."}
 ],

 vocab:["numerator","denominator","prime","composite","prime factorisation","GCF","LCM","least common denominator","equivalent fractions","simplest form","improper fraction","mixed number","reciprocal"],
 sections:[
  {h:"Primes, factors and multiples", body:`
   <p>A <b>prime</b> number has exactly two factors: 1 and itself (2, 3, 5, 7, 11, 13, …). A <b>composite</b> number has more. The number 1 is neither.</p>
   <p><b>Prime factorisation</b> breaks a number into its prime building blocks, usually with a factor tree:</p>
   <div class="worked">60 → 6 × 10 → (2 × 3) × (2 × 5)<br>60 = 2&sup2; × 3 × 5</div>
   <p>Divisibility shortcuts save time when building the tree:</p>
   <table>
    <tr><th>Divisible by</th><th>Test</th></tr>
    <tr><td>2</td><td>the last digit is even</td></tr>
    <tr><td>3</td><td>the digits add to a multiple of 3</td></tr>
    <tr><td>4</td><td>the last two digits form a multiple of 4</td></tr>
    <tr><td>5</td><td>it ends in 0 or 5</td></tr>
    <tr><td>6</td><td>it passes both the 2 test and the 3 test</td></tr>
    <tr><td>9</td><td>the digits add to a multiple of 9</td></tr>
    <tr><td>10</td><td>it ends in 0</td></tr>
   </table>
   <p>From the prime factorisations you can read off both key tools: the <b>GCF</b> is the product of the primes both numbers share, and the <b>LCM</b> is the product of the highest power of every prime that appears in either.</p>
   <div class="worked">24 = 2&sup3; × 3 &nbsp; and &nbsp; 36 = 2&sup2; × 3&sup2;<br>GCF = 2&sup2; × 3 = 12 &nbsp; (shared)<br>LCM = 2&sup3; × 3&sup2; = 72 &nbsp; (highest of each)</div>
   <p>Remember which one you need: <b>GCF simplifies</b> a fraction, <b>LCM combines</b> fractions.</p>`,
   levelup:"For any two numbers, GCF × LCM = the product of the numbers. Check it: 12 × 72 = 864 and 24 × 36 = 864."},
  {h:"Simplifying and comparing", body:`
   <p>A fraction is in <b>simplest form</b> when the numerator and denominator share no factor except 1. Divide both by their GCF:</p>
   <div class="worked">18/24 &nbsp; (GCF = 6)<br>= (18 &divide; 6)/(24 &divide; 6)<br>= 3/4</div>
   <p><b>Equivalent fractions</b> come from multiplying or dividing the top and bottom by the same number — that is really just multiplying by a disguised 1, which is why the value does not change.</p>
   <p>To compare two fractions you have three good options:</p>
   <ul>
    <li>Rewrite them with a common denominator and compare numerators.</li>
    <li>Convert both to decimals.</li>
    <li>Cross multiply: for a/b and c/d, compare a×d with b×c.</li>
   </ul>
   <p><b>Improper fractions and mixed numbers</b> are two costumes for the same value. To go from mixed to improper, multiply the whole number by the denominator and add the numerator. To go back, divide.</p>`,
   levelup:"Benchmark thinking beats calculation. Is 7/15 or 8/17 bigger? Both are just under 1/2 — but 7/15 needs 7.5 to reach half and 8/17 needs 8.5, so 8/17 is closer to half and therefore larger."},
  {h:"The four operations", body:`
   <table>
    <tr><th>Operation</th><th>Method</th><th>Example</th></tr>
    <tr><td>Multiply</td><td>straight across (cancel first if you can)</td><td>2/3 × 3/5 = 6/15 = 2/5</td></tr>
    <tr><td>Divide</td><td>keep – change – flip (multiply by the reciprocal)</td><td>3/4 &divide; 2/5 = 3/4 × 5/2 = 15/8</td></tr>
    <tr><td>Add / subtract</td><td>find the least common denominator first</td><td>1/2 + 1/3 = 3/6 + 2/6 = 5/6</td></tr>
   </table>
   <p>Notice the surprise: multiplying and dividing are the <i>easy</i> ones. Only addition and subtraction need a common denominator, because you can only combine pieces that are the same size.</p>
   <div class="worked"><b>Mixed numbers:</b> 3&frac14; − 1&frac12;<br>= 13/4 − 3/2 &nbsp; <i>(go improper — no borrowing needed)</i><br>= 13/4 − 6/4<br>= 7/4 = <b>1&frac34;</b></div>
   <p>A quick reality check on division: dividing by a number smaller than 1 makes your answer <i>bigger</i>. 7½ &divide; ½ = 15 makes sense — there really are 15 half-feet in a 7½-foot board.</p>`,
   levelup:"'Keep–change–flip' isn't magic. Dividing by 2/5 means asking how many 2/5-sized pieces fit, and multiplying by 5/2 counts exactly that."},
  {h:"Fractions, decimals and everyday use", body:`
   <p>A fraction bar means divide. So 3/8 = 3 &divide; 8 = 0.375. Going the other way, say the decimal out loud and write what you hear: 0.35 is "thirty-five hundredths" = 35/100 = 7/20.</p>
   <p>These conversions are worth memorising — they show up on every test:</p>
   <table>
    <tr><th>Fraction</th><td>1/2</td><td>1/3</td><td>1/4</td><td>1/5</td><td>1/8</td><td>3/4</td><td>2/3</td></tr>
    <tr><th>Decimal</th><td>0.5</td><td>0.333…</td><td>0.25</td><td>0.2</td><td>0.125</td><td>0.75</td><td>0.666…</td></tr>
   </table>
   <p>A fraction terminates as a decimal exactly when its simplified denominator contains only the primes 2 and 5 — which is why eighths and twentieths end, but thirds and sevenths repeat forever.</p>`,
   levelup:"Every repeating decimal is secretly a fraction. Try this: if x = 0.777…, then 10x = 7.777…, so 9x = 7 and x = 7/9."}
 ],

  {title:"PhET: Fractions — Intro", src:"https://phet.colorado.edu/sims/html/fractions-intro/latest/fractions-intro_en.html",
   how:"Build a fraction with circles, bars or beakers and watch the number change. Try: make 3/4 and 6/8 side by side and confirm they fill exactly the same amount."},

 practice:[
  {q:"Simplify <b>84/120</b> using prime factorisation.", hint:"Factor both numbers into primes and cross out everything they share.",
   steps:["84 = 2&sup2; × 3 × 7.","120 = 2&sup3; × 3 × 5.","Shared factors (the GCF) = 2&sup2; × 3 = 12.","84 &divide; 12 = 7 and 120 &divide; 12 = 10, so the answer is <b>7/10</b>."], ans:"7/10"},
  {q:"Find the GCF and LCM of <b>18 and 24</b>.", hint:"Write both prime factorisations in a column and line up matching primes.",

  {q:"Calculate <b>5/6 − 3/8</b>.", hint:"The LCD of 6 and 8 is not 48 — find the least common multiple.",
   steps:["6 = 2 × 3 and 8 = 2&sup3;, so the LCM is 2&sup3; × 3 = 24.","5/6 = 20/24 and 3/8 = 9/24.","20/24 − 9/24 = <b>11/24</b>, which is already simplest."], ans:"11/24"},
  {q:"Calculate <b>2&frac25; × 1&frac78;</b>.", hint:"Convert both to improper fractions first, then cancel before you multiply.",
   steps:["2&frac25; = 12/5 and 1&frac78; = 15/8.","12/5 × 15/8: cancel 5 into 15 (→3) and 4 into 12 and 8 (→3 and 2).","That leaves 3/1 × 3/2 = 9/2.","9/2 = <b>4&frac12;</b>."], ans:"4½"},
  {q:"Calculate <b>3&frac13; &divide; 5/6</b>.", hint:"Improper fraction, then keep–change–flip.",
   steps:["3&frac13; = 10/3.","10/3 &divide; 5/6 = 10/3 × 6/5.","Cancel: 5 into 10 (→2) and 3 into 6 (→2).","2 × 2 = <b>4</b>. Check: 5/6 fits into 3⅓ four times exactly."], ans:"4"},
  {q:"Order from least to greatest: <b>5/8, 3/5, 0.62, 2/3</b>", hint:"Decimals make this fast — divide each fraction out to three places.",
   steps:["5/8 = 0.625, 3/5 = 0.600, 2/3 ≈ 0.667, and 0.62 stays 0.62.","Sort the decimals: 0.600, 0.62, 0.625, 0.667.","Answer: <b>3/5, 0.62, 5/8, 2/3</b>."], ans:"3/5, 0.62, 5/8, 2/3"},
  {q:"A recipe uses <b>2/3</b> cup of flour. You want to make <b>2½</b> batches. How much flour?", hint:"'Of' means multiply. Convert the mixed number first.",
   steps:["2½ = 5/2.","5/2 × 2/3 = 10/6.","Simplify: 10/6 = 5/3 = <b>1⅔ cups</b>."], ans:"1⅔ cups"},
  {q:"A 12-metre rope is cut into pieces <b>3/4</b> of a metre long. How many pieces, and how much rope is left over?", hint:"'How many fit' means divide. Then check whether the answer came out whole.",
   steps:["12 &divide; 3/4 = 12 × 4/3.","= 48/3 = 16.","You get <b>16 pieces with nothing left over</b>, because 16 × 3/4 = 12 exactly."], ans:"16 pieces, no remainder"}
 ]

"3": {
 sym:"x", name:"Expressions &amp; Equations", hex:"#0E7C86", dates:"September 16 – October 11",
 tagline:"Letters that stand for numbers, and how to solve for them",
 blurb:"This is the unit that gives the course its name. You will translate English into algebra, tidy expressions by combining like terms, and undo operations to solve for an unknown.",
 parent:[
  "Understand a variable as a symbol standing in for an unknown number.",
  "Translate English phrases into algebraic expressions and back again.",
  "Evaluate expressions by substituting values, including negative ones.",
  "Combine like terms and use the distributive property to simplify.",
  "Solve one-step, two-step and multi-step equations, including ones with fractions and decimals.",
  "Check whether a given number is a solution, and set up equations from word problems."
 ],
 vocab:["variable","coefficient","constant","term","like terms","expression","equation","solution","inverse operation","properties of equality","distribute","substitute"],
 sections:[
  {h:"The vocabulary of algebra", body:`
   <p>In the expression <span class="formula">7x + 3y − 5</span>:</p>
   <ul>
    <li><b>Terms</b> are the pieces separated by + and −: 7x, 3y and −5.</li>
    <li><b>Coefficients</b> are the numbers multiplying the variables: 7 and 3.</li>
    <li><b>Constants</b> are the plain numbers: −5.</li>
    <li><b>Variables</b> are the letters standing for unknown values: x and y.</li>
   </ul>
   <p>An <b>expression</b> has no equals sign, so it can only be simplified or evaluated. An <b>equation</b> has an equals sign, so it can be solved.</p>
   <p><b>Like terms</b> have exactly the same variable part — same letters, same exponents. 5x and −2x are like terms; 4x and 4x&sup2; are not, and neither are 3x and 3y.</p>
   <div class="worked">4x + 7 − x − 2<br>= (4x − x) + (7 − 2)<br>= <b>3x + 5</b></div>`,
   levelup:"'x' as the letter for the unknown may come from Arabic mathematics: al-Jabr texts used <i>shay</i> ('thing'), which Spanish translators wrote as <i>xei</i> — later shortened to x."},
  {h:"Translating words into algebra", body:`
   <table>
    <tr><th>Operation</th><th>Words that signal it</th></tr>
    <tr><td>+</td><td>sum, more than, increased by, total, plus, gain</td></tr>
    <tr><td>−</td><td>difference, less than, decreased by, fewer, minus, drop</td></tr>
    <tr><td>×</td><td>product, times, of, twice, doubled, each</td></tr>
    <tr><td>&divide;</td><td>quotient, per, split evenly, half of, ratio</td></tr>
   </table>
   <p>Two phrases flip the order, and they cause more mistakes than anything else in this unit:</p>
   <ul>
    <li>"6 <b>less than</b> a number" is <span class="formula">n − 6</span>, not 6 − n.</li>
    <li>"a number <b>subtracted from</b> 10" is <span class="formula">10 − n</span>.</li>
   </ul>
   <p>Use parentheses whenever an operation applies to a whole quantity: "4 times the sum of a number and 3" is <span class="formula">4(n + 3)</span>, which is very different from 4n + 3.</p>
   <div class="worked"><b>Evaluating:</b> find 2(x + 9) when x = −3<br>= 2(−3 + 9)<br>= 2(6)<br>= <b>12</b></div>`,
   levelup:"Every formula you will meet is just a translated sentence. 'Distance is speed times time' becomes d = rt, and rearranging it is the same skill as solving an equation."},
  {h:"Solving equations: keep the balance", body:`
   <p>An equation is a balance scale. Whatever you do to one side you must do to the other, or it tips. To isolate the variable, undo operations with their <b>inverses</b>:</p>
   <table>
    <tr><th>You see</th><th>You do</th></tr>
    <tr><td>+ 5</td><td>subtract 5 from both sides</td></tr>
    <tr><td>− 8</td><td>add 8 to both sides</td></tr>
    <tr><td>× 3</td><td>divide both sides by 3</td></tr>
    <tr><td>&divide; 4</td><td>multiply both sides by 4</td></tr>
   </table>
   <p>For multi-step equations, undo in the <b>reverse</b> of PEMDAS order: strip away addition and subtraction first, then multiplication and division.</p>
   <div class="worked"><b>Solve 2x + 5 = 17</b><br>2x + 5 − 5 = 17 − 5 &nbsp; <i>(undo + 5)</i><br>2x = 12<br>2x &divide; 2 = 12 &divide; 2 &nbsp; <i>(undo × 2)</i><br>x = <b>6</b><br><br><b>Check:</b> 2(6) + 5 = 17 ✓</div>
   <p>Always check. Substituting your answer back in takes ten seconds and catches nearly every sign error.</p>`,
   levelup:"Some equations have no solution (x + 3 = x + 5 is never true) and some have infinitely many (2x + 4 = 2(x + 2) is always true). You will meet both in Algebra 1."},
  {h:"Variables on both sides, fractions and word problems", body:`
   <p>When the variable appears on both sides, move all variable terms to one side and all constants to the other:</p>
   <div class="worked"><b>Solve 7x − 2 = 4x + 13</b><br>7x − 4x − 2 = 13 &nbsp; <i>(subtract 4x from both sides)</i><br>3x − 2 = 13<br>3x = 15<br>x = <b>5</b></div>
   <p>Fractions and decimals are easier if you clear them first. Multiply <i>every</i> term by the LCD (or by a power of 10):</p>
   <div class="worked"><b>Solve x/3 + 1/2 = 5/6</b><br>Multiply everything by 6:<br>2x + 3 = 5<br>2x = 2, so x = <b>1</b></div>
   <p>For word problems, use this routine: (1) name the unknown with a letter, (2) write what the words say, (3) solve, (4) answer in a sentence with units, (5) check that the answer is sensible.</p>`,
   levelup:"'Let x be…' is not a formality — it is the most important line in the solution. Writing 'let m = minutes of practice' keeps you from solving for the wrong quantity."}
 ],
 tools:["balance"],
 sims:[
  {title:"PhET: Equality Explorer", src:"https://phet.colorado.edu/sims/html/equality-explorer/latest/equality-explorer_en.html",
   how:"An actual balance scale for equations. Add and remove the same weight from both sides and watch it stay level — then try removing from one side only and see it tip."},
  {title:"PhET: Expression Exchange", src:"https://phet.colorado.edu/sims/html/expression-exchange/latest/expression-exchange_en.html",
   how:"Drag coin tiles together to build and collect like terms. Try: build 3x + 2x and see it become 5x, then try to combine x with x&sup2; and watch why it refuses."}
 ],
 practice:[
  {q:"Simplify: <b>5(2x − 3) − 4x</b>", hint:"Distribute the 5 to both terms inside the parentheses before combining.",
   steps:["Distribute: 5 × 2x = 10x and 5 × (−3) = −15.","Now the expression is 10x − 15 − 4x.","Combine like terms: 10x − 4x = 6x.","Answer: <b>6x − 15</b>."], ans:"6x − 15"},
  {q:"Evaluate <b>3x&sup2; − 2y</b> when <b>x = −4</b> and <b>y = 5</b>.", hint:"Substitute with parentheses so the negative is squared correctly.",
   steps:["Substitute: 3(−4)&sup2; − 2(5).","Exponent first: (−4)&sup2; = 16.","3(16) = 48 and 2(5) = 10.","48 − 10 = <b>38</b>."], ans:"38"},
  {q:"Solve: <b>4x − 9 = 23</b>", hint:"Undo the subtraction first, then the multiplication.",
   steps:["Add 9 to both sides: 4x = 32.","Divide both sides by 4: x = <b>8</b>.","Check: 4(8) − 9 = 32 − 9 = 23 ✓"], ans:"x = 8"},
  {q:"Solve: <b>3(x + 4) = 5x − 2</b>", hint:"Distribute first, then gather the x terms on the side that keeps them positive.",
   steps:["Distribute: 3x + 12 = 5x − 2.","Subtract 3x from both sides: 12 = 2x − 2.","Add 2: 14 = 2x.","Divide by 2: x = <b>7</b>. Check: 3(11) = 33 and 5(7) − 2 = 33 ✓"], ans:"x = 7"},
  {q:"Solve: <b>x/4 − 3 = 2</b>", hint:"Undo the subtraction before you undo the division.",
   steps:["Add 3 to both sides: x/4 = 5.","Multiply both sides by 4: x = <b>20</b>.","Check: 20/4 − 3 = 5 − 3 = 2 ✓"], ans:"x = 20"},
  {q:"Solve: <b>0.4x + 1.2 = 3.6</b>", hint:"You can clear the decimals by multiplying every term by 10.",
   steps:["Multiply everything by 10: 4x + 12 = 36.","Subtract 12: 4x = 24.","Divide by 4: x = <b>6</b>."], ans:"x = 6"},
  {q:"Maya has <b>$45</b> and earns <b>$12</b> for each lawn she mows. How many lawns must she mow to have <b>$153</b>?", hint:"Write an equation: starting amount plus 12 per lawn equals the total.",
   steps:["Let n = the number of lawns.","12n + 45 = 153.","Subtract 45: 12n = 108.","Divide by 12: n = <b>9 lawns</b>."], ans:"9 lawns"},
  {q:"The perimeter of a rectangle is <b>54 cm</b>. Its length is <b>3 cm more than twice</b> its width. Find both dimensions.", hint:"Let w be the width, write the length in terms of w, then use P = 2(l + w).",
   steps:["Let w = width, so length = 2w + 3.","P = 2(l + w) gives 2(2w + 3 + w) = 54.","Simplify inside: 2(3w + 3) = 54, so 6w + 6 = 54.","6w = 48, so w = 8. Then length = 2(8) + 3 = 19.","<b>Width 8 cm, length 19 cm</b> — check: 2(19 + 8) = 54 ✓"], ans:"Width 8 cm, length 19 cm"}
 ]
},

"4": {
 sym:"x&#8319;", name:"Exponents &amp; Roots", hex:"#7A4FC0", dates:"October 24 – November 6",
 tagline:"Repeated multiplication, its rules, and how to undo it",
 blurb:"Exponents are shorthand for repeated multiplication, and the rules for combining them all come from that one idea. Roots undo them — and scientific notation puts them to work on very big and very small numbers.",
 parent:[
  "Read and evaluate expressions with exponents, including negative bases.",
  "Use the product, quotient and power rules to simplify expressions.",
  "Understand the zero exponent and negative exponents.",
  "Write numbers in scientific notation and back again.",
  "Find square roots, cube roots and higher roots, and estimate roots that are not exact."
 ],
 vocab:["base","exponent","power","product rule","quotient rule","power rule","zero exponent","negative exponent","scientific notation","square root","cube root","perfect square","radical"],
 sections:[
  {h:"What an exponent really means", body:`
   <p><span class="formula">5&sup3;</span> means 5 × 5 × 5 = 125. The <b>base</b> is the number being multiplied and the <b>exponent</b> counts how many copies.</p>
   <p>Sign traps to watch for:</p>
   <ul>
    <li>(−3)&sup2; = (−3)(−3) = <b>9</b> — the parentheses put the negative in the base.</li>
    <li>−3&sup2; = −(3 × 3) = <b>−9</b> — no parentheses, so only the 3 is squared.</li>
    <li>A negative base with an <b>even</b> exponent is positive; with an <b>odd</b> exponent it stays negative.</li>
   </ul>
   <p>Two special powers earn names: <b>squared</b> (exponent 2, the area of a square) and <b>cubed</b> (exponent 3, the volume of a cube). Those names are not decoration — they tell you what the operation does geometrically.</p>`,
   levelup:"Perfect squares to memorise through 15&sup2; = 225 and perfect cubes through 5&sup3; = 125. Recognising them instantly makes simplifying radicals in Algebra 1 far quicker."},
  {h:"The rules, and where they come from", body:`
   <table>
    <tr><th>Rule</th><th>Formula</th><th>Why</th></tr>
    <tr><td>Product</td><td>x<sup>a</sup> · x<sup>b</sup> = x<sup>a+b</sup></td><td>x&sup2;·x&sup3; = (xx)(xxx) — five x's</td></tr>
    <tr><td>Quotient</td><td>x<sup>a</sup> &divide; x<sup>b</sup> = x<sup>a−b</sup></td><td>the shared factors cancel</td></tr>
    <tr><td>Power of a power</td><td>(x<sup>a</sup>)<sup>b</sup> = x<sup>ab</sup></td><td>(x&sup2;)&sup3; = x&sup2;·x&sup2;·x&sup2;</td></tr>
    <tr><td>Power of a product</td><td>(xy)<sup>a</sup> = x<sup>a</sup>y<sup>a</sup></td><td>each factor gets the exponent</td></tr>
    <tr><td>Zero exponent</td><td>x&#8304; = 1 (x &ne; 0)</td><td>x&sup3; &divide; x&sup3; = 1 and also x&#8304;</td></tr>
    <tr><td>Negative exponent</td><td>x<sup>−n</sup> = 1/x<sup>n</sup></td><td>keeps the quotient rule working</td></tr>
   </table>
   <p>The most common mistake: <b>adding</b> exponents when multiplying but accidentally multiplying them, or vice versa. When in doubt, expand a small case and count.</p>
   <div class="worked">(3n&sup2;)&sup3;<br>= 3&sup3; · (n&sup2;)&sup3; &nbsp; <i>(each factor gets the power)</i><br>= 27n&#8310;</div>
   <p>A negative exponent never makes a value negative — it flips it. 2<sup>−3</sup> = 1/8, a small positive number.</p>`,
   levelup:"Fractional exponents come next: x<sup>1/2</sup> is another way to write &radic;x, because x<sup>1/2</sup> · x<sup>1/2</sup> = x&#185; by the product rule."},
  {h:"Scientific notation", body:`
   <p>Scientific notation writes a number as <span class="formula">a × 10<sup>n</sup></span>, where <b>a is at least 1 and less than 10</b>, and n is an integer.</p>
   <ul>
    <li>Large numbers get a <b>positive</b> exponent: 45,600 = 4.56 × 10&#8308;</li>
    <li>Small numbers get a <b>negative</b> exponent: 0.0032 = 3.2 × 10<sup>−3</sup></li>
   </ul>
   <p>The exponent counts how many places the decimal point hops. Going back to standard form, a positive exponent moves the point right, a negative one moves it left.</p>
   <div class="worked">0.000089<br>Hop the point right 5 places → 8.9<br>= <b>8.9 × 10<sup>−5</sup></b></div>
   <p>To compare numbers in scientific notation, look at the exponents first; only if they tie do you compare the leading numbers.</p>`,
   levelup:"Scientists use it constantly: a light-year is about 9.46 × 10&#185;&#8309; m, and a hydrogen atom is roughly 1 × 10<sup>−10</sup> m wide. Writing those out in full would waste a whole line."},
  {h:"Roots", body:`
   <p>A <b>square root</b> undoes squaring: &radic;49 = 7 because 7&sup2; = 49. A <b>cube root</b> undoes cubing: &#8731;64 = 4 because 4&sup3; = 64.</p>
   <p>Numbers whose roots come out whole are called <b>perfect squares</b> (1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144…) and <b>perfect cubes</b> (1, 8, 27, 64, 125…).</p>
   <p>When a root is not exact, trap it between the two nearest perfect squares to estimate:</p>
   <div class="worked">&radic;72<br>64 &lt; 72 &lt; 81<br>so 8 &lt; &radic;72 &lt; 9<br>72 is nearer 64 → about <b>8.5</b></div>
   <p>Roots also read backwards out of geometry: if a square has area 81 cm&sup2;, its side is &radic;81 = 9 cm; if a cube has volume 64 cm&sup3;, its edge is &#8731;64 = 4 cm.</p>`,
   levelup:"Prime factorisation simplifies radicals: &radic;72 = &radic;(36 × 2) = 6&radic;2. You will use that constantly in Algebra 1 and geometry."}
 ],
 tools:["exponents"],
 sims:[
  {title:"PhET: Build an Atom (powers of ten in context)", src:"https://phet.colorado.edu/sims/html/build-an-atom/latest/build-an-atom_en.html",
   how:"Not a maths sim, but a good reason for scientific notation: the particles you are counting here come in quantities like 6 × 10&sup2;&sup3;. Try writing a few of the masses shown in scientific notation."},
  {title:"PhET: Arithmetic (factor game)", src:"https://phet.colorado.edu/sims/html/arithmetic/latest/arithmetic_en.html",
   how:"Use the Factor mode to build speed at recognising perfect squares — the fastest route to confident work with roots."}
 ],
 practice:[
  {q:"Simplify: <b>(2x&sup3;y)&sup2; · 3x&#8308;</b>", hint:"Apply the outer power to every factor first, then use the product rule.",
   steps:["(2x&sup3;y)&sup2; = 2&sup2; · x&#8310; · y&sup2; = 4x&#8310;y&sup2;.","Now multiply: 4x&#8310;y&sup2; · 3x&#8308;.","Multiply coefficients: 4 × 3 = 12. Add exponents on x: 6 + 4 = 10.","Answer: <b>12x&#185;&#8304;y&sup2;</b>."], ans:"12x¹⁰y²"},
  {q:"Simplify: <b>15a&#8309;b&sup3; &divide; 5a&sup2;b&sup3;</b>", hint:"Divide the coefficients and subtract exponents for each letter separately.",
   steps:["Coefficients: 15 &divide; 5 = 3.","a: 5 − 2 = 3, giving a&sup3;.","b: 3 − 3 = 0, and b&#8304; = 1.","Answer: <b>3a&sup3;</b>."], ans:"3a³"},
  {q:"Write <b>4<sup>−3</sup></b> with a positive exponent and evaluate it.", hint:"A negative exponent means reciprocal, not negative.",
   steps:["4<sup>−3</sup> = 1/4&sup3;.","4&sup3; = 64.","Answer: <b>1/64</b> — a small positive number."], ans:"1/64"},
  {q:"Evaluate: <b>3&sup2; + 2&sup3; − 5&#8304;</b>", hint:"Work out each power separately, and remember what anything to the zero power equals.",
   steps:["3&sup2; = 9.","2&sup3; = 8.","5&#8304; = 1.","9 + 8 − 1 = <b>16</b>."], ans:"16"},
  {q:"Write <b>0.00047</b> in scientific notation, and <b>6.3 × 10&#8309;</b> in standard form.", hint:"Count the decimal hops; small numbers take a negative exponent.",
   steps:["0.00047: hop the point 4 places right to reach 4.7 → <b>4.7 × 10<sup>−4</sup></b>.","6.3 × 10&#8309;: hop the point 5 places right.","= <b>630,000</b>."], ans:"4.7 × 10⁻⁴ and 630,000"},
  {q:"Which is larger: <b>3.2 × 10&#8310;</b> or <b>9.8 × 10&#8309;</b>?", hint:"Compare exponents before you compare the leading numbers.",
   steps:["The exponents are 6 and 5, so the first number is ten times bigger in scale.","3.2 × 10&#8310; = 3,200,000 and 9.8 × 10&#8309; = 980,000.","<b>3.2 × 10&#8310;</b> is larger."], ans:"3.2 × 10⁶"},
  {q:"Estimate <b>&radic;55</b> to the nearest tenth.", hint:"Find the perfect squares either side, then test a decimal in between.",
   steps:["49 &lt; 55 &lt; 64, so &radic;55 is between 7 and 8.","Try 7.4: 7.4&sup2; = 54.76 — just under.","Try 7.5: 7.5&sup2; = 56.25 — too big.","So &radic;55 ≈ <b>7.4</b>."], ans:"≈ 7.4"},
  {q:"A cube has a volume of <b>216 cm&sup3;</b>. Find its edge length and then its surface area.", hint:"Undo the cube first, then use the six faces of a cube.",
   steps:["Edge = &#8731;216. Since 6&sup3; = 216, the edge is 6 cm.","Each face is 6 × 6 = 36 cm&sup2;.","A cube has 6 faces: 6 × 36 = <b>216 cm&sup2;</b>.","(A coincidence worth noticing — for a 6 cm cube the volume and surface area numbers match.)"], ans:"Edge 6 cm, surface area 216 cm²"}
 ]
},

"5": {
 sym:"%", name:"Ratios, Proportions &amp; Percents", hex:"#D9682F", dates:"November 7 – December 20",
 tagline:"The maths you will actually use at the shops",
 blurb:"Ratios compare, rates measure per-unit, proportions scale, and percents put everything out of 100. This unit is the most useful maths of the year outside the classroom.",
 parent:[
  "Write and simplify ratios, and find unit rates to compare prices.",
  "Set up and solve proportions, including scale drawings and similar figures.",
  "Convert freely between fractions, decimals and percents.",
  "Find a percent of a number, what percent one number is of another, and the original whole.",
  "Apply percents to sales tax, discounts, tips, percent change and simple interest."
 ],
 vocab:["ratio","rate","unit rate","proportion","cross multiply","scale factor","percent","percent proportion","discount","sales tax","percent increase","percent decrease","simple interest"],
 sections:[
  {h:"Ratios and rates", body:`
   <p>A <b>ratio</b> compares two quantities and can be written three ways: 3 to 4, 3 : 4, or 3/4. Ratios simplify exactly like fractions — divide both parts by the GCF.</p>
   <p>A <b>rate</b> compares quantities with <i>different</i> units (kilometres per hour, dollars per kilogram). A <b>unit rate</b> has a denominator of 1, which is what makes comparison shopping possible:</p>
   <div class="worked">6 rolls for $4.20 → 4.20 &divide; 6 = <b>$0.70 each</b><br>10 rolls for $6.50 → 6.50 &divide; 10 = <b>$0.65 each</b><br>The 10-pack is the better buy.</div>
   <p>Watch the order — a ratio of boys to girls is not the same as girls to boys. And be careful with part-to-part versus part-to-whole: in a class with 10 boys and 15 girls, boys to girls is 2 : 3, but boys to <i>students</i> is 10 : 25 = 2 : 5.</p>`,
   levelup:"Unit rates are the everyday version of slope. When you graph cost against quantity, the unit price is the steepness of the line — the same idea you meet in Unit 7."},
  {h:"Proportions", body:`
   <p>A <b>proportion</b> says two ratios are equal: <span class="formula">a/b = c/d</span>. Solve one by <b>cross multiplying</b>: ad = bc.</p>
   <div class="worked"><b>4 pens cost $6. What do 10 pens cost?</b><br>4/6 = 10/x<br>4x = 60<br>x = <b>$15</b></div>
   <p>The most important step is setting it up so the units match across the top and across the bottom. Both of these are correct as long as you keep the labels consistent:</p>
   <ul>
    <li>pens/dollars = pens/dollars</li>
    <li>pens/pens = dollars/dollars</li>
   </ul>
   <p>Proportions power scale drawings and maps ("1 cm : 25 km"), model building, recipe scaling, and — in Unit 8 — similar triangles.</p>`,
   levelup:"Proportional relationships always graph as a straight line through the origin, because zero of something costs zero. If a graph misses the origin, the relationship is linear but not proportional."},
  {h:"Percent: three questions, one tool", body:`
   <p>Percent means "per hundred", so 45% = 45/100 = 0.45. Converting is just moving the decimal two places:</p>
   <table>
    <tr><th>From</th><th>To</th><th>Do this</th><th>Example</th></tr>
    <tr><td>Percent</td><td>Decimal</td><td>&divide; 100 (2 places left)</td><td>8% → 0.08</td></tr>
    <tr><td>Decimal</td><td>Percent</td><td>× 100 (2 places right)</td><td>1.4 → 140%</td></tr>
    <tr><td>Fraction</td><td>Percent</td><td>divide, then × 100</td><td>3/8 → 0.375 → 37.5%</td></tr>
    <tr><td>Percent</td><td>Fraction</td><td>put over 100 and simplify</td><td>60% → 60/100 → 3/5</td></tr>
   </table>
   <p>Every percent question is one of three, and the <b>percent proportion</b> answers all of them:</p>
   <p style="text-align:center"><span class="formula">part / whole = percent / 100</span></p>
   <table>
    <tr><th>Question</th><th>Missing piece</th><th>Example</th></tr>
    <tr><td>What is 20% of 60?</td><td>the part</td><td>0.20 × 60 = 12</td></tr>
    <tr><td>18 is what percent of 90?</td><td>the percent</td><td>18/90 = 0.2 = 20%</td></tr>
    <tr><td>24 is 30% of what?</td><td>the whole</td><td>24 &divide; 0.30 = 80</td></tr>
   </table>
   <p>The word <b>"of"</b> almost always marks the whole, and <b>"is"</b> marks the part.</p>`,
   levelup:"Percents above 100 are perfectly normal — they just mean more than the whole. A price rising from $20 to $50 is 250% of the original, which is a 150% increase."},
  {h:"Percents in real life", body:`
   <table>
    <tr><th>Situation</th><th>Method</th><th>Example</th></tr>
    <tr><td>Sales tax</td><td>total = price × (1 + rate)</td><td>$40 at 7% → 40 × 1.07 = $42.80</td></tr>
    <tr><td>Discount</td><td>sale price = price × (1 − rate)</td><td>$60 at 25% off → 60 × 0.75 = $45</td></tr>
    <tr><td>Tip</td><td>tip = bill × rate</td><td>$48 at 15% → $7.20</td></tr>
    <tr><td>Percent change</td><td>change &divide; original × 100</td><td>$20 → $25 is 5/20 = 25% increase</td></tr>
    <tr><td>Simple interest</td><td>I = Prt</td><td>$500 at 4% for 3 yrs → $60</td></tr>
   </table>
   <p>Two traps worth learning now:</p>
   <ul>
    <li>Percent change is always measured against the <b>original</b> amount, not the new one.</li>
    <li>Stacked percents do not add. A 20% discount followed by another 10% off is <i>not</i> 30% off — it is 0.8 × 0.9 = 0.72, so 28% off.</li>
   </ul>`,
   levelup:"The 'rule of 72' estimates compound growth: money at 6% interest roughly doubles in 72 &divide; 6 = 12 years. Bankers use it in their heads."}
 ],
 tools:["percent"],
 sims:[
  {title:"PhET: Unit Rates", src:"https://phet.colorado.edu/sims/html/unit-rates/latest/unit-rates_en.html",
   how:"Shop for produce and race cars while the double number line updates. Try: buy 3 apples, then use the line to predict the cost of 7 before you check."},
  {title:"PhET: Proportion Playground", src:"https://phet.colorado.edu/sims/html/proportion-playground/latest/proportion-playground_en.html",
   how:"Mix paint and balance necklaces to feel what 'the same ratio' means. Try to find three different mixes that give exactly the same shade."}
 ],
 practice:[
  {q:"A 750 mL bottle of juice costs <b>$3.00</b> and a 1.25 L bottle costs <b>$4.75</b>. Which is the better value?", hint:"Get both into the same unit, then find the price per litre.",
   steps:["750 mL = 0.75 L, so $3.00 &divide; 0.75 = $4.00 per litre.","$4.75 &divide; 1.25 = $3.80 per litre.","The <b>1.25 L bottle</b> is the better value by 20 cents per litre."], ans:"The 1.25 L bottle"},
  {q:"A map uses a scale of <b>2 cm : 15 km</b>. Two towns are <b>7 cm</b> apart on the map. How far apart are they really?", hint:"Set up a proportion with map centimetres on top and real kilometres underneath.",
   steps:["2/15 = 7/x.","Cross multiply: 2x = 105.","x = <b>52.5 km</b>."], ans:"52.5 km"},
  {q:"Convert <b>7/8</b> to a decimal and a percent.", hint:"The fraction bar means divide.",
   steps:["7 &divide; 8 = 0.875.","Multiply by 100 for the percent: 87.5%.","So 7/8 = <b>0.875 = 87.5%</b>."], ans:"0.875 = 87.5%"},
  {q:"<b>36</b> is what percent of <b>240</b>?", hint:"Use part/whole = percent/100. Which number follows 'of'?",
   steps:["The whole is 240 (it follows 'of') and the part is 36.","36/240 = 0.15.","× 100 = <b>15%</b>."], ans:"15%"},
  {q:"After a <b>20% discount</b>, a jacket costs <b>$68</b>. What was the original price?", hint:"$68 is not 20% of anything — it is 80% of the original.",
   steps:["Paying 100% − 20% = 80% of the original.","0.80x = 68.","x = 68 &divide; 0.80 = <b>$85</b>.","Check: 20% of 85 is 17, and 85 − 17 = 68 ✓"], ans:"$85"},
  {q:"A meal costs <b>$62</b>. Add <b>7% tax</b> and then a <b>15% tip on the pre-tax amount</b>. What is the total?", hint:"Work out the two additions separately and add them to the bill.",
   steps:["Tax: 0.07 × 62 = $4.34.","Tip: 0.15 × 62 = $9.30.","Total: 62 + 4.34 + 9.30 = <b>$75.64</b>."], ans:"$75.64"},
  {q:"A town's population grows from <b>4,500</b> to <b>5,400</b>. Find the percent increase.", hint:"Percent change is always compared to the original amount.",
   steps:["Change = 5,400 − 4,500 = 900.","900 &divide; 4,500 = 0.2.","× 100 = <b>20% increase</b>."], ans:"20% increase"},
  {q:"Two similar triangles have a scale factor of <b>3 : 5</b>. The smaller triangle has a perimeter of <b>24 cm</b>. Find the larger perimeter.", hint:"Every length scales by the same factor, so perimeters are in the same ratio as the sides.",
   steps:["Set up 3/5 = 24/x.","Cross multiply: 3x = 120.","x = <b>40 cm</b>."], ans:"40 cm"}
 ]
},


"6": {
 sym:"&#8730;", name:"Pre-Comp Review", hex:"#5A648A", dates:"January 13 – January 31", review:true,
 pool:["1","2","3","4","5"],
 tagline:"Everything from Units 1–5, plus how to take a test well",
 blurb:"No new content is taught during review week. This unit is about pulling Units 1–5 back into working memory and practising the exam skills that turn what you know into marks you actually earn.",
 parent:[
  "Review number sense, fractions, expressions and equations, exponents and roots, and percents together.",
  "Learn test-taking strategies: eliminating answer choices, estimating, and checking for reasonableness.",
  "Recognise the mistakes students make most often, and build habits that avoid them.",
  "Practise under timed conditions so the real exam feels familiar."
 ],
 vocab:["review","estimation","reasonableness","elimination","showing work","checking","time management"],
 sections:[
  {h:"How to revise five units at once", body:`
   <p>Re-reading notes feels productive and is nearly useless. What actually works is <b>retrieval</b> — closing the book and making yourself produce the answer.</p>
   <ol>
    <li><b>Sort by confidence, not by chapter.</b> Work through the unit pages and mark every topic green (I could teach it), yellow (I need a reminder) or red (I am lost). Spend your time on red and yellow only.</li>
    <li><b>Do a mixed set every day.</b> Ten questions drawn from different units is worth more than fifty from one, because the exam will not tell you which method to use.</li>
    <li><b>Redo mistakes, not just corrections.</b> Cover the worked solution, redo the problem from scratch, and only then compare.</li>
    <li><b>Make a one-page formula sheet from memory</b>, then check it against the Reference page here. The gaps you find are exactly what to study.</li>
   </ol>
   <p>Spread this over the whole review week. Four 30-minute sessions beat one two-hour panic, every time.</p>`,
   levelup:"Try teaching a topic out loud to a parent or sibling. If you cannot explain why 'keep–change–flip' works, you have found a red topic, however familiar it looked."},
  {h:"Strategies for the exam itself", body:`
   <p><b>Before you calculate:</b></p>
   <ul>
    <li><b>Estimate first.</b> If 19.7 × 4.9 should be about 100, an answer of 9.65 is a decimal-point slip.</li>
    <li><b>Eliminate impossible choices.</b> A negative times a negative cannot be negative. A discount cannot cost more than the original. A triangle's third angle cannot be more than 180°.</li>
    <li><b>Check the units.</b> If the question asks for centimetres and every option is in metres, you have misread something.</li>
   </ul>
   <p><b>While you work:</b></p>
   <ul>
    <li>Answer every question you find easy first, then loop back. Marks are marks, and easy ones left blank are the most expensive mistake on any exam.</li>
    <li>Show your steps in a column, one operation per line. It is faster to find an error in a column than in a paragraph.</li>
    <li>Underline what the question actually asks. Many lost marks come from solving for x when the question wanted the perimeter.</li>
  </ul>
   <p><b>Before you hand it in:</b> substitute your answers back into equations, re-check every negative sign, and confirm you answered the question that was asked.</p>`,
   levelup:"Time yourself in practice at about 80% of the real limit. Working slightly faster than you will need on the day converts exam nerves into spare minutes."},
  {h:"The mistakes that cost the most marks", body:`
   <table>
    <tr><th>Mistake</th><th>Fix</th></tr>
    <tr><td>−3&sup2; treated as (−3)&sup2;</td><td>Ask what the exponent is attached to — only what is inside the parentheses.</td></tr>
    <tr><td>Doing × before &divide; automatically</td><td>They share a rank; go left to right.</td></tr>
    <tr><td>Adding fractions without a common denominator</td><td>You can only add pieces of the same size.</td></tr>
    <tr><td>Distributing to only the first term</td><td>3(x + 4) = 3x + 12, not 3x + 4.</td></tr>
    <tr><td>"6 less than n" written as 6 − n</td><td>Read it as "start with n, take 6 away": n − 6.</td></tr>
    <tr><td>Percent change measured against the new value</td><td>Always divide by the <i>original</i>.</td></tr>
    <tr><td>Forgetting to simplify the final fraction</td><td>Make simplifying the last line of every fraction problem.</td></tr>
    <tr><td>Losing the units</td><td>Write cm, cm&sup2; or cm&sup3; on every answer — geometry marks depend on it.</td></tr>
   </table>`,
   levelup:"Keep a running 'error log' in the back of your notebook: the problem, what you did, and what you should have done. Most students find their entire log is four or five repeating mistakes."}
 ],
 tools:[],
 sims:[],
 practice:[
  {q:"Evaluate: <b>−4 + 3(6 − 8)&sup2; &divide; 2</b>", hint:"Parentheses, then exponent, then multiply and divide left to right, then add.",
   steps:["Parentheses: 6 − 8 = −2.","Exponent: (−2)&sup2; = 4.","Left to right: 3 × 4 = 12, then 12 &divide; 2 = 6.","−4 + 6 = <b>2</b>."], ans:"2"},
  {q:"Simplify <b>2/3 + 1/4 &times; 8/5</b>.", hint:"Order of operations applies to fractions too — multiply before you add.",
   steps:["Multiply first: 1/4 × 8/5 = 8/20 = 2/5.","Now 2/3 + 2/5 with LCD 15.","= 10/15 + 6/15 = <b>16/15</b> (or 1 1/15)."], ans:"16/15"},
  {q:"Solve: <b>5(x − 2) = 3x + 8</b>", hint:"Distribute first, then collect the variables on one side.",
   steps:["Distribute: 5x − 10 = 3x + 8.","Subtract 3x: 2x − 10 = 8.","Add 10: 2x = 18.","x = <b>9</b>."], ans:"x = 9"},
  {q:"Simplify: <b>(3x&sup2;)&sup3; &divide; 9x&#8308;</b>", hint:"Apply the outer power to everything inside, then divide.",
   steps:["(3x&sup2;)&sup3; = 27x&#8310;.","27x&#8310; &divide; 9x&#8308;: divide coefficients 27 &divide; 9 = 3.","Subtract exponents: 6 − 4 = 2.","Answer: <b>3x&sup2;</b>."], ans:"3x²"},
  {q:"A shirt is marked <b>$45</b> and is <b>30% off</b>, with <b>7% tax</b> added to the sale price. What is the final cost?", hint:"Discount first, then tax on the reduced price.",
   steps:["Sale price: 45 × 0.70 = $31.50.","Tax: 31.50 × 0.07 = $2.205 ≈ $2.21.","Total: <b>$33.71</b>."], ans:"$33.71"},
  {q:"Without a calculator, decide whether <b>&radic;150</b> is closer to 12 or 13.", hint:"Square both candidates and see which lands nearer 150.",
   steps:["12&sup2; = 144, which is 6 away from 150.","13&sup2; = 169, which is 19 away.","So &radic;150 is closer to <b>12</b>."], ans:"Closer to 12"},
  {q:"Estimate first, then calculate: <b>4.02 × 24.9</b>", hint:"Round both numbers, multiply mentally, then do the exact work.",
   steps:["Estimate: 4 × 25 = 100.","Exact: 4.02 × 24.9 = 100.098.","The estimate confirms the answer is reasonable — a result like 10.0 or 1,000 would have signalled a place-value error."], ans:"≈ 100; exactly 100.098"},
  {q:"Multiple-choice strategy: <b>3/5 of a number is 45.</b> The options are 27, 45, 75 and 135. Which can you eliminate without calculating?", hint:"If you take a fraction less than 1 of a number and get 45, is the original bigger or smaller than 45?",
   steps:["3/5 is less than 1, so the result must be <i>smaller</i> than the original number.","That rules out 27 (too small) and 45 (equal).","Between 75 and 135, estimate: 3/5 of 75 = 45. ✓","Answer: <b>75</b>, found by elimination in seconds."], ans:"75"}
 ]
},

"7": {
 sym:"(x,y)", name:"Coordinate Plane &amp; Graphing", hex:"#1F7A4D", dates:"January 31 – February 28",
 tagline:"Plotting points, moving shapes and drawing lines",
 blurb:"The coordinate plane connects algebra to pictures. Once a pair of numbers becomes a point and an equation becomes a line, you can see what the algebra is doing.",
 parent:[
  "Plot and read points, and name the four quadrants.",
  "Perform translations, reflections and rotations, and recognise dilations.",
  "Find lines and points of symmetry.",
  "Graph linear equations and identify slope and y-intercept.",
  "Read a table of values and write the rule that produced it."
 ],
 vocab:["x-axis","y-axis","origin","ordered pair","quadrant","translation","reflection","rotation","dilation","rigid transformation","line of symmetry","slope","y-intercept","linear equation"],
 sections:[
  {h:"Reading and plotting points", body:`
   <p>The <b>coordinate plane</b> is built from two number lines: the horizontal <b>x-axis</b> and the vertical <b>y-axis</b>, crossing at the <b>origin</b> (0, 0).</p>
   <p>An <b>ordered pair</b> (x, y) is always horizontal first, then vertical — the same order as the alphabet. To plot (−3, 5): move 3 left, then 5 up.</p>
   <table>
    <tr><th>Quadrant</th><th>Signs</th><th>Example</th></tr>
    <tr><td>I (top right)</td><td>(+, +)</td><td>(3, 5)</td></tr>
    <tr><td>II (top left)</td><td>(−, +)</td><td>(−4, 2)</td></tr>
    <tr><td>III (bottom left)</td><td>(−, −)</td><td>(−6, −1)</td></tr>
    <tr><td>IV (bottom right)</td><td>(+, −)</td><td>(7, −3)</td></tr>
   </table>
   <p>Points <i>on</i> an axis belong to no quadrant. A zero x-coordinate puts the point on the y-axis; a zero y-coordinate puts it on the x-axis.</p>`,
   levelup:"Quadrants are numbered anticlockwise starting from the top right — the same direction angles are measured in trigonometry later on."},
  {h:"Transformations", body:`
   <p>A transformation moves a figure. Three of them are <b>rigid</b> — size and shape are preserved and the image is congruent to the original:</p>
   <table>
    <tr><th>Transformation</th><th>What happens</th><th>Rule</th></tr>
    <tr><td><b>Translation</b> (slide)</td><td>every point moves the same distance and direction</td><td>(x, y) → (x + a, y + b)</td></tr>
    <tr><td><b>Reflection</b> over x-axis</td><td>flips vertically</td><td>(x, y) → (x, −y)</td></tr>
    <tr><td><b>Reflection</b> over y-axis</td><td>flips horizontally</td><td>(x, y) → (−x, y)</td></tr>
    <tr><td><b>Rotation</b> 90° anticlockwise</td><td>turns about the origin</td><td>(x, y) → (−y, x)</td></tr>
    <tr><td><b>Rotation</b> 180°</td><td>turns halfway around</td><td>(x, y) → (−x, −y)</td></tr>
   </table>
   <p>The fourth, <b>dilation</b>, is not rigid — it resizes. Multiply both coordinates by the scale factor k. If k &gt; 1 the figure grows; if 0 &lt; k &lt; 1 it shrinks. The image is <i>similar</i> to the original, not congruent.</p>
   <p>A <b>composition</b> is two or more transformations in a row: reflect, then translate. Order matters — swapping the steps often lands the figure somewhere else.</p>
   <p>A figure has a <b>line of symmetry</b> if folding along that line makes the two halves match exactly. A square has 4, a rectangle has 2, a regular hexagon has 6, and a circle has infinitely many.</p>`,
   levelup:"Every rigid transformation preserves distance, so corresponding sides and angles stay equal. That is precisely why translations and reflections prove triangles congruent in geometry."},
  {h:"Graphing lines", body:`
   <p>A <b>linear equation</b> graphs as a straight line. In <b>slope-intercept form</b>:</p>
   <p style="text-align:center"><span class="formula">y = mx + b</span></p>
   <ul>
    <li><b>m</b> is the <b>slope</b> — the steepness, calculated as rise &divide; run, or (change in y) &divide; (change in x).</li>
    <li><b>b</b> is the <b>y-intercept</b> — where the line crosses the y-axis, at the point (0, b).</li>
   </ul>
   <p>To graph one quickly: plot (0, b) first, then use the slope as a set of directions. A slope of 3 means 3/1: up 3, right 1. A slope of −2/5 means down 2, right 5.</p>
   <div class="worked"><b>Graph y = 2x − 3</b><br>Start at (0, −3).<br>Slope 2 = up 2, right 1 → (1, −1).<br>Repeat → (2, 1). Join the points.</div>
   <table>
    <tr><th>Slope</th><th>The line…</th></tr>
    <tr><td>positive</td><td>rises left to right</td></tr>
    <tr><td>negative</td><td>falls left to right</td></tr>
    <tr><td>zero</td><td>is horizontal (y = a number)</td></tr>
    <tr><td>undefined</td><td>is vertical (x = a number)</td></tr>
   </table>
   <p>To check whether a point lies on a line, substitute both coordinates. If the equation stays true, the point is on the line.</p>`,
   levelup:"Slope is a rate of change in disguise. If a graph shows cost against hours worked, the slope is the hourly wage — the same unit rate from Unit 5."},
  {h:"From tables to rules", body:`
   <p>A table of values hides a rule. Find it by looking at how y changes each time x goes up by 1 — that constant change is the slope.</p>
   <div class="worked">x: 1, 2, 3, 4<br>y: 5, 8, 11, 14<br><br>y rises by 3 each step → slope 3<br>At x = 0 the value would be 2 → intercept 2<br><b>y = 3x + 2</b></div>
   <p>If the change is <i>not</i> constant, the relationship is not linear and the graph will curve.</p>
   <p>When a table has no constant difference but the ratio y/x is constant, you have a <b>proportional</b> relationship — a line through the origin, with equation y = kx.</p>`,
   levelup:"Test which model fits by plotting the points. If they form a straight line, use y = mx + b; if they curve upward faster and faster, you are heading toward the quadratics of Algebra 1."}
 ],
 tools:["plane"],
 sims:[
  {title:"PhET: Graphing Lines", src:"https://phet.colorado.edu/sims/html/graphing-lines/latest/graphing-lines_en.html",
   how:"Drag a line and watch its equation change, or type an equation and watch the line move. Try: keep b fixed and change m only — what stays the same?"},
  {title:"PhET: Graphing Slope-Intercept", src:"https://phet.colorado.edu/sims/html/graphing-slope-intercept/latest/graphing-slope-intercept_en.html",
   how:"Focused practice on rise over run. Play the built-in game and try to reach level 6 without hints."}

 practice:[
  {q:"Name the quadrant or axis for each: <b>(−5, 2), (0, −7), (4, 9), (3, −2)</b>", hint:"Check the sign of each coordinate; a zero means the point sits on an axis.",
   steps:["(−5, 2): negative x, positive y → <b>Quadrant II</b>.","(0, −7): x is zero → <b>on the y-axis</b>.","(4, 9): both positive → <b>Quadrant I</b>.","(3, −2): positive x, negative y → <b>Quadrant IV</b>."], ans:"II, on the y-axis, I, IV"},
  {q:"Triangle ABC has vertices A(1, 2), B(4, 2), C(4, 6). Translate it <b>3 left and 5 up</b>.", hint:"Left is negative on x; up is positive on y. Apply the same move to every vertex.",
   steps:["The rule is (x, y) → (x − 3, y + 5).","A(1, 2) → <b>(−2, 7)</b>.","B(4, 2) → <b>(1, 7)</b>.","C(4, 6) → <b>(1, 11)</b>.","The triangle keeps its size and shape — translation is rigid."], ans:"(−2, 7), (1, 7), (1, 11)"},
  {q:"Reflect <b>P(−6, 3)</b> over the x-axis, then over the y-axis. Where does it end up?", hint:"Do one reflection at a time and write down the intermediate point.",
   steps:["Over the x-axis: (x, y) → (x, −y), so P becomes (−6, −3).","Over the y-axis: (x, y) → (−x, y), so (−6, −3) becomes <b>(6, −3)</b>.","Notice: both reflections together gave the same result as a 180° rotation."], ans:"(6, −3)"},
  {q:"Rotate <b>Q(2, 5)</b> 90° anticlockwise about the origin, then describe how far it is from the origin.", hint:"Use (x, y) → (−y, x). Rotations do not change distance.",
   steps:["Apply the rule: Q(2, 5) → <b>(−5, 2)</b>.","Distance from the origin is unchanged because rotation is rigid.","By the Pythagorean theorem it is &radic;(2&sup2; + 5&sup2;) = &radic;29 ≈ 5.4 units — for both points."], ans:"(−5, 2), still √29 ≈ 5.4 units out"},
  {q:"Find the slope of the line through <b>(−2, 1)</b> and <b>(4, 10)</b>.", hint:"Slope is change in y over change in x — keep the points in the same order on top and bottom.",
   steps:["Change in y: 10 − 1 = 9.","Change in x: 4 − (−2) = 6.","Slope = 9/6 = <b>3/2</b>.","Positive slope, so the line rises left to right."], ans:"3/2"},
  {q:"Graph <b>y = −2x + 6</b>. Give the y-intercept and one more point.", hint:"Start at the intercept, then use the slope as directions.",
   steps:["b = 6, so the line crosses the y-axis at <b>(0, 6)</b>.","Slope −2 means down 2, right 1.","From (0, 6) that gives <b>(1, 4)</b>, and again (2, 2).","Join those points for the line."], ans:"y-intercept (0, 6); another point (1, 4)"},
  {q:"Is the point <b>(3, 11)</b> on the line <b>y = 4x − 1</b>?", hint:"Substitute both coordinates and see whether the equation stays true.",
   steps:["Substitute x = 3: y = 4(3) − 1 = 11.","The equation gives exactly 11, matching the point's y-coordinate.","<b>Yes</b>, the point is on the line."], ans:"Yes"},
  {q:"A table shows x: 0, 1, 2, 3 and y: 9, 6, 3, 0. Write the rule and describe the graph.", hint:"Find the change in y for each step in x, and read the value at x = 0.",
   steps:["y drops by 3 each time x rises by 1, so the slope is −3.","At x = 0 the value is 9, so b = 9.","Rule: <b>y = −3x + 9</b>.","The graph is a straight line falling left to right, crossing the y-axis at (0, 9) and the x-axis at (3, 0)."], ans:"y = −3x + 9"}
 ]
},

"8": {
 sym:"&#9651;", name:"Angles, Triangles &amp; Polygons", hex:"#B03A48", dates:"March 3 – March 21",
 tagline:"Angle rules, the Pythagorean theorem, and naming every shape",
 blurb:"Geometry rewards precise vocabulary. Learn what each name guarantees, and most problems become a matter of applying two or three angle facts in the right order.",
 parent:[
  "Classify angles and use complementary, supplementary and vertical angle relationships.",
  "Find angles formed when parallel lines are cut by a transversal.",
  "Classify triangles by sides and by angles, and use the angle sum property.",
  "Use the Pythagorean theorem to find a missing side of a right triangle.",
  "Work with congruent and similar figures, including finding missing sides with proportions.",
  "Identify quadrilaterals and polygons and calculate interior angles."
 ],
 vocab:["acute","obtuse","right angle","straight angle","complementary","supplementary","vertical angles","transversal","corresponding angles","alternate interior angles","equilateral","isosceles","scalene","hypotenuse","congruent","similar","parallelogram","trapezoid","regular polygon","radius","chord"],
 sections:[
  {h:"Lines, angles and the rules that come free", body:`
   <table>
    <tr><th>Term</th><th>Meaning</th></tr>
    <tr><td>Line</td><td>continues forever in both directions</td></tr>
    <tr><td>Line segment</td><td>has two endpoints</td></tr>
    <tr><td>Ray</td><td>one endpoint, continues forever one way</td></tr>
    <tr><td>Acute angle</td><td>less than 90°</td></tr>
    <tr><td>Right angle</td><td>exactly 90°</td></tr>
    <tr><td>Obtuse angle</td><td>between 90° and 180°</td></tr>
    <tr><td>Straight angle</td><td>exactly 180°</td></tr>
   </table>
   <p>Two relationships appear in almost every problem:</p>
   <ul>
    <li><b>Complementary</b> angles add to 90°. <i>(C comes before S, and 90 before 180.)</i></li>
    <li><b>Supplementary</b> angles add to 180°.</li>
   </ul>
   <p>When two lines cross, the angles opposite each other are <b>vertical angles</b> and are always congruent, while angles next to each other form a straight line and are supplementary.</p>
   <div class="worked">If one angle at a crossing is 68°:<br>its vertical partner = <b>68°</b><br>each neighbour = 180 − 68 = <b>112°</b></div>`,
   levelup:"Angles can also be measured in radians, where a full turn is 2&pi; instead of 360°. Degrees come from Babylonian astronomy — 360 is close to the days in a year and divides beautifully."},
  {h:"Parallel lines and a transversal", body:`
   <p>When a <b>transversal</b> cuts two parallel lines, eight angles appear — but there are really only two different sizes, and they are supplementary to each other.</p>
   <table>
    <tr><th>Pair</th><th>Where they sit</th><th>Relationship</th></tr>
    <tr><td>Corresponding</td><td>same position at each intersection</td><td>congruent</td></tr>
    <tr><td>Alternate interior</td><td>inside, opposite sides of the transversal</td><td>congruent</td></tr>
    <tr><td>Alternate exterior</td><td>outside, opposite sides</td><td>congruent</td></tr>
    <tr><td>Co-interior (same-side interior)</td><td>inside, same side</td><td>supplementary</td></tr>
   </table>
   <p>The practical shortcut: find one angle, and every other angle is either the same as it or 180° minus it. Sketch the diagram and fill them all in before answering — it usually takes fifteen seconds and prevents most errors.</p>`,
   levelup:"These rules only hold when the lines really are parallel. Turned around, they become tests: if alternate interior angles are equal, the lines <i>must</i> be parallel."},
  {h:"Triangles", body:`
   <p><b>By sides:</b> equilateral (all three equal), isosceles (exactly two equal), scalene (none equal).<br>
      <b>By angles:</b> acute (all under 90°), right (one 90°), obtuse (one over 90°).</p>
   <p>Two facts do most of the work:</p>
   <ul>
    <li><b>Angle sum:</b> the three angles of any triangle add to <b>180°</b>. So a triangle can never have two right angles.</li>
    <li><b>Equilateral means equiangular:</b> each angle is 60°. In an isosceles triangle, the two angles opposite the equal sides are equal.</li>
   </ul>
   <p>For right triangles, the <b>Pythagorean theorem</b> connects the sides:</p>
   <p style="text-align:center"><span class="formula">a&sup2; + b&sup2; = c&sup2;</span> &nbsp; where c is the hypotenuse (opposite the right angle, always the longest side)</p>
   <div class="worked">Legs 5 and 12:<br>5&sup2; + 12&sup2; = 25 + 144 = 169<br>c = &radic;169 = <b>13</b></div>
   <p>Worth memorising, because they appear constantly: the triples <b>3-4-5</b>, <b>5-12-13</b>, <b>8-15-17</b> and <b>7-24-25</b>, along with all their multiples (6-8-10, 9-12-15…).</p>`,
   levelup:"The theorem also works backwards. If a&sup2; + b&sup2; = c&sup2; then the triangle must be right-angled — which is how builders check that a corner is square using a 3-4-5 triangle."},
  {h:"Congruence, similarity and polygons", body:`
   <p><b>Congruent</b> figures have the same size <i>and</i> shape — corresponding sides and angles are equal. <b>Similar</b> figures have the same shape only: angles are equal, and sides are proportional by a <b>scale factor</b>.</p>
   <div class="worked">Similar triangles, sides 3-4-5 and 9-?-?<br>Scale factor = 9 &divide; 3 = 3<br>Other sides: 4 × 3 = <b>12</b> and 5 × 3 = <b>15</b></div>
   <p><b>Quadrilaterals</b> form a family, each name guaranteeing more than the last:</p>
   <table>
    <tr><th>Name</th><th>What it guarantees</th></tr>
    <tr><td>Trapezoid</td><td>exactly one pair of parallel sides</td></tr>
    <tr><td>Parallelogram</td><td>both pairs of opposite sides parallel and equal; opposite angles equal; consecutive angles supplementary</td></tr>
    <tr><td>Rectangle</td><td>a parallelogram with four right angles</td></tr>
    <tr><td>Rhombus</td><td>a parallelogram with four equal sides</td></tr>
    <tr><td>Square</td><td>both a rectangle and a rhombus</td></tr>
   </table>
   <p>For any polygon with n sides, the interior angles add to <span class="formula">(n − 2) × 180°</span>. In a <b>regular</b> polygon (all sides and angles equal), divide by n to get each angle.</p>
   <div class="worked">Regular hexagon: (6 − 2) × 180 = 720°<br>Each angle: 720 &divide; 6 = <b>120°</b></div>
   <p>In circles: the <b>radius</b> reaches from centre to edge, the <b>diameter</b> crosses through the centre and is twice the radius, a <b>chord</b> joins any two points on the circle, and an <b>arc</b> is a piece of the edge itself.</p>`,
   levelup:"The (n − 2) formula works because any polygon can be split into triangles from a single vertex — an n-gon gives exactly n − 2 of them, each contributing 180°."}
 ],

 sims:[
  {title:"PhET: Area Model Algebra (shape reasoning)", src:"https://phet.colorado.edu/sims/html/area-model-algebra/latest/area-model-algebra_en.html",
